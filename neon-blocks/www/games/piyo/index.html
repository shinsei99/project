<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="ひよこたちで地球を守れ！カラスの大群から地球を守るタワーディフェンスゲーム">
  <title>ネオンタワー</title>
  <!-- favicon.ico の 404 が唯一の Console エラーだったので、ひよこを埋め込んで潰した -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='36' r='22' fill='%23FFD534'/%3E%3Ccircle cx='32' cy='20' r='14' fill='%23FFDF5A'/%3E%3Ccircle cx='26' cy='18' r='3' fill='%23222'/%3E%3Ccircle cx='38' cy='18' r='3' fill='%23222'/%3E%3Cpath d='M32 23l6 4-6 4-6-4z' fill='%23FF9B21'/%3E%3C/svg%3E">
  <link rel="preload" href="assets/fonts/ZenKakuGothicNew-900.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/ZenKakuGothicNew-500.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/Orbitron-900.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/Orbitron-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css?v=neon21">
<style>
  /* ★2026-08-29: 音ボタンを**画面の右上**に出した（シリーズ共通の位置。neon-blocks/NEON_STYLE.md）。
     これまでは「設定・強化ショップ」の中にしか無く、6本のうちここだけ音を切る場所が違った。
     ★canvas の外に置く。中に描くとタワーの設置タップと当たり判定がぶつかる。 */
  #mute{
    position:fixed; z-index:40;
    top:calc(8px + env(safe-area-inset-top)); right:calc(10px + env(safe-area-inset-right));
    width:44px; height:40px; padding:0; cursor:pointer;
    border:2px solid rgba(65,227,255,.5); border-radius:6px;
    font-size:17px; line-height:1;
    background:rgba(21,14,51,.92); color:#9BE9FF;
    box-shadow:0 0 12px rgba(65,227,255,.28);
  }
  #mute:active{ transform:translateY(1px); }
</style>
</head>
<body>
  <button id="mute" type="button" aria-label="音のオン・オフ">🔊</button>
  <div id="container">
    <!-- ★2026-08-29: HUD も盤の外へ（他5本と同じ作り）。
         盤の中で 82px を占めていたので、外に出したぶん**草原を108→40pxに詰めて**
         canvas をちょうど 9:16 にした。**空（＝敵の落下距離）は654pxのまま**＝難易度は不変。 -->
    <div id="hudbar" class="off">
      <div class="hp"><span class="earth"></span><div class="hpbar"><i id="hp-fill"></i></div><span id="hp-txt">100/100</span></div>
      <div class="stats">
        <span class="chip" id="hb-stage">STAGE 1 / WAVE 1</span>
        <span class="chip" id="hb-score">SCORE 0</span>
        <span class="chip lv" id="hb-lv">Lv.1</span>
        <span class="chip coin" id="hb-coin">0</span>
        <button class="chip pause" id="hb-pause" aria-label="一時停止">❚❚</button>
      </div>
    </div>
    <canvas id="gameCanvas"></canvas>
    <!-- ★2026-08-29: 仲間ボタンを**盤の外**へ出した（他5本と同じ作り。neon-blocks/NEON_STYLE.md）。
         盤の中に描いていたので、①遊びの面にボタンが重なる ②タップ判定が盤の操作とぶつかる
         ③押せる大きさが端末によって変わる、という3つの問題があった。 -->
    <div id="skillbar" class="off">
      <button class="skill" id="sk-gunshi"  data-id="gunshi"  disabled><span class="sn">軍師</span><span class="sc"></span></button>
      <button class="skill" id="sk-nurse"   data-id="nurse"   disabled><span class="sn">ナース</span><span class="sc"></span></button>
      <button class="skill" id="sk-barrier" data-id="barrier" disabled><span class="sn">バリア</span><span class="sc"></span></button>
    </div>
  </div>
  <script src="js/save.js?v=neon21"></script>
  <script src="js/sound.js?v=neon21"></script>
  <script src="js/entities.js?v=neon21"></script>
  <script src="js/upgrades.js?v=neon21"></script>
  <script src="js/render.js?v=neon21"></script>
  <script src="js/ui.js?v=neon21"></script>
  <script src="game.js?v=neon21"></script>
  <script>
    // 音ボタン。BGMと効果音をまとめて切り替える（設定画面の2つのスイッチとも同期する）
    (function(){
      var b = document.getElementById('mute');
      if (!b || typeof SoundManager === 'undefined') return;
      var sync = function(){ var on = SoundManager.bgmOn || SoundManager.seOn;
        b.textContent = on ? '🔊' : '🔇'; b.setAttribute('aria-pressed', String(!on)); };
      sync();
      b.addEventListener('click', function(){
        var on = SoundManager.bgmOn || SoundManager.seOn;   // 片方でも鳴っていれば「消す」
        if (on){ if (SoundManager.bgmOn) SoundManager.toggleBgm(); if (SoundManager.seOn) SoundManager.toggleSe(); }
        else   { SoundManager.toggleBgm(); SoundManager.toggleSe(); }
        sync();
      });
    })();
  </script>
<script src="../_switch.js"></script>
</body>
</html>
