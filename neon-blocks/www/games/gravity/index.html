<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#05030f" />
<meta name="description" content="引いて、離して、重力に任せる。ゲートで色が混ざる宇宙パズル・全20面。" />
<title>ネオングラビティ</title>
<!-- タブのアイコン。SVGを直書きしているのはファイルを増やさないため
     （置き忘れると Console に 404 が残り、本物のエラーが埋もれる） -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2305030f'/%3E%3Ccircle cx='32' cy='32' r='15' fill='none' stroke='%23ff3b5c' stroke-width='3' opacity='.85'/%3E%3Ccircle cx='32' cy='32' r='23' fill='none' stroke='%237df9ff' stroke-width='3' opacity='.7'/%3E%3Ccircle cx='32' cy='32' r='7' fill='%23ffe14d'/%3E%3C/svg%3E" />
<style>
  /* 書体は同梱（assets/fonts/）。取得は tools/fetch-font.py。
     画面の文言を変えたら流し直すこと。忘れると増やした文字が □ になる。 */
  @font-face{ font-family:'CGTitle'; src:url('assets/fonts/Orbitron-700.woff2') format('woff2');
    font-weight:700; font-style:normal; font-display:swap; }
  @font-face{ font-family:'CGTitle'; src:url('assets/fonts/Orbitron-900.woff2') format('woff2');
    font-weight:900; font-style:normal; font-display:swap; }
  @font-face{ font-family:'CGBody'; src:url('assets/fonts/ZenKakuGothicNew-500.woff2') format('woff2');
    font-weight:500; font-style:normal; font-display:swap; }
  @font-face{ font-family:'CGBody'; src:url('assets/fonts/ZenKakuGothicNew-700.woff2') format('woff2');
    font-weight:700; font-style:normal; font-display:swap; }

  :root{
    --cyan:#7df9ff; --cyan-dim:rgba(125,242,255,.55);
    --font-en:'CGTitle','Trebuchet MS',system-ui,sans-serif;
    --font-jp:'CGBody',system-ui,-apple-system,'Hiragino Sans',sans-serif;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; background:#05030f; overflow:hidden;
    font-family:var(--font-jp); font-weight:500; color:#fff; }
  /* 画面の外周をうっすら青く光らせる。宇宙船の窓から見ている感じを出すため */
  body::after{ content:''; position:fixed; inset:0; pointer-events:none; z-index:1;
    background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,0,0,.55) 100%); }
  /* iOSアプリとして全画面で動くので、ノッチとホームバーの領域を避ける（env は Web では 0 になる） */
  #app{ position:relative; z-index:2; width:100%; min-height:100%; display:flex; flex-direction:column;
    align-items:center; justify-content:center; user-select:none;
    padding:calc(10px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right))
            calc(14px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left)); }

  .title{ text-align:center; margin-bottom:7px; position:relative; }
  .title h1{ margin:0; font-family:var(--font-en); font-size:clamp(22px,5.4vw,34px); font-weight:900;
    letter-spacing:.16em; color:#eaffff;
    text-shadow:0 0 6px var(--cyan),0 0 16px var(--cyan),0 0 34px rgba(125,242,255,.55);
    animation:hum 4.2s ease-in-out infinite; }
  .title p{ margin:3px 0 0; font-size:11px; letter-spacing:.14em; color:var(--cyan-dim); }
  @keyframes hum{ 0%,100%{opacity:1} 47%{opacity:.86} 50%{opacity:.97} }

  /* 盤面は 3:2 固定。幅だけで決めると、画面が横に広い端末（iPadの横向き）で
     盤面が高くなりすぎ、下の操作列が画面の外へ出る。**高さからも上限をかける**。
     260px は 見出し＋ヒント＋操作列＋ステージ選択のぶん（実測）。 */
  .stage{ position:relative; margin:0 auto; max-width:900px;
    width:min(100%, calc((100vh - 260px) * 1.5)); }
  @supports (height:100dvh){ .stage{ width:min(100%, calc((100dvh - 260px) * 1.5)); } }
  canvas{ width:100%; aspect-ratio:2/3; display:block; border-radius:16px;
    border:1px solid rgba(60,200,255,.22); box-shadow:0 0 40px rgba(60,200,255,.16),inset 0 0 60px rgba(0,0,0,.6);
    background:#05030f; touch-action:none; }

  .hud{ position:absolute; top:0; left:0; right:0; z-index:10; display:flex;
    justify-content:space-between; padding:8px 10px; pointer-events:none; }
  .col{ display:flex; flex-direction:column; gap:5px; }
  .col.right{ align-items:flex-end; }
  .pill{ display:flex; align-items:center; gap:5px; padding:4px 11px; border-radius:999px;
    background:rgba(0,0,0,.44); backdrop-filter:blur(6px); border:1px solid rgba(255,255,255,.12);
    font-size:12px; font-weight:700; }
  .pill .lbl{ color:rgba(255,255,255,.55); font-weight:500; font-size:10px; }
  .star{ color:#ffe14d; font-size:14px; line-height:1; text-shadow:0 0 6px rgba(255,225,77,.8); }
  .star.spent{ color:rgba(255,255,255,.18); text-shadow:none; }
  .dot{ width:12px; height:12px; border-radius:50%; display:inline-block; }
  .diamond{ width:11px; height:11px; transform:rotate(45deg); display:inline-block; }

  /* 音のオン・オフ。★2026-08-29: HUDの中（盤の右上・小さい丸）から
     **画面の右上に固定**へ変えた（シリーズ共通の位置と見た目。neon-blocks/NEON_STYLE.md）。
     6本のうちここだけ盤の中にあって、切り替えたときに見つからなかった。 */
  #mute{
    position:fixed; z-index:40; pointer-events:auto;
    top:calc(8px + env(safe-area-inset-top)); right:calc(10px + env(safe-area-inset-right));
    width:44px; height:40px; padding:0; cursor:pointer;
    border:2px solid rgba(65,227,255,.5); border-radius:6px;
    font-size:17px; line-height:1;
    background:rgba(21,14,51,.92); color:#9BE9FF;
    box-shadow:0 0 12px rgba(65,227,255,.28); }
  #mute:active{ transform:translateY(1px); }

  .flash{ position:absolute; top:31%; left:0; right:0; z-index:20; display:flex; justify-content:center;
    pointer-events:none; }
  .flash div{ padding:8px 20px; border-radius:12px; background:rgba(0,0,0,.72);
    border:1px solid rgba(244,114,182,.4); color:#fbcfe8; font-weight:700;
    text-shadow:0 0 8px #f472b6; animation:pulse 1s infinite; }
  @keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.55} }

  .overlay{ position:absolute; inset:0; z-index:30; display:flex; align-items:center; justify-content:center;
    border-radius:16px; background:rgba(3,2,12,.72); backdrop-filter:blur(4px); }
  .panel{ text-align:center; padding:22px 26px; border-radius:16px; border:1px solid rgba(125,242,255,.22);
    background:linear-gradient(to bottom,rgba(125,242,255,.07),rgba(0,0,0,.5));
    box-shadow:0 0 50px rgba(60,200,255,.14); max-width:88%; animation:rise .22s ease-out; }
  @keyframes rise{ from{ opacity:0; transform:translateY(10px) } to{ opacity:1; transform:none } }
  .panel .big{ font-family:var(--font-en); font-size:clamp(20px,4.6vw,30px); font-weight:900;
    letter-spacing:.08em; margin-bottom:4px; }
  .panel .sub{ font-size:12px; color:rgba(255,255,255,.62); margin-bottom:14px; }
  .panel .earn{ font-size:26px; letter-spacing:.12em; margin:0 0 12px; }
  .panel .lead{ font-size:12px; color:rgba(190,235,255,.8); line-height:1.7; margin:0 0 16px; }

  .row{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  button{ font-family:inherit; cursor:pointer; border:none; }
  /* ★2026-08-29: 角を落とし、決定ボタンを**マゼンタのネオン管**に（シリーズ共通。NEON_STYLE.md）。
     水色べた塗りの primary は、6本の中でここだけ「塗った面のボタン」で浮いていた。 */
  .btn{ padding:9px 20px; border-radius:5px; font-weight:900; font-size:14px; letter-spacing:.08em;
    background:rgba(21,14,51,.92); color:#EAF6FF; border:2px solid rgba(65,227,255,.5);
    box-shadow:0 0 12px rgba(65,227,255,.22);
    transition:background .15s,transform .1s; }
  .btn:hover{ background:rgba(30,20,70,.95); }
  .btn:active{ transform:translateY(1px); }
  .btn.primary{ background:rgba(255,79,195,.18); color:#fff; border-color:#FF4FC3;
    box-shadow:0 0 14px rgba(255,79,195,.35); }
  .btn.primary:hover{ background:rgba(255,79,195,.28); }

  .hintbar{ width:100%; max-width:900px; margin:9px 0 0; display:flex; justify-content:center; }
  .hintbar div{ padding:7px 14px; border-radius:10px; background:rgba(125,242,255,.06);
    border:1px solid rgba(125,242,255,.16); font-size:12px; color:rgba(206,240,255,.9);
    text-align:center; line-height:1.6; }

  .controls{ margin-top:10px; width:100%; max-width:900px; display:flex; flex-direction:column;
    align-items:center; gap:9px; }
  .ctl-row{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  .small{ padding:6px 15px; font-size:13px; }
  .sel{ display:flex; gap:6px; flex-wrap:wrap; justify-content:center; }
  /* ステージ選択。番号の下に取った★を出すので、正方形ではなく縦長 */
  .lv{ width:34px; height:40px; border-radius:10px; padding:0; gap:1px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.08); color:#fff; }
  .lv .n{ font-family:var(--font-en); font-size:12px; font-weight:700; line-height:1; }
  .lv .s{ font-size:7px; line-height:1; color:#ffe14d; letter-spacing:.5px; height:8px; }
  .lv:hover:not(:disabled){ background:rgba(255,255,255,.2); }
  .lv.done{ border-color:rgba(125,242,255,.45); background:rgba(125,242,255,.12); }
  .lv.cur{ background:var(--cyan); color:#001016; border-color:var(--cyan);
    box-shadow:0 0 14px rgba(125,242,255,.5); }
  .lv.cur .s{ color:#8a5a00; }
  .lv:disabled{ background:rgba(0,0,0,.3); color:rgba(255,255,255,.25);
    border-color:rgba(255,255,255,.05); cursor:not-allowed; }
  .note{ font-size:10.5px; color:rgba(255,255,255,.42); text-align:center; max-width:640px;
    margin:0; line-height:1.65; }
  .hidden{ display:none !important; }

  /* スマホ。盤面は 3:2 固定なので、幅が狭いと高さも縮む。
     HUDをそのままの大きさで乗せると盤面の1/3を隠してしまうので、縁の部品を全部小さくする */
  /* 縦に長い画面（iPhone）では、盤面が 3:2 固定なので上下に大きな余りが出る。
     中央寄せのままだと上下に真っ黒な帯が残るので、余りを部品の間へ等しく配る */
  @media (min-height:760px){ #app{ justify-content:space-evenly; } }

  @media (max-width:520px){
    #app{ padding:calc(6px + env(safe-area-inset-top)) calc(6px + env(safe-area-inset-right))
            calc(10px + env(safe-area-inset-bottom)) calc(6px + env(safe-area-inset-left)); }
    .title{ margin-bottom:4px; }
    .title p{ font-size:9.5px; letter-spacing:.1em; }
    .hud{ padding:6px 7px; }
    .pill{ padding:3px 8px; font-size:10.5px; gap:4px; }
    .pill .lbl{ font-size:9px; }
    .star{ font-size:11px; }
    #mute{ width:40px; height:36px; font-size:15px; }
    .hintbar div{ font-size:11px; padding:6px 10px; }
    .lv{ width:30px; height:36px; }
    .note{ font-size:10px; }
  }
</style>
</head>
<body>
<div id="app">
  <div class="title">
    <h1>NEON&nbsp;GRAVITY</h1>
    <p>ネオングラビティ ／ 宇宙重力×色合成パズル</p>
  </div>

  <div class="stage">
    <div class="hud">
      <div class="col">
        <div class="pill" id="hud-stage">stage</div>
        <div class="pill"><span class="lbl">残弾</span><span id="hud-balls"></span></div>
      </div>
      <div class="col right">
        <button id="mute" aria-label="音のオンとオフ">🔊</button>
        <div class="pill"><span class="lbl">現在</span><span class="dot" id="hud-cur-dot"></span><span id="hud-cur-name"></span></div>
        <div class="pill"><span class="lbl">目標</span><span class="diamond" id="hud-tgt-dot"></span><span id="hud-tgt-name"></span></div>
      </div>
    </div>

    <div class="flash hidden" id="flash"><div id="flash-text"></div></div>

    <canvas id="game"></canvas>

    <div class="overlay hidden" id="overlay">
      <div class="panel" id="panel"></div>
    </div>
  </div>

  <!-- ヒントはキャンバスの外に出す。中に置くと砲台と重なって読めなかった -->
  <div class="hintbar"><div id="hud-hint"></div></div>

  <div class="controls">
    <div class="ctl-row">
      <button class="btn small" id="btn-retry">↺ リトライ</button>
      <button class="btn small" id="btn-solve">💡 正解を見る</button>
      <button class="btn small" id="btn-skip">ステージスキップ ⏭</button>
    </div>
    <div class="sel" id="selector"></div>
    <p class="note">砲台をドラッグして引っ張り、離すと星が発射。点線は予測軌道。ゲートで色が混ざり、結晶と同じ色で当てればクリア。全20面。一発で決めると★3つ。詰まったら「💡 正解を見る」で正解の軌道を再現できる。</p>
  </div>
</div>

<script>
/* =========================================================================
   カラー・グラビティ (Color Gravity) — 完全自己完結 / CDN不要
   加法混色: 星の色は原色集合 {R,B,Y}。ゲート通過で原色が加算される。
   重力ルール: 星が含む原色を持つ惑星だけが引力を及ぼす(属性一致)。
   ゴール: 結晶(目標色)と同色になって体当たり → クリア。色違いは弾かれる。
   ========================================================================= */
"use strict";

/* ===================== 物理ここから =====================
   ★この区間は tools/verify_solutions.py が抜き出してそのまま実行する。
     各ステージの sol（正解の発射ベクトル）は、この物理で解いた実測値。
     定数を1つ変えるだけで全20面の「正解を見る」が的を外す。見た目のために触らないこと。

   ★2026-08-28に足した `s.bounced` と `s.lastGate` は、音と演出のための**印だけ**。
     stepSim はこの2つを読まないので軌道は1ミリも変わらない。
     最初は反射で `return 'bounce'` にしたが、それだと同じフレームのゲート判定と結晶判定が
     飛ばされて軌道が変わる（＝鏡のある5・7・13・16・19面の sol が外れる）。戻り値は増やさないこと。 */
const W=600,H=900,STAR_R=7,G_CONST=1.0,MAX_SPEED=16,MAX_PULL=210,LAUNCH_SPEED=12;
const PRIMARIES=['R','B','Y'];
const keyOf=set=>PRIMARIES.filter(c=>set.has(c)).join('');

// ------------------ ステージ定義 (全20面) ------------------
// sol: 正解の発射速度ベクトル(物理ソルバーで探索済・必ずクリアできる)。「正解を見る」で再現。
const STAGES=[
  { name:'1. 重力で曲げろ',
    hint:'右から星をスリングショット。赤い惑星の引力で軌道が曲がる。赤い結晶に当てろ！',
    balls:5, start:['R'], cannon:{x:450,y:558},
    planets:[{x:480,y:320,r:48,mass:6000,color:'R'}], gates:[],
    crystal:{x:235,y:165,r:22,key:'R'}, blackholes:[], reflectors:[],
    sol:{vx:-6.5826,vy:-5.236} },
  { name:'2. ゲートで染まれ',
    hint:'無色の星は引力を受けない。青ゲートをくぐると青に染まり、青惑星に引かれる。',
    balls:5, start:[], cannon:{x:450,y:558},
    planets:[{x:300,y:235,r:42,mass:4600,color:'B'}],
    gates:[{id:'g1',x:455,y:415,r:34,primary:'B'}],
    crystal:{x:165,y:165,r:22,key:'B'}, blackholes:[], reflectors:[],
    sol:{vx:-1.2167,vy:-7.682} },
  { name:'3. 二色を混ぜろ（紫）',
    hint:'赤ゲート＋青ゲートの両方を通れば紫になる。紫の結晶を狙え。',
    balls:5, start:[], cannon:{x:450,y:558},
    planets:[{x:470,y:300,r:44,mass:5400,color:'R'}],
    gates:[{id:'g1',x:610,y:430,r:40,primary:'R'},{id:'g2',x:300,y:300,r:40,primary:'B'}],
    crystal:{x:185,y:170,r:24,key:'RB'}, blackholes:[], reflectors:[],
    sol:{vx:4.9075,vy:-2.8333} },
  { name:'4. ブラックホール回避（緑）',
    hint:'青→黄ゲートを横に通って緑に。下のブラックホールを避け、黄惑星で左上の結晶へ。',
    balls:5, start:[], cannon:{x:450,y:558},
    planets:[{x:660,y:250,r:38,mass:4200,color:'Y'}],
    gates:[{id:'g1',x:450,y:470,r:40,primary:'B'},{id:'g2',x:450,y:380,r:40,primary:'Y'}],
    crystal:{x:560,y:150,r:24,key:'BY'},
    blackholes:[{x:300,y:330,r:22,mass:7000}], reflectors:[],
    sol:{vx:3.1257,vy:0.2186} },
  { name:'5. プリズムの試練（白）',
    hint:'赤・青・黄を横に通れば白に。下のプリズム(赤を弾く壁)とブラックホールに注意。',
    balls:5, start:[], cannon:{x:450,y:558},
    planets:[{x:660,y:300,r:34,mass:3400,color:'Y'}],
    gates:[{id:'g1',x:450,y:480,r:38,primary:'R'},{id:'g2',x:450,y:410,r:38,primary:'B'},{id:'g3',x:450,y:340,r:38,primary:'Y'}],
    crystal:{x:560,y:150,r:24,key:'RBY'},
    blackholes:[{x:280,y:300,r:20,mass:6000}],
    reflectors:[{x1:300,y1:430,x2:300,y2:520,color:'R'}],
    sol:{vx:0.7121,vy:-5.4089} },
  { name:'6. 橙の航路（橙）',
    hint:'赤＋黄＝橙。上下のゲートを弧で通り、黄惑星の引力で左の結晶へ。',
    balls:5, start:[], cannon:{x:450,y:558},
    planets:[{x:470,y:300,r:42,mass:5000,color:'Y'}],
    gates:[{id:'g1',x:300,y:430,r:40,primary:'R'},{id:'g2',x:620,y:430,r:40,primary:'Y'}],
    crystal:{x:455,y:140,r:24,key:'RY'}, blackholes:[], reflectors:[],
    sol:{vx:3.6986,vy:-1.9666} },
  { name:'7. 鏡で跳ね返せ（赤）',
    hint:'赤い星を上の鏡で跳ね返し、赤惑星で曲げて左下の結晶へ。',
    balls:5, start:['R'], cannon:{x:200,y:558},
    planets:[{x:560,y:330,r:44,mass:6000,color:'R'}], gates:[],
    crystal:{x:250,y:160,r:24,key:'R'}, blackholes:[],
    reflectors:[{x1:640,y1:200,x2:760,y2:360,color:'R'}],
    sol:{vx:-0.9587,vy:-4.5103} },
  { name:'8. 重力スイングバイ（青）',
    hint:'青ゲートで染まり、青惑星をスイングバイして左上へ回り込め。',
    balls:5, start:[], cannon:{x:450,y:558},
    planets:[{x:450,y:300,r:46,mass:6400,color:'B'}],
    gates:[{id:'g1',x:450,y:470,r:42,primary:'B'}],
    crystal:{x:680,y:200,r:24,key:'B'}, blackholes:[], reflectors:[],
    sol:{vx:-3.317,vy:-6.8009} },
  { name:'9. 紫の二重星',
    hint:'横の赤・青ゲートで紫に。上の赤惑星に引かれて左上の結晶へ。',
    balls:5, start:[], cannon:{x:450,y:558},
    planets:[{x:560,y:300,r:40,mass:4800,color:'R'}],
    gates:[{id:'g1',x:450,y:470,r:40,primary:'R'},{id:'g2',x:450,y:385,r:40,primary:'B'}],
    crystal:{x:650,y:185,r:24,key:'RB'}, blackholes:[], reflectors:[],
    sol:{vx:-0.0679,vy:-7.7775} },
  { name:'10. 緑の弧を描け',
    hint:'青い星を上の黄惑星でスイングバイ。緑になって左上へ大きく弧を描け。',
    balls:5, start:['B'], cannon:{x:200,y:558},
    planets:[{x:560,y:320,r:44,mass:6000,color:'Y'}],
    gates:[{id:'g1',x:330,y:380,r:40,primary:'Y'}],
    crystal:{x:720,y:170,r:24,key:'BY'}, blackholes:[], reflectors:[],
    sol:{vx:6.3482,vy:-8.1253} },

/* ★2026-08-29: 横（900×600）→ **縦（600×900）** にした。
   シリーズ6本のうちここだけ横長で、スマホを縦に持つと盤が小さくなっていた
   （型は neon-blocks/NEON_STYLE.md）。

   ステージは横長の座標で書いてあるので、**読み込む前に90°回して写す**。
   ・位置  (x, y) → (y, 900 - x)
   ・速度  (vx,vy) → (vy, -vx)      ※正解データ sol も同じ規則で回る
   ・半径・質量・色はそのまま
   こうすると**物理には一切触らずに**縦になる（軌道は座標ごと回るだけ）。
   ★確認は tools/verify_solutions.py（物理区間を抜き出して node で実行し、全20面が
     正解に到達するかを見る）。回し忘れ・回し間違いがあればここで落ちる。 */
const OLD_W = 900;
const rotPt = o => { const x = o.x, y = o.y; o.x = y; o.y = OLD_W - x; return o; };
STAGES.forEach(st => {
  rotPt(st.cannon);
  st.planets.forEach(rotPt);
  (st.gates || []).forEach(rotPt);
  rotPt(st.crystal);
  (st.blackholes || []).forEach(rotPt);
  (st.reflectors || []).forEach(r => {
    const x1 = r.x1, y1 = r.y1, x2 = r.x2, y2 = r.y2;
    r.x1 = y1; r.y1 = OLD_W - x1;
    r.x2 = y2; r.y2 = OLD_W - x2;
  });
  if (st.sol){ const vx = st.sol.vx, vy = st.sol.vy; st.sol.vx = vy; st.sol.vy = -vx; }
});


// ------------------ 物理ステップ ------------------
function stepSim(s, st, triggered){
  let ax=0,ay=0;
  for(const p of st.planets){
    if(!s.color.has(p.color)) continue;
    const dx=p.x-s.x, dy=p.y-s.y, d2=dx*dx+dy*dy, d=Math.sqrt(d2)||1e-4;
    if(d<p.r+STAR_R) return 'crash';
    const f=G_CONST*p.mass/Math.max(d2,p.r*p.r); ax+=f*dx/d; ay+=f*dy/d;
  }
  for(const b of st.blackholes){
    const dx=b.x-s.x, dy=b.y-s.y, d2=dx*dx+dy*dy, d=Math.sqrt(d2)||1e-4;
    if(d<b.r+STAR_R) return 'blackhole';
    const f=G_CONST*b.mass/Math.max(d2,b.r*b.r*0.4); ax+=f*dx/d; ay+=f*dy/d;
  }
  s.vx+=ax; s.vy+=ay;
  const sp=Math.hypot(s.vx,s.vy);
  if(sp>MAX_SPEED){ s.vx=s.vx/sp*MAX_SPEED; s.vy=s.vy/sp*MAX_SPEED; }
  s.x+=s.vx; s.y+=s.vy;
  for(const r of st.reflectors){
    if(!s.color.has(r.color)) continue;
    const abx=r.x2-r.x1, aby=r.y2-r.y1;
    const t=Math.max(0,Math.min(1,((s.x-r.x1)*abx+(s.y-r.y1)*aby)/(abx*abx+aby*aby||1)));
    const cx=r.x1+abx*t, cy=r.y1+aby*t;
    let dx=s.x-cx, dy=s.y-cy, dist=Math.hypot(dx,dy)||1e-4;
    if(dist<STAR_R+6){ const nx=dx/dist, ny=dy/dist, vd=s.vx*nx+s.vy*ny;
      if(vd<0){ s.vx-=2*vd*nx; s.vy-=2*vd*ny; s.x=cx+nx*(STAR_R+7); s.y=cy+ny*(STAR_R+7); s.bounced=true; } }
  }
  for(const g of st.gates){
    if(Math.hypot(g.x-s.x,g.y-s.y)<g.r && !triggered.has(g.id)){ triggered.add(g.id); s.color.add(g.primary); s.lastGate=g.primary; return 'gate'; }
  }
  const cr=st.crystal;
  if(Math.hypot(cr.x-s.x,cr.y-s.y)<cr.r+STAR_R){
    if(keyOf(s.color)===cr.key) return 'win';
    let dx=s.x-cr.x, dy=s.y-cr.y, dist=Math.hypot(dx,dy)||1e-4;
    const nx=dx/dist, ny=dy/dist, vd=s.vx*nx+s.vy*ny;
    if(vd<0){ s.vx-=2*vd*nx; s.vy-=2*vd*ny; }
    s.x=cr.x+nx*(cr.r+STAR_R+2); s.y=cr.y+ny*(cr.r+STAR_R+2);
    return 'reject';
  }
  /* 画面外の判定。★上下左右で余裕が違う点に注意（打ち出した先へ大きく飛ぶのを許すため）。
     もとは「上に 650px の余裕」だった（下から打ち上げる形だったので、画面上へ大きく外れて
     戻ってくる軌道を殺さないため）。**盤を90°回したので、その余裕も回して「左」に移した**。
     ここを回し忘れると、正解のはずの軌道が途中で out になる（実測: 20面中3面が落ちた）。 */
  if(s.x<-650||s.x>W+70||s.y>H+70||s.y<-70) return 'out';
  return 'none';
}
function computeLaunch(cannon,ax,ay){
  let px=cannon.x-ax, py=cannon.y-ay, mag=Math.hypot(px,py)||1e-4;
  const power=Math.min(mag,MAX_PULL)/MAX_PULL;
  return { vx:(px/mag)*LAUNCH_SPEED*power, vy:(py/mag)*LAUNCH_SPEED*power, power, dx:px/mag, dy:py/mag };
}

const HEX={ '':'#cdd6ff','R':'#ff3b5c','B':'#3b8bff','Y':'#ffe14d',
  'RB':'#c14dff','RY':'#ff9b3b','BY':'#39ff9d','RBY':'#ffffff' };
const JNAME={ '':'無色','R':'赤','B':'青','Y':'黄','RB':'紫','RY':'橙','BY':'緑','RBY':'白' };
const hexOf=set=>HEX[keyOf(set)]||'#fff';
const TAU=Math.PI*2;

/* ===================== 音 =====================
   ★音のファイルは1つも同梱していない。ぜんぶ WebAudio の合成音。
     容量が増えず、素材のライセンスを持ち込まずに済むため。

   録音した素材に差し替えたいとき（耳で確かめられる人がやること）:
     1. assets/audio/ に launch.mp3 gate.mp3 … を置く（名前は SFX_FILES のとおり）
     2. 下の USE_FILES を true にする  ← コードの変更はこれだけ
     3. 見つからないファイルは、そのキーだけ合成音のまま鳴る（落ちない）

   ★持ち込んでよい素材: **商用可 かつ 再配布可** のものだけ。
     このリポジトリは public で GitHub Pages から配信している。
     効果音ラボ（商用可・クレジット表記不要）か CC0 が安全。 */
const USE_FILES=false;
const AUDIO_DIR='assets/audio/';
const SFX_FILES={ aim:'aim.mp3', launch:'launch.mp3', gate:'gate.mp3', bounce:'bounce.mp3',
  crash:'crash.mp3', hole:'hole.mp3', reject:'reject.mp3', win:'win.mp3', over:'over.mp3', ui:'ui.mp3' };

let audio=null, masterGain=null, sfxGain=null, musGain=null, noiseBuf=null;
const buffers={};
let soundOn=true;
try{ soundOn = localStorage.getItem('color_gravity_sound')!=='off'; }catch(e){}

// iOS は「画面を触るまで」音を出せないので、最初の操作で作る
function initAudio(){
  if(audio){ if(audio.state==='suspended') audio.resume(); return; }
  try{ audio=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
  masterGain=audio.createGain(); masterGain.gain.value=soundOn?1:0; masterGain.connect(audio.destination);
  sfxGain=audio.createGain(); sfxGain.gain.value=0.9; sfxGain.connect(masterGain);
  musGain=audio.createGain(); musGain.gain.value=0.24;   // ★シリーズ共通の音量（NEON_STYLE.md） musGain.connect(masterGain);
  // ホワイトノイズ。噴射音・爆発音は正弦波だけでは作れない
  noiseBuf=audio.createBuffer(1, audio.sampleRate*1.2, audio.sampleRate);
  const d=noiseBuf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  if(USE_FILES) loadSfxFiles();
  startMusic();
}
function loadSfxFiles(){
  for(const key in SFX_FILES){
    fetch(AUDIO_DIR+SFX_FILES[key])
      .then(r=>r.ok?r.arrayBuffer():Promise.reject(new Error('404')))
      .then(b=>audio.decodeAudioData(b))
      .then(buf=>{ buffers[key]=buf; })
      .catch(()=>{});    // 無ければ、そのキーだけ合成音のまま
  }
}
function setSound(on){
  soundOn=on;
  try{ localStorage.setItem('color_gravity_sound', on?'on':'off'); }catch(e){}
  if(masterGain) masterGain.gain.setTargetAtTime(on?1:0, audio.currentTime, 0.02);
  const b=document.getElementById('mute');
  if(b){ b.textContent=on?'🔊':'🔇'; b.setAttribute('aria-pressed', String(!on)); }
}

// 1音。立ち上がりと減衰を付けないと「ピー」と鳴りっぱなしに聞こえる
function voice(freq, when, dur, type, gain, dest, slideTo){
  if(!audio) return;
  const o=audio.createOscillator(), g=audio.createGain();
  o.type=type||'sine';
  o.frequency.setValueAtTime(freq, when);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo), when+dur);
  g.gain.setValueAtTime(0.0001, when);
  g.gain.exponentialRampToValueAtTime(gain, when+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, when+dur);
  o.connect(g); g.connect(dest||sfxGain);
  o.start(when); o.stop(when+dur+0.02);
}
// ノイズを帯域で削って「シュッ」「ドンッ」を作る
function noise(when, dur, gain, filterType, freq, sweepTo){
  if(!audio||!noiseBuf) return;
  const s=audio.createBufferSource(); s.buffer=noiseBuf;
  const f=audio.createBiquadFilter(); f.type=filterType||'bandpass';
  f.frequency.setValueAtTime(freq, when);
  if(sweepTo) f.frequency.exponentialRampToValueAtTime(Math.max(30,sweepTo), when+dur);
  f.Q.value=1.1;
  const g=audio.createGain();
  g.gain.setValueAtTime(0.0001, when);
  g.gain.exponentialRampToValueAtTime(gain, when+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, when+dur);
  s.connect(f); f.connect(g); g.connect(sfxGain);
  s.start(when); s.stop(when+dur+0.02);
}
function sfx(name, arg){
  if(!audio||!soundOn) return;
  if(buffers[name]){ const s=audio.createBufferSource(); s.buffer=buffers[name]; s.connect(sfxGain); s.start(); return; }
  const t=audio.currentTime;
  const seq=(notes,step,dur,type,gain)=>notes.forEach((f,i)=>voice(f,t+i*step,dur,type,gain));
  switch(name){
    // ゴムを引く音。引っ張るほど高くなるので arg(0〜1)で音程を変える
    case 'aim':    voice(280+220*(arg||0), t, 0.06, 'square', 0.05); break;
    case 'launch': noise(t,0.26,0.16,'bandpass',1800,300);
                   voice(420,t,0.24,'triangle',0.12,null,120); break;
    // ゲートは通った色で音程が変わる（赤=ド 青=ミ 黄=ソ）。耳でも色が分かる
    case 'gate':   { const f={R:523.25,B:659.25,Y:783.99}[arg]||523.25;
                     voice(f,t,0.28,'triangle',0.15); voice(f*2,t+0.03,0.20,'sine',0.06); } break;
    case 'bounce': voice(1400,t,0.07,'square',0.07,null,2100);
                   noise(t,0.06,0.05,'highpass',2400); break;
    case 'crash':  noise(t,0.34,0.20,'lowpass',900,120);
                   voice(150,t,0.30,'sawtooth',0.13,null,50); break;
    case 'hole':   voice(320,t,0.75,'sawtooth',0.11,null,42);
                   voice(160,t+0.05,0.80,'sine',0.09,null,30);
                   noise(t,0.7,0.06,'lowpass',600,80); break;
    case 'reject': voice(180,t,0.13,'square',0.09,null,140);
                   voice(140,t+0.09,0.13,'square',0.07,null,105); break;
    // クリアは Cメジャーのアルペジオ＋上に伸びるきらめき
    case 'win':    seq([523.25,659.25,783.99,1046.5],0.09,0.55,'triangle',0.15);
                   seq([1046.5,1318.5,1568,2093],0.09,0.40,'sine',0.05); break;
    case 'over':   voice(392,t,0.45,'sawtooth',0.11,null,150);
                   voice(261.63,t+0.16,0.60,'sine',0.09,null,90);
                   voice(196,t+0.34,0.80,'sine',0.08,null,70); break;
    case 'ui':     voice(880,t,0.05,'triangle',0.09,null,1200); break;
  }
}

/* BGM。Aマイナー・ペンタトニック（ラ・ド・レ・ミ・ソ）だけを使う。
   どの順に鳴らしても濁らないので、短いループでも耳障りになりにくい。
   ゆっくりしたパッド＋まばらな高音のきらめきで「宇宙にいる感じ」を作る。 */
const MUSIC={ step:0, next:0, timer:null, bpm:66,
  bell:[12,15,19,15, 12,10,7,10, 12,19,22,19, 15,12,10,7],
  bass:[0,0,-4,-4, -5,-5,-7,-7] };
function startMusic(){
  if(!audio||MUSIC.timer) return;
  MUSIC.next=audio.currentTime+0.2;
  MUSIC.timer=setInterval(musicTick,110);
}
// 長く伸びる和音。立ち上がりを遅くしないと「ボッ」と鳴って宇宙に聞こえない
function pad(root, when, dur){
  if(!audio) return;
  [1,1.5,2.005].forEach((mul,i)=>{
    const o=audio.createOscillator(), g=audio.createGain();
    o.type='sine'; o.frequency.setValueAtTime(root*mul, when);
    g.gain.setValueAtTime(0.0001, when);
    g.gain.exponentialRampToValueAtTime(0.035/(i+1), when+dur*0.35);
    g.gain.exponentialRampToValueAtTime(0.0001, when+dur);
    o.connect(g); g.connect(musGain); o.start(when); o.stop(when+dur+0.05);
  });
}
// 先読みして予約する方式。setInterval で直接鳴らすとタイミングがぶれる
function musicTick(){
  if(!audio) return;
  const beat=60/MUSIC.bpm;
  if(MUSIC.next<audio.currentTime) MUSIC.next=audio.currentTime+0.05;  // 復帰時の一気鳴り防止
  while(MUSIC.next<audio.currentTime+0.4){
    const t=MUSIC.next, s=MUSIC.step;
    // ★2026-08-29: 調を A → **G** に（シリーズ6本で調を分ける決まり。neon-blocks/NEON_STYLE.md）
    if(s%8===0) pad(98.00*Math.pow(2, MUSIC.bass[(s>>3)%MUSIC.bass.length]/12), t, beat*8);
    if(s%2===0){
      voice(196.00*Math.pow(2, MUSIC.bell[(s>>1)%MUSIC.bell.length]/12),
            t, beat*1.4, 'sine', 0.03, musGain);
    }
    MUSIC.next+=beat; MUSIC.step++;
  }
}
// 裏に回ったら止める（電池とスピーカーの行儀）
document.addEventListener('visibilitychange',()=>{
  if(!audio) return;
  if(document.hidden) audio.suspend(); else audio.resume();
});

  catch(e){ return {}; }
}
function saveProgress(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify({ maxUnlocked:G.maxUnlocked, stars:G.stars })); }
  catch(e){}
}
// 残弾を減らさずクリアで★3。使った弾が2つまでで★2、それ以上は★1
function rateStars(used){ return used<=0?3:(used<=2?2:1); }

// ------------------ 描画の下ごしらえ ------------------
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const dpr=Math.min(window.devicePixelRatio||1,2);
canvas.width=W*dpr; canvas.height=H*dpr; ctx.scale(dpr,dpr);

// 星空は3層。奥ほど小さく暗く、ゆっくり流れる（視差＝奥行きに見える）
const LAYERS=[
  { n:90, sp:0.020, r:[0.3,0.9], a:[0.15,0.40] },
  { n:45, sp:0.055, r:[0.7,1.5], a:[0.30,0.65] },
  { n:18, sp:0.110, r:[1.1,2.2], a:[0.45,0.90] },
];
const starfield=LAYERS.map(L=>Array.from({length:L.n},()=>({
  x:Math.random()*W, y:Math.random()*H,
  r:L.r[0]+Math.random()*(L.r[1]-L.r[0]),
  a:L.a[0]+Math.random()*(L.a[1]-L.a[0]),
  tw:Math.random()*TAU, sp:L.sp })));
// 流れ星。たまに横切るだけ。動きがあると画面が生きて見える
let comet=null, cometNext=180;

const G={ stage:null, idx:0, mode:'title', t:0, balls:0, maxUnlocked:0, stars:{},
  star:null, trail:[], particles:[], triggered:new Set(),
  aim:{active:false,x:0,y:0}, solPath:null, shake:0, winFlash:0, aimTick:0 };

const $=id=>document.getElementById(id);
let flashTimer=null;
function flash(txt){ $('flash-text').textContent=txt; $('flash').classList.remove('hidden');
  if(flashTimer)clearTimeout(flashTimer); flashTimer=setTimeout(()=>$('flash').classList.add('hidden'),1300); }
function addShake(v){ G.shake=Math.min(16,G.shake+v); }

function syncHUD(){
  const st=G.stage; const sk=G.star?keyOf(G.star.color):keyOf(new Set(st.start));
  $('hud-stage').textContent=st.name;
  let stars='';
  for(let i=0;i<G.balls;i++) stars+='<span class="star">★</span>';
  for(let i=G.balls;i<st.balls;i++) stars+='<span class="star spent">★</span>';
  $('hud-balls').innerHTML = G.balls>0?stars:'<span style="font-size:10px;color:#f87171">なし</span>';
  $('hud-cur-dot').style.background=HEX[sk]; $('hud-cur-dot').style.boxShadow='0 0 8px '+HEX[sk];
  $('hud-cur-name').textContent=JNAME[sk];
  $('hud-tgt-dot').style.background=HEX[st.crystal.key]; $('hud-tgt-dot').style.boxShadow='0 0 8px '+HEX[st.crystal.key];
  $('hud-tgt-name').textContent=JNAME[st.crystal.key];
  $('hud-hint').textContent=st.hint;
}
function buildSelector(){
  const wrap=$('selector'); wrap.innerHTML='';
  STAGES.forEach((s,i)=>{
    const b=document.createElement('button');
    const got=G.stars[i]||0;
    b.className='lv'+(i===G.idx?' cur':'')+(got?' done':'');
    const locked=i>G.maxUnlocked; b.disabled=locked;
    b.innerHTML='<span class="n">'+(locked?'🔒':(i+1))+'</span>'
      +'<span class="s">'+(got?'★'.repeat(got):'')+'</span>';
    b.onclick=()=>{ sfx('ui'); selectStage(i); };
    wrap.appendChild(b);
  });
}
function showOverlay(html){ $('panel').innerHTML=html; $('overlay').classList.remove('hidden'); }
function hideOverlay(){ $('overlay').classList.add('hidden'); }

function init(i){
  G.idx=i; G.stage=JSON.parse(JSON.stringify(STAGES[i]));
  G.mode='aim'; G.star=null; G.trail=[]; G.particles=[]; G.triggered=new Set();
  G.aim.active=false; G.solPath=null; G.winFlash=0;
  G.balls=G.stage.balls; hideOverlay(); syncHUD(); buildSelector();
}
function selectStage(i){ if(i>G.maxUnlocked) return; init(i); }
function retry(){ sfx('ui'); init(G.idx); }
// スキップした先はそのまま解放する。飛ばした面が🔒のままだと、
// いま遊んでいる面が選択欄で鍵になり「押せないのに現在地」というちぐはぐな見た目になる
function skip(){ sfx('ui'); const n=Math.min(STAGES.length-1,G.idx+1);
  G.maxUnlocked=Math.max(G.maxUnlocked,n); saveProgress(); init(n); }
function nextStage(){ sfx('ui'); const n=Math.min(STAGES.length-1,G.idx+1); init(n); }

// ------------------ タイトル画面 ------------------
// 見た目の入口であると同時に、音の入口でもある（iOSは操作なしでは鳴らせない）
function showTitle(){

  const total=Object.values(G.stars).reduce((a,b)=>a+b,0);
  const cont=G.maxUnlocked>0;
  // ★2026-08-29: 見出しの並びをシリーズ共通の型へ（ラテンを小さくマゼンタ・日本語を大きく発光）
  showOverlay('<div class="sub" style="color:#FF4FC3;letter-spacing:.34em;font-weight:700;'

    +'<div class="big" style="color:#fff;letter-spacing:.18em;'
    +'text-shadow:0 0 12px #41e3ff,0 0 30px rgba(255,79,195,.5)">ネオングラビティ</div>'
    +'<p class="lead">引いて、離して、重力に任せる。<br>'
    +'ゲートをくぐるたび星の色が混ざり、<br>結晶と同じ色になって当たればクリア。</p>'
    +(cont?'<div class="earn"><span class="star">★</span> '+total+' / '+(STAGES.length*3)+'</div>':'')

function launch(){
  if(G.mode!=='aim') return;
  const lr=computeLaunch(G.stage.cannon,G.aim.x,G.aim.y);
  if(lr.power<0.06) return;
  G.star={ x:G.stage.cannon.x, y:G.stage.cannon.y, vx:lr.vx, vy:lr.vy, color:new Set(G.stage.start) };
  G.trail=[]; G.triggered=new Set(); G.mode='flying'; sfx('launch'); syncHUD();
  // 発射の噴射。後ろへ吹き出す
  const col=hexOf(G.star.color);
  for(let k=0;k<16;k++){ const a=Math.atan2(-lr.vy,-lr.vx)+(Math.random()-0.5)*0.9, sp=Math.random()*2.4+0.6;
    G.particles.push({x:G.star.x,y:G.star.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:22,max:22,color:col,size:Math.random()*2+1}); }
}
// ------------------ 正解再現（デモ） ------------------
// 保存済みの正解ベクトル sol で星を飛ばし、正しい軌道を再現する。残弾は消費しない。
function computeSolPath(st){
  const sim={x:st.cannon.x,y:st.cannon.y,vx:st.sol.vx,vy:st.sol.vy,color:new Set(st.start)};
  const tg=new Set(), pts=[];
  for(let i=0;i<1500;i++){ pts.push({x:sim.x,y:sim.y});
    const ev=stepSim(sim,st,tg);
    if(ev==='win'||ev==='crash'||ev==='out'||ev==='blackhole') break; }
  return pts;
}
function showSolution(){
  if(G.mode!=='aim') return;
  const st=G.stage; if(!st.sol) return;
  sfx('ui');
  G.solPath=computeSolPath(st);
  G.star={ x:st.cannon.x, y:st.cannon.y, vx:st.sol.vx, vy:st.sol.vy, color:new Set(st.start) };
  G.trail=[]; G.triggered=new Set(); G.aim.active=false; G.mode='demo'; syncHUD();
  flash('正解の軌道を再現中…');
}

function loseBall(){
  G.balls--;
  if(G.balls<=0){ G.balls=0; G.mode='lost'; sfx('over');
    showOverlay('<div class="big" style="color:#f87171;text-shadow:0 0 10px #f87171">GAME OVER</div>'
      +'<div class="sub">残弾がなくなった…</div>'
      +'<div class="row"><button class="btn primary" id="ov-retry">リトライ</button>'
      +'<button class="btn" id="ov-skip">スキップ →</button></div>');
    $('ov-retry').onclick=retry; $('ov-skip').onclick=skip;
  } else { G.mode='aim'; G.star=null; G.triggered=new Set(); }
  syncHUD();
}
function doWin(fromDemo){
  G.mode='won'; sfx('win'); addShake(9); G.winFlash=1;
  const used=G.stage.balls-G.balls;
  // 「正解を見る」で通したときは★1止まり。自分で当てれば上書きできる（★は自力の証）
  const got=fromDemo?1:rateStars(used), prev=G.stars[G.idx]||0;
  if(got>prev) G.stars[G.idx]=got;
  G.maxUnlocked=Math.max(G.maxUnlocked,Math.min(STAGES.length-1,G.idx+1));
  saveProgress();
  const cr=G.stage.crystal, col=HEX[cr.key];
  // 結晶の破片。大きめの粒を放射状に飛ばす
  for(let k=0;k<90;k++){ const a=Math.random()*TAU, sp=Math.random()*6+1;
    G.particles.push({x:cr.x,y:cr.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:70,max:70,color:col,size:Math.random()*3.4+1}); }
  buildSelector();
  const last=G.idx>=STAGES.length-1;
  const allStars=Object.values(G.stars).reduce((a,b)=>a+b,0);
  showOverlay('<div class="big" style="color:'+col+';text-shadow:0 0 10px '+col+'">STAGE CLEAR!</div>'
    +'<div class="sub">'+JNAME[cr.key]+'の結晶を共鳴させた</div>'
    +'<div class="earn">'+'<span class="star">★</span>'.repeat(got)
      +'<span class="star spent">★</span>'.repeat(3-got)+'</div>'
    +(fromDemo?'<p class="lead" style="margin:-6px 0 12px">正解を見てのクリアは★1つ。自分で当てれば上書きできる</p>'
      :(got<3?'<p class="lead" style="margin:-6px 0 12px">一発で決めると★3つ</p>':''))
    +'<div class="row">'
    +(last?'<div class="btn primary" style="cursor:default;background:linear-gradient(90deg,#ec4899,#facc15);border:none">全ステージ制覇！★'+allStars+'</div>'
          :'<button class="btn primary" id="ov-next">次のステージ →</button>')
    +'<button class="btn" id="ov-again">もう一度</button></div>');
  if(!last) $('ov-next').onclick=nextStage;
  $('ov-again').onclick=retry;
}

// ------------------ 入力 ------------------
function toLocal(e){ const r=canvas.getBoundingClientRect();
  return { x:(e.clientX-r.left)/r.width*W, y:(e.clientY-r.top)/r.height*H }; }
canvas.addEventListener('pointerdown',e=>{ initAudio(); if(G.mode!=='aim')return; e.preventDefault();
  const p=toLocal(e); G.aim.active=true; G.aim.x=p.x; G.aim.y=p.y; G.aimTick=0; });
window.addEventListener('pointermove',e=>{ if(!G.aim.active)return; const p=toLocal(e); G.aim.x=p.x; G.aim.y=p.y; });
window.addEventListener('pointerup',()=>{ if(!G.aim.active)return; G.aim.active=false; launch(); });
$('btn-retry').onclick=retry; $('btn-skip').onclick=skip; $('btn-solve').onclick=showSolution;
$('mute').addEventListener('click',()=>{ initAudio(); setSound(!soundOn); });
// キーボードでも遊べるように（R=リトライ / S=正解 / M=消音）
window.addEventListener('keydown',e=>{
  if(e.key==='r'||e.key==='R') retry();
  else if(e.key==='s'||e.key==='S') showSolution();
  else if(e.key==='m'||e.key==='M'){ initAudio(); setSound(!soundOn); }
});

// ------------------ 描画部品 ------------------
function glowCircle(c,x,y,r,color,blur){ c.save(); c.shadowColor=color; c.shadowBlur=blur;
  c.fillStyle=color; c.beginPath(); c.arc(x,y,r,0,TAU); c.fill(); c.restore(); }

function drawStar(x,y,r,color,t){ ctx.save(); ctx.translate(x,y); ctx.rotate(t*0.01);
  ctx.shadowColor=color; ctx.shadowBlur=18; ctx.fillStyle=color; ctx.beginPath();
  for(let i=0;i<10;i++){ const ang=Math.PI/5*i-Math.PI/2, rad=i%2?r*0.45:r;
    const px=Math.cos(ang)*rad, py=Math.sin(ang)*rad; i?ctx.lineTo(px,py):ctx.moveTo(px,py); }
  ctx.closePath(); ctx.fill(); ctx.fillStyle='#fff'; ctx.shadowBlur=0;
  ctx.beginPath(); ctx.arc(0,0,r*0.25,0,TAU); ctx.fill(); ctx.restore(); }

// 惑星。ただの円だと「引力を持つ星」に見えないので、縞・輪・明暗の境界を足す
function drawPlanet(p,t,active){
  const col=HEX[p.color];
  const seed=(p.x*0.013+p.y*0.007);
  const big=p.r>=42;
  ctx.save();
  ctx.globalAlpha=active?1:0.42;
  if(big){ // 輪の後ろ半分
    ctx.save(); ctx.globalAlpha*=0.32; ringPath(p,col,0.14); ctx.restore(); }
  // 本体
  const rg=ctx.createRadialGradient(p.x-p.r*0.35,p.y-p.r*0.38,p.r*0.08,p.x,p.y,p.r);
  rg.addColorStop(0,'#fff'); rg.addColorStop(0.22,col); rg.addColorStop(1,'#0a0a14');
  ctx.save(); if(active){ ctx.shadowColor=col; ctx.shadowBlur=26; }
  ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,TAU); ctx.fill(); ctx.restore();
  // 縞（ガス惑星の帯）。円でクリップして横長の楕円を重ねるだけ
  ctx.save(); ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,TAU); ctx.clip();
  for(let i=0;i<5;i++){
    const yy=p.y-p.r+(i+0.5)*p.r*2/5 + Math.sin(t*0.006+seed+i)*1.6;
    ctx.globalAlpha=(active?0.13:0.07)*(i%2?1:0.55);
    ctx.fillStyle=i%2?'#000':'#fff';
    ctx.beginPath(); ctx.ellipse(p.x,yy,p.r*1.15,p.r*0.14,0,0,TAU); ctx.fill();
  }
  ctx.restore();
  if(big){ // 輪の手前半分（惑星の下側だけ見せる）
    ctx.save(); ctx.beginPath(); ctx.rect(p.x-p.r*2.4,p.y,p.r*4.8,p.r*2.4); ctx.clip();
    ctx.globalAlpha=(active?1:0.42)*0.55; ringPath(p,col,0.15); ctx.restore(); }
  // 引力の届く範囲を示す脈打つ輪
  ctx.globalAlpha=active?0.20:0.06; ctx.strokeStyle=col; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(p.x,p.y,p.r+18+6*Math.sin(t*0.04),0,TAU); ctx.stroke();
  ctx.restore();
}
function ringPath(p,col,w){
  ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(-0.38);
  ctx.strokeStyle=col; ctx.shadowColor=col; ctx.shadowBlur=10; ctx.lineWidth=p.r*w;
  ctx.beginPath(); ctx.ellipse(0,0,p.r*1.75,p.r*0.44,0,0,TAU); ctx.stroke(); ctx.restore();
}

// ブラックホール。降着円盤を回して「吸い込まれている」ことを目で分かるようにする
function drawBlackhole(b,t){
  ctx.save(); ctx.translate(b.x,b.y);
  const rg=ctx.createRadialGradient(0,0,0,0,0,b.r*3.0);
  rg.addColorStop(0,'#000'); rg.addColorStop(0.42,'#180033'); rg.addColorStop(1,'transparent');
  ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(0,0,b.r*3.0,0,TAU); ctx.fill();
  // 降着円盤：潰した楕円を3枚、速さを変えて回す
  ctx.save(); ctx.globalCompositeOperation='lighter';
  for(let i=0;i<3;i++){
    ctx.save(); ctx.rotate(t*(0.030+i*0.012)+i*1.1);
    ctx.strokeStyle=i===1?'#ff7ad9':'#a64dff'; ctx.shadowColor='#c04dff'; ctx.shadowBlur=14;
    ctx.globalAlpha=0.30+0.16*Math.sin(t*0.05+i); ctx.lineWidth=2.4;
    ctx.beginPath(); ctx.ellipse(0,0,b.r*(1.9+i*0.42),b.r*(0.55+i*0.16),0,0.25,Math.PI*1.75); ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
  // 光子リング → 事象の地平面（真っ黒）
  ctx.strokeStyle='#e6b3ff'; ctx.shadowColor='#c04dff'; ctx.shadowBlur=18;
  ctx.globalAlpha=0.85; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(0,0,b.r+5,0,TAU); ctx.stroke();
  ctx.shadowBlur=0; ctx.globalAlpha=1; ctx.fillStyle='#000';
  ctx.beginPath(); ctx.arc(0,0,b.r,0,TAU); ctx.fill();
  ctx.restore();
}

// ゲート。逆回りの二重リングにして「くぐる穴」に見せる
function drawGate(g,t,passed){
  const col=HEX[g.primary];
  ctx.save(); ctx.globalAlpha=passed?0.28:1;
  ctx.shadowColor=col; ctx.shadowBlur=22; ctx.strokeStyle=col; ctx.lineCap='round';
  for(let i=0;i<2;i++){
    ctx.save(); ctx.translate(g.x,g.y); ctx.rotate(t*(i?-0.030:0.022));
    ctx.lineWidth=i?2.4:4;
    const r=g.r-(i?7:0);
    for(let k=0;k<3;k++){ ctx.beginPath(); ctx.arc(0,0,r,k*TAU/3+0.28,k*TAU/3+TAU/3-0.28); ctx.stroke(); }
    ctx.restore();
  }
  // 内側のうすい膜。ここをくぐると色が付く、という面を見せる
  const ig=ctx.createRadialGradient(g.x,g.y,0,g.x,g.y,g.r);
  ig.addColorStop(0,col); ig.addColorStop(1,'transparent');
  ctx.shadowBlur=0; ctx.globalAlpha=(passed?0.05:0.16)*(0.7+0.3*Math.sin(t*0.06));
  ctx.fillStyle=ig; ctx.beginPath(); ctx.arc(g.x,g.y,g.r,0,TAU); ctx.fill();
  // まわりを回る粒
  if(!passed){ ctx.globalAlpha=0.9;
    for(let k=0;k<3;k++){ const a=t*0.035+k*TAU/3;
      glowCircle(ctx,g.x+Math.cos(a)*(g.r+6),g.y+Math.sin(a)*(g.r+6),2.2,col,10); } }
  ctx.restore();
}

// 結晶。面を分けて宝石らしくし、光が横切るようにする
function drawCrystal(cr,t){
  const ccol=HEX[cr.key];
  ctx.save(); ctx.translate(cr.x,cr.y);
  ctx.shadowColor=ccol; ctx.shadowBlur=30;
  ctx.strokeStyle=ccol; ctx.globalAlpha=0.45; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(0,0,cr.r+12+3*Math.sin(t*0.06),0,TAU); ctx.stroke();
  ctx.globalAlpha=0.22; ctx.lineWidth=1;
  ctx.beginPath(); ctx.arc(0,0,cr.r+22+5*Math.sin(t*0.045+1),0,TAU); ctx.stroke();
  ctx.rotate(t*0.016);
  const R=cr.r*(1+0.10*Math.sin(t*0.07)), Wd=R*0.8;
  ctx.globalAlpha=1;
  // 4面に割る。左右で明るさを変えると立体に見える
  const faces=[[0,-R,Wd,0,0,0,0.95],[Wd,0,0,R,0,0,0.62],[0,R,-Wd,0,0,0,0.48],[-Wd,0,0,-R,0,0,0.80]];
  for(const f of faces){
    const grd=ctx.createLinearGradient(f[0],f[1],f[2],f[3]);
    grd.addColorStop(0,'#ffffff'); grd.addColorStop(0.55,ccol); grd.addColorStop(1,ccol);
    ctx.globalAlpha=f[6]; ctx.fillStyle=grd;
    ctx.beginPath(); ctx.moveTo(f[0],f[1]); ctx.lineTo(f[2],f[3]); ctx.lineTo(0,0); ctx.closePath(); ctx.fill();
  }
  ctx.globalAlpha=0.75; ctx.strokeStyle='#fff'; ctx.lineWidth=1.2; ctx.shadowBlur=8;
  ctx.beginPath(); ctx.moveTo(0,-R); ctx.lineTo(Wd,0); ctx.lineTo(0,R); ctx.lineTo(-Wd,0); ctx.closePath(); ctx.stroke();
  ctx.restore();
  // まわりを回るきらめき
  ctx.save(); ctx.globalCompositeOperation='lighter';
  for(let k=0;k<3;k++){ const a=t*0.024+k*TAU/3, rr=cr.r+17+3*Math.sin(t*0.05+k);
    glowCircle(ctx,cr.x+Math.cos(a)*rr,cr.y+Math.sin(a)*rr,1.8,'#fff',10); }
  ctx.restore();
}

// 砲台。スリングショットのゴムと、引いた量のゲージを出す（どれくらいの力かが見える）
function drawCannon(st,t,lr){
  const c=st.cannon, col=HEX[keyOf(new Set(st.start))]||'#fff';
  const pulled=!!lr;
  // 引いた星の見た目の位置。砲台は y=558 にあるので、下へ引くと画面の外に出る。盤内に留める
  const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
  const sx=pulled?clamp(c.x-lr.dx*lr.power*52,12,W-12):c.x;
  const sy=pulled?clamp(c.y-lr.dy*lr.power*52,12,H-14):c.y+Math.sin(t*0.05)*1.6;
  const armL={x:c.x-17,y:c.y-9}, armR={x:c.x+17,y:c.y-9};
  // 台座
  ctx.save();
  ctx.fillStyle='rgba(12,20,38,.95)'; ctx.strokeStyle='rgba(125,242,255,.55)'; ctx.lineWidth=1.6;
  ctx.beginPath(); ctx.moveTo(c.x-24,c.y+16); ctx.lineTo(c.x-16,c.y-4);
  ctx.lineTo(c.x+16,c.y-4); ctx.lineTo(c.x+24,c.y+16); ctx.closePath(); ctx.fill(); ctx.stroke();
  // 腕
  ctx.strokeStyle='rgba(125,242,255,.75)'; ctx.lineWidth=3.4; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(c.x-13,c.y-2); ctx.lineTo(armL.x,armL.y);
  ctx.moveTo(c.x+13,c.y-2); ctx.lineTo(armR.x,armR.y); ctx.stroke();
  // ゴム
  ctx.strokeStyle=pulled?'rgba(255,255,255,.9)':'rgba(125,242,255,.45)';
  ctx.lineWidth=pulled?2.6:2; ctx.shadowColor='#7df9ff'; ctx.shadowBlur=pulled?10:0;
  ctx.beginPath(); ctx.moveTo(armL.x,armL.y); ctx.lineTo(sx,sy); ctx.lineTo(armR.x,armR.y); ctx.stroke();
  ctx.restore();
  // 引いた力のゲージ（砲台の下の弧）
  if(pulled){
    ctx.save(); ctx.lineCap='round'; ctx.lineWidth=4;
    ctx.strokeStyle='rgba(255,255,255,.14)';
    ctx.beginPath(); ctx.arc(c.x,c.y,34,Math.PI*0.12,Math.PI*0.88); ctx.stroke();
    const pc=lr.power<0.5?'#39ff9d':(lr.power<0.85?'#ffe14d':'#ff3b5c');
    ctx.strokeStyle=pc; ctx.shadowColor=pc; ctx.shadowBlur=12;
    ctx.beginPath(); ctx.arc(c.x,c.y,34,Math.PI*0.12,Math.PI*0.12+Math.PI*0.76*lr.power); ctx.stroke();
    ctx.restore();
  }
  drawStar(sx,sy,11,col,t);
}

function draw(){
  const st=G.stage, t=G.t; if(!st) return;
  // 背景（シェイクの外側。ここまで揺らすと画面の縁が割れて見える）
  const bg=ctx.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,'#0a0720'); bg.addColorStop(0.5,'#0b0518'); bg.addColorStop(1,'#120726');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  ctx.save(); ctx.globalCompositeOperation='lighter';
  const neb=[['#3a1a6a',180,140,0.18],['#1a3a6a',720,420,0.16],['#6a1a4a',520,120,0.10]];
  for(const n of neb){ const rg=ctx.createRadialGradient(n[1],n[2],0,n[1],n[2],260);
    rg.addColorStop(0,n[0]); rg.addColorStop(1,'transparent');
    ctx.globalAlpha=n[3]*(0.85+0.15*Math.sin(t*0.006+n[1])); ctx.fillStyle=rg;
    ctx.beginPath(); ctx.arc(n[1],n[2],260,0,TAU); ctx.fill(); }
  ctx.restore();
  // 星空3層。層ごとに速さを変えると奥行きが出る
  for(const layer of starfield){
    for(const s of layer){
      const x=(s.x - t*s.sp) % W, xx=x<0?x+W:x;
      const tw=0.5+0.5*Math.sin(t*0.03+s.tw); ctx.globalAlpha=s.a*tw;
      ctx.fillStyle='#cfe0ff'; ctx.beginPath(); ctx.arc(xx,s.y,s.r,0,TAU); ctx.fill();
    }
  }
  ctx.globalAlpha=1;
  if(comet){ ctx.save(); ctx.globalAlpha=comet.a; ctx.strokeStyle='#dff2ff'; ctx.lineWidth=1.6;
    ctx.shadowColor='#bfe8ff'; ctx.shadowBlur=8; ctx.beginPath();
    ctx.moveTo(comet.x,comet.y); ctx.lineTo(comet.x-comet.vx*11,comet.y-comet.vy*11); ctx.stroke(); ctx.restore(); }

  ctx.save();
  if(G.shake>0.4) ctx.translate((Math.random()-0.5)*G.shake,(Math.random()-0.5)*G.shake);

  for(const r of st.reflectors){ const col=HEX[r.color];
    ctx.save(); ctx.lineCap='round'; ctx.shadowColor=col; ctx.shadowBlur=18; ctx.strokeStyle=col;
    ctx.globalAlpha=0.85; ctx.lineWidth=7; ctx.beginPath(); ctx.moveTo(r.x1,r.y1); ctx.lineTo(r.x2,r.y2); ctx.stroke();
    ctx.globalAlpha=0.3; ctx.lineWidth=14; ctx.stroke();
    // 鏡の面。斜めの線を並べて「板」に見せる
    ctx.globalAlpha=0.35; ctx.lineWidth=1; ctx.setLineDash([3,6]); ctx.lineDashOffset=-t*0.4;
    ctx.beginPath(); ctx.moveTo(r.x1,r.y1); ctx.lineTo(r.x2,r.y2); ctx.stroke(); ctx.restore(); }

  for(const gt of st.gates) drawGate(gt,t,G.triggered.has(gt.id));
  for(const p of st.planets) drawPlanet(p,t,!G.star||G.star.color.has(p.color));
  for(const b of st.blackholes) drawBlackhole(b,t);
  drawCrystal(st.crystal,t);

  if(G.trail.length>1){ ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.lineCap='round';
    for(let i=1;i<G.trail.length;i++){ const a=G.trail[i-1], b=G.trail[i], al=i/G.trail.length;
      ctx.globalAlpha=al*0.9; ctx.strokeStyle=HEX[b.key]||'#fff'; ctx.lineWidth=al*5+1;
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); } ctx.restore(); }

  ctx.save(); ctx.globalCompositeOperation='lighter';
  for(const p of G.particles){ ctx.globalAlpha=Math.max(0,p.life/p.max); glowCircle(ctx,p.x,p.y,p.size,p.color,8); }
  ctx.restore(); ctx.globalAlpha=1;

  let lr=null;
  if(G.mode==='aim' && G.aim.active){
    lr=computeLaunch(st.cannon,G.aim.x,G.aim.y);
    if(lr.power>0.06){
      const sim={x:st.cannon.x,y:st.cannon.y,vx:lr.vx,vy:lr.vy,color:new Set(st.start)}, tg=new Set();
      ctx.save();
      for(let i=0;i<260;i++){ const ev=stepSim(sim,st,tg);
        if(i%4===0){ ctx.globalAlpha=Math.max(0.12,0.85-i/300); ctx.fillStyle=hexOf(sim.color);
          ctx.beginPath(); ctx.arc(sim.x,sim.y,2.4,0,TAU); ctx.fill(); }
        if(ev==='win'||ev==='crash'||ev==='out'||ev==='blackhole') break; }
      ctx.restore();
    } else lr=null;
  }

  // 正解の予測軌道（デモ中のみ・金の点線）
  if(G.mode==='demo' && G.solPath && G.solPath.length>1){
    ctx.save(); ctx.setLineDash([4,7]); ctx.lineDashOffset=-t*0.6;
    ctx.strokeStyle='rgba(255,225,77,0.55)'; ctx.shadowColor='#ffe14d'; ctx.shadowBlur=10; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(G.solPath[0].x,G.solPath[0].y);
    for(let i=1;i<G.solPath.length;i++) ctx.lineTo(G.solPath[i].x,G.solPath[i].y);
    ctx.stroke(); ctx.restore();
  }

  drawCannon(st,t,lr);
  if(G.star){ const demo=G.mode==='demo'; const col=hexOf(G.star.color);
    if(demo) glowCircle(ctx,G.star.x,G.star.y,STAR_R+9,'#ffe14d',26);
    glowCircle(ctx,G.star.x,G.star.y,STAR_R+4,col,22);
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(G.star.x,G.star.y,STAR_R*0.5,0,TAU); ctx.fill(); }
  ctx.restore();

  // クリアの閃光
  if(G.winFlash>0.01){ ctx.save(); ctx.globalAlpha=G.winFlash*0.55; ctx.fillStyle='#fff';
    ctx.fillRect(0,0,W,H); ctx.restore(); }
}

function frame(){
  G.t++;
  // 引いている間、少しずつ音が上がる（力の入り具合が耳でも分かる）
  if(G.mode==='aim'&&G.aim.active){
    const lr=computeLaunch(G.stage.cannon,G.aim.x,G.aim.y);
    if(++G.aimTick%7===0 && lr.power>0.06) sfx('aim',lr.power);
  }
  if(comet){ comet.x+=comet.vx; comet.y+=comet.vy; comet.a-=0.012; if(comet.a<=0) comet=null; }
  else if(--cometNext<=0){ cometNext=520+Math.random()*900;
    comet={ x:-40, y:Math.random()*H*0.55, vx:5+Math.random()*3, vy:1+Math.random()*1.6, a:0.9 }; }

  if((G.mode==='flying'||G.mode==='demo') && G.star){
    const demo=G.mode==='demo';
    const ev=stepSim(G.star,G.stage,G.triggered);
    G.trail.push({x:G.star.x,y:G.star.y,key:keyOf(G.star.color)});
    if(G.trail.length>64) G.trail.shift();
    if(G.t%2===0) G.particles.push({x:G.star.x,y:G.star.y,vx:(Math.random()-0.5)*0.6,vy:(Math.random()-0.5)*0.6,
      life:28,max:28,color:demo?'#ffe14d':hexOf(G.star.color),size:Math.random()*2+1});
    // 鏡で跳ねたか。stepSim は戻り値を返さない（返すと軌道が変わる）ので印で受ける
    if(G.star.bounced){ G.star.bounced=false; sfx('bounce');
      for(let k=0;k<8;k++){ const a=Math.random()*TAU, sp=Math.random()*2+0.5;
        G.particles.push({x:G.star.x,y:G.star.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:18,max:18,color:'#ffffff',size:Math.random()*1.6+0.6}); } }
    if(ev==='gate'){ syncHUD(); const col=hexOf(G.star.color);
      sfx('gate', G.star.lastGate);
      for(let k=0;k<24;k++){ const a=Math.random()*TAU, sp=Math.random()*3.4+1;
        G.particles.push({x:G.star.x,y:G.star.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:34,max:34,color:col,size:Math.random()*2.5+1}); } }
    else if(ev==='win'){ if(demo) flash('これが正解の軌道だ！'); doWin(demo); }
    else if(demo){ /* 正解は必ずクリアするが、万一の終端はリセット(残弾は減らさない) */
      if(ev==='crash'||ev==='blackhole'||ev==='out'){ G.mode='aim'; G.star=null; G.solPath=null; G.triggered=new Set(); syncHUD(); } }
    else if(ev==='crash'){ flash('惑星に衝突！'); sfx('crash'); addShake(8); burst(G.star,'#ff9b3b',26); loseBall(); }
    else if(ev==='blackhole'){ flash('ブラックホールに飲まれた…'); sfx('hole'); addShake(5); burst(G.star,'#a64dff',22); loseBall(); }
    else if(ev==='reject'){ flash('色が違う！弾かれた'); sfx('reject'); addShake(3); }
    else if(ev==='out') loseBall();
  }
  for(const p of G.particles){ p.x+=p.vx; p.y+=p.vy; p.vy+=0.03; p.life--; }
  if(G.particles.length>0) G.particles=G.particles.filter(p=>p.life>0).slice(-300);
  G.shake*=0.88; G.winFlash*=0.90;
  draw();
  requestAnimationFrame(frame);
}
function burst(s,col,n){
  for(let k=0;k<n;k++){ const a=Math.random()*TAU, sp=Math.random()*4+1;
    G.particles.push({x:s.x,y:s.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:40,max:40,color:col,size:Math.random()*2.6+1}); }
}

// ------------------ 起動 ------------------
const saved=loadSave();
G.maxUnlocked=Math.min(Number(saved.maxUnlocked)||0, STAGES.length-1);
G.stars=(saved.stars&&typeof saved.stars==='object')?saved.stars:{};
setSound(soundOn);
init(0);
showTitle();
requestAnimationFrame(frame);
</script>
<script src="../_switch.js"></script>
