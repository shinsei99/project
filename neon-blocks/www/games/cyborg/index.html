<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#06040f" />
<title>ネオンサイボーグ</title>
<!-- ファビコン。外部ファイルにすると 404 がコンソールに残り、本物のエラーが埋もれる -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2306040f'/%3E%3Cpath d='M16 4l10 4v8c0 6-4 10-10 12C10 26 6 22 6 16V8z' fill='none' stroke='%2341e3ff' stroke-width='2.4'/%3E%3Ccircle cx='16' cy='15' r='3.2' fill='%23ff4d5e'/%3E%3C/svg%3E">
<style>
  /* 書体は同梱（assets/fonts/）。どちらも SIL Open Font License 1.1 ＝ 商用可・再配布可。
     使う文字だけに絞ってあるので、文言を変えたら tools/fetch-font.py を流し直すこと。
     流し忘れると増やした文字が □（豆腐）になる。 */
  @font-face{ font-family:'Orbitron'; src:url('assets/fonts/Orbitron-700.woff2') format('woff2');
    font-weight:700; font-style:normal; font-display:swap; }
  @font-face{ font-family:'Orbitron'; src:url('assets/fonts/Orbitron-900.woff2') format('woff2');
    font-weight:900; font-style:normal; font-display:swap; }
  @font-face{ font-family:'ZenKaku'; src:url('assets/fonts/ZenKakuGothicNew-500.woff2') format('woff2');
    font-weight:500; font-style:normal; font-display:swap; }
  @font-face{ font-family:'ZenKaku'; src:url('assets/fonts/ZenKakuGothicNew-900.woff2') format('woff2');
    font-weight:900; font-style:normal; font-display:swap; }

  :root{
    --cyan:#41e3ff; --red:#ff4d5e; --green:#7dff9b; --gold:#ffe14d; --magenta:#ff5fae;
    --ink:#04030c;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; background:var(--ink); overflow:hidden;
    font-family:'ZenKaku',system-ui,-apple-system,"Helvetica Neue",sans-serif; color:#fff; }
  /* 背景。画面いっぱいの黒だと「未完成」に見えるので、奥にネオンの気配を置く */
  body::before{ content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(60% 40% at 50% 0%, rgba(65,227,255,.14), transparent 70%),
      radial-gradient(50% 35% at 12% 92%, rgba(255,95,174,.10), transparent 70%),
      radial-gradient(50% 35% at 92% 88%, rgba(125,255,155,.07), transparent 70%); }
  /* iOSアプリとして動かすとノッチとホームバーに食われる。env() で避ける */
  #app{ position:relative; z-index:1; width:100%; min-height:100%; display:flex;
    flex-direction:column; align-items:center; justify-content:center;
    padding:calc(8px + env(safe-area-inset-top)) 10px calc(8px + env(safe-area-inset-bottom));
    user-select:none; -webkit-touch-callout:none; gap:8px; }
  /* セーフエリアの実寸を測るための当て木（JSが offsetHeight で読む） */
  #safeProbe{ position:fixed; top:0; left:0; width:0; visibility:hidden; pointer-events:none;
    height:calc(env(safe-area-inset-top) + env(safe-area-inset-bottom)); }

  /* ---- 見出し ---- */
  .topbar{ width:var(--stage-w); display:flex; align-items:center; justify-content:space-between; gap:8px; }
  /* 見出しの大きさは盤面の幅に合わせる（JS が --title-size を入れる）。
     固定にすると、盤面が細いウインドウで CYBORG DEFENSE が2行に折れる */
  .title h1{ margin:0; font-family:'Orbitron',system-ui; font-size:var(--title-size,21px); font-weight:900;
    letter-spacing:.14em; line-height:1.1; background:linear-gradient(90deg,#00F0FF,#B026FF 40%,#FF2D95 70%,#FFD54F);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 16px rgba(0,240,255,.5)); }
  .title p{ margin:3px 0 0; font-size:9.5px; font-weight:500; letter-spacing:.26em;
    color:rgba(65,227,255,.5); }
  /* ★2026-08-29: 音ボタンの見た目をシリーズ共通に（NEON_STYLE.md） */
  .iconbtn{ width:44px; height:40px; flex:0 0 44px; border-radius:6px; font-size:17px;
    background:rgba(21,14,51,.92); border:2px solid rgba(65,227,255,.5); color:#9BE9FF;
    box-shadow:0 0 12px rgba(65,227,255,.28);
    display:flex; align-items:center; justify-content:center; transition:transform .1s,background .15s; }
  .iconbtn:active{ transform:scale(.92); }
  .iconbtn[aria-pressed="true"]{ opacity:.45; }

  /* ---- 盤面 ---- */
  /* 幅は「画面の高さ」からも決める。決めないと縦長のPCで強化ボタンが画面の下に隠れる */
  .stage{ position:relative; width:var(--stage-w); }
  canvas{ width:100%; aspect-ratio:9/16; display:block; border-radius:18px;
    border:1px solid rgba(65,227,255,.22); background:#06040f; touch-action:none;
    box-shadow:0 0 48px rgba(65,227,255,.16), inset 0 0 40px rgba(0,0,0,.6); }
  .hud{ position:absolute; top:0; left:0; right:0; z-index:10; display:flex;
    justify-content:space-between; padding:9px 11px; pointer-events:none; }
  .col{ display:flex; flex-direction:column; gap:6px; }
  .col.right{ align-items:flex-end; }
  .pill{ display:flex; align-items:center; gap:7px; padding:4px 11px; border-radius:999px;
    background:rgba(4,3,12,.55); backdrop-filter:blur(6px); border:1px solid rgba(255,255,255,.12);
    font-family:'Orbitron',system-ui; font-size:12px; font-weight:900; letter-spacing:.06em; }
  .pill .lbl{ color:rgba(255,255,255,.5); font-weight:700; font-size:9px; letter-spacing:.18em; }
  /* HPは数字よりバーのほうが「あと何回耐えられるか」が一目で分かる */
  .hpwrap{ width:104px; height:9px; border-radius:999px; overflow:hidden;
    background:rgba(4,3,12,.6); border:1px solid rgba(255,255,255,.14); }
  .hpbar{ height:100%; width:100%; border-radius:999px; transition:width .18s linear, background .3s;
    background:linear-gradient(90deg,#7dff9b,#41e3ff); box-shadow:0 0 10px rgba(125,255,155,.6); }
  .hpbar.warn{ background:linear-gradient(90deg,#ffb54d,#ff8a3d); box-shadow:0 0 10px rgba(255,181,77,.6); }
  .hpbar.crit{ background:linear-gradient(90deg,#ff4d5e,#ff5fae); box-shadow:0 0 12px rgba(255,77,94,.7); }

  /* ---- 出撃前・ゲームオーバー ---- */
  .overlay{ position:absolute; inset:0; z-index:30; display:flex; align-items:center; justify-content:center;
    border-radius:18px; background:rgba(4,3,12,.62); backdrop-filter:blur(3px); padding:14px; }
  .overlay.hidden{ display:none; }
  .panel{ text-align:center; padding:22px 20px; border-radius:16px; width:100%; max-width:340px;
    border:1px solid rgba(65,227,255,.3);
    background:linear-gradient(to bottom,rgba(65,227,255,.09),rgba(4,3,12,.55));
    box-shadow:0 0 30px rgba(65,227,255,.14); }
  .panel .lat{ font-family:'Orbitron',system-ui; font-size:12px; font-weight:700; letter-spacing:.34em;
    color:#FF4FC3; text-shadow:0 0 12px rgba(255,79,195,.8); }
  /* ★題字は**レインボー**（6本共通の合図。neon-blocks/NEON_STYLE.md） */
  .panel .big{ font-size:26px; font-weight:900; letter-spacing:.18em;
    margin:10px 0 12px; background:linear-gradient(90deg,#00F0FF,#B026FF 40%,#FF2D95 70%,#FFD54F);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(0,240,255,.5)); }
  .panel .sub{ font-size:12px; color:rgba(255,255,255,.72); margin-bottom:15px; line-height:1.75; text-align:left; }
  .panel .sub b{ color:var(--cyan); }
  /* 遊び方は「1行1要素」で並べたほうが読まれる。段落で書くと誰も読まない */
  .rule{ display:flex; gap:8px; align-items:flex-start; margin:7px 0; }
  .rule .k{ flex:0 0 auto; font-family:'Orbitron',system-ui; font-weight:900; font-size:11px;
    padding:2px 7px; border-radius:6px; letter-spacing:.04em; }
  .k.gate{ color:#04202a; background:var(--cyan); }
  .k.zap{ color:#2a0409; background:var(--red); }
  .k.brute{ color:#2a0418; background:var(--magenta); }
  .k.move{ color:#04220f; background:var(--green); }
  .panel .score{ font-family:'Orbitron',system-ui; font-size:13px; font-weight:900; letter-spacing:.05em;
    margin-bottom:14px; color:#fff; }
  .panel .score b{ color:var(--gold); font-size:19px; }
  button{ font-family:inherit; cursor:pointer; border:none; }
  /* ★2026-08-29: 水色べた塗り → **マゼンタのネオン管**（シリーズ共通の決定ボタン。NEON_STYLE.md） */
  .btn{ padding:11px 26px; border-radius:5px; font-family:'Orbitron',system-ui;
    font-weight:900; font-size:15px; letter-spacing:.1em;
    background:rgba(255,79,195,.18); color:#fff; border:2px solid #FF4FC3;
    box-shadow:0 0 14px rgba(255,79,195,.35); transition:transform .1s; }
  .btn:active{ transform:scale(.94); }

  /* ---- 強化ボタン ---- */
  .controls{ width:var(--stage-w); display:flex; gap:7px; }
  .ub{ flex:1; padding:9px 4px 8px; border-radius:13px; background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.12); color:#fff; display:flex; flex-direction:column;
    align-items:center; gap:3px; transition:transform .1s,background .15s,border-color .15s; }
  .ub:active{ transform:scale(.95); }
  .ub:disabled{ opacity:.38; }
  .ub .ut{ font-size:11.5px; font-weight:900; letter-spacing:.02em; }
  .ub .uv{ font-family:'Orbitron',system-ui; font-size:9.5px; font-weight:700; color:rgba(255,255,255,.5); letter-spacing:.08em; }
  .ub .uc{ font-family:'Orbitron',system-ui; font-size:11px; font-weight:900; color:var(--gold); letter-spacing:.04em; }
  /* 買えるものが光る。コインが貯まったことに気づかせるのが目的 */
  .ub.afford{ border-color:rgba(255,225,77,.55); background:rgba(255,225,77,.1);
    box-shadow:0 0 14px rgba(255,225,77,.18); }
  .hint{ font-size:9.5px; letter-spacing:.14em; color:rgba(255,255,255,.3); }
</style>
</head>
<body>
<div id="safeProbe"></div>
<div id="app">
  <div class="topbar">
    <div class="title">
      <h1>NEON CYBORG</h1>
      <p>ネオンサイボーグ</p>
    </div>
    <!-- 音のオン・オフ。絵文字だと環境ごとに形と大きさが変わるので、図形で描く -->
    <button class="iconbtn" id="mute" aria-label="音のオン・オフ" aria-pressed="false">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 9.5v5h3.5L12 19V5L7.5 9.5H4z" fill="currentColor" stroke="none"/>
        <g id="mOn"><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18 6.5a7.5 7.5 0 0 1 0 11"/></g>
        <g id="mOff" style="display:none"><path d="M16 9.5l5 5"/><path d="M21 9.5l-5 5"/></g>
      </svg>
    </button>
  </div>

  <div class="stage">
    <canvas id="game"></canvas>
    <div class="hud">
      <div class="col">
        <div class="pill"><span class="lbl">SCORE</span><span id="hScore">0</span></div>
        <div class="pill"><span class="lbl">WAVE</span><span id="hWave">1</span></div>
      </div>
      <div class="col right">
        <div class="pill"><span style="color:var(--gold)">◈</span><span id="hCoin">0</span></div>
        <div class="hpwrap"><div class="hpbar" id="hHp"></div></div>
      </div>
    </div>
    <div class="overlay" id="overlay">
      <div class="panel">
        <!-- ★2026-08-29: 見出しをシリーズ共通の型へ（ラテン小マゼンタ＋日本語大）。NEON_STYLE.md -->
        <div class="lat">N E O N &nbsp; C Y B O R G</div>
        <div class="big" id="ovTitle">ネオンサイボーグ</div>
        <div class="sub" id="ovSub">
          <div class="rule"><span class="k move">移動</span><span>左右にドラッグ（PCは ← → ）。<b>射撃は自動</b>。</span></div>
          <div class="rule"><span class="k gate">ゲート</span><span>毎回シャッフルの3択。<b>×2 ×3</b> は強いが <b style="color:#ff6b7a">÷2 -N</b> の罠に挟まれる。</span></div>
          <div class="rule"><span class="k zap">感電</span><span>降ってくるバリアは<b>よけないと部隊が減る</b>。</span></div>
          <div class="rule"><span class="k brute">重装</span><span>ブルートは硬い。突破されると部隊を食われる。</span></div>
        </div>
        <div class="score" id="ovScore" style="display:none"></div>
        <button class="btn" id="startBtn">出撃</button>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="ub" id="upSoldier"><span class="ut">基本兵士+1</span><span class="uv" id="vSoldier">1 / 6</span><span class="uc" id="cSoldier">◈25</span></button>
    <button class="ub" id="upRate"><span class="ut">連射</span><span class="uv" id="vRate">LV1</span><span class="uc" id="cRate">◈15</span></button>
    <button class="ub" id="upDmg"><span class="ut">威力</span><span class="uv" id="vDmg">LV1</span><span class="uc" id="cDmg">◈20</span></button>
  </div>
  <div class="hint">◈ は撃破で貯まる。強化はいつでも押せる</div>
</div>
<script>
(()=>{
"use strict";

/* ===================================================================
   サイボーグ・ディフェンス
   遊びの仕組み（複製ゲート・感電バリア・シールドボス・強化）は据え置き。
   2026-08-28 に「見た目・書体・音」を作り替えた。数値は一切変えていない。
   =================================================================== */

const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
let W=0, H=0, DPR=1;

// 書体。canvas は CSS のフォント指定を継がないので、毎回この文字列を使う
const F_NUM = (w,s)=>`${w} ${s}px Orbitron, ZenKaku, system-ui`;   // 数字・英字（見出し向き）
const F_JP  = (w,s)=>`${w} ${s}px ZenKaku, system-ui`;             // 日本語

// 盤面の幅を「画面の幅」と「画面の高さ」の両方から決める。
// 高さを見ないと、縦長のウインドウで強化ボタンが画面外に落ちる。
function fitStage(){
  const probe = document.getElementById('safeProbe');
  const safe = probe ? probe.offsetHeight : 0;      // ノッチ＋ホームバーの合計
  const vh = window.innerHeight - safe, vw = window.innerWidth;
  // 上限は iPad のため 620。iPhone は vw-20 のほうが小さいので見え方は変わらない
  const w = Math.min(620, vw-20, Math.max(220, (vh-210)*9/16));
  document.documentElement.style.setProperty('--stage-w', w+'px');
  // 「CYBORG DEFENSE」＋音ボタンが1行に収まる大きさ（14文字＋字間から逆算）
  document.documentElement.style.setProperty('--title-size',
    Math.max(13, Math.min(21, (w-52)/14.6))+'px');
}

function resize(){
  fitStage();
  const r = cv.getBoundingClientRect();
  DPR = Math.min(2, window.devicePixelRatio||1);
  W = r.width; H = r.height;
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  buildBackdrop();                 // 背景は作り直し（毎フレーム描くには重い）
  player.x = Math.min(Math.max(player.x||W/2, margin()), W-margin());
}
window.addEventListener('resize', resize);

// ---------- 状態 ----------
const G = {
  running:false, over:false, t:0, wave:1, score:0, coins:0, spawnAcc:0, gateTimer:14,
  bossTimer:45, hazTimer:13, shake:0, slowmo:0,
  combo:0, comboT:0, hurt:0, banner:null, flash:0,
};
const player = {
  x:0, soldiers:1, base:1, fireRate:1, damage:1, cd:0, hp:100, maxHp:100, w:64,
  upS:0, upR:0, upD:0, flash:0,
};
let bullets=[], enemies=[], gates=[], shields=[], hazards=[], parts=[], texts=[], rings=[];

let BEST = 0;
try { BEST = +(localStorage.getItem('cyborg_best')||0) || 0; } catch(e){}

// ---------- 入力 ----------
let dragging=false;
function px(e){ const r=cv.getBoundingClientRect(); const t=e.touches?e.touches[0]:e; return t.clientX-r.left; }
function down(e){ initAudio(); dragging=true; movePlayer(px(e)); e.preventDefault(); }
function move(e){ if(dragging) movePlayer(px(e)); }
function up(){ dragging=false; }
// 可動・敵出現を中央寄りの帯に制限（横移動の範囲を狭める）。
// この帯の外は「防壁」として描く＝制限の理由が画面から読める
function margin(){ return Math.max(player.w/2, W*0.16); }
function movePlayer(x){ const m=margin(); player.x = Math.max(m, Math.min(W-m, x)); }
cv.addEventListener('mousedown',down); window.addEventListener('mousemove',move); window.addEventListener('mouseup',up);
cv.addEventListener('touchstart',down,{passive:false}); cv.addEventListener('touchmove',move,{passive:false}); window.addEventListener('touchend',up);
// PCで矢印キーが効かないと「動かないゲーム」に見える
let keyDir=0;
window.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'){ keyDir=-1; initAudio(); }
  else if(e.key==='ArrowRight'){ keyDir=1; initAudio(); }
  else if((e.key===' '||e.key==='Enter') && !G.running){ start(); }
  else return;
  e.preventDefault();
});
window.addEventListener('keyup',e=>{
  if((e.key==='ArrowLeft'&&keyDir<0)||(e.key==='ArrowRight'&&keyDir>0)) keyDir=0;
});

/* ===================== 音 =====================
   音のファイルは1つも同梱していない。ぜんぶ WebAudio の合成音。
   容量が増えず、素材のライセンスを持ち込まずに済むため。

   録音した素材へ差し替えたいとき（耳で確かめられる人がやること）:
     1. assets/audio/ に shot.mp3 kill.mp3 … を置く（名前は SFX_FILES のとおり）
     2. 下の USE_FILES を true にする  ← コードの変更はこれだけ
     3. 見つからないファイルは、そのキーだけ合成音のまま鳴る（落ちない）

   ★持ち込んでよい素材: **商用可 かつ 再配布可** のものだけ。
     このリポジトリは public で GitHub Pages から配信している。
     効果音ラボ（商用可・表記不要）か CC0 が安全。表記が要る素材は使わない。 */
const USE_FILES = false;
const AUDIO_DIR = 'assets/audio/';
const SFX_FILES = {
  shot:'shot.mp3', kill:'kill.mp3', heavy:'heavy.mp3', good:'good.mp3', bad:'bad.mp3',
  zap:'zap.mp3', hurt:'hurt.mp3', boss:'boss.mp3', up:'up.mp3', wave:'wave.mp3', over:'over.mp3',
};

let audio=null, masterGain=null, sfxGain=null, musGain=null, noiseBuf=null;
const buffers={};
let soundOn = true;
try { soundOn = localStorage.getItem('cyborg_sound') !== 'off'; } catch(e){}

// iOS は「画面を触るまで」音を出せないので、最初の操作で作る
function initAudio(){
  if (audio){ if (audio.state==='suspended') audio.resume(); return; }
  try { audio = new (window.AudioContext||window.webkitAudioContext)(); }
  catch(e){ return; }
  masterGain = audio.createGain(); masterGain.gain.value = soundOn?1:0; masterGain.connect(audio.destination);
  sfxGain = audio.createGain(); sfxGain.gain.value = 0.90;   // ★シリーズ共通の音量（NEON_STYLE.md） sfxGain.connect(masterGain);
  musGain = audio.createGain(); musGain.gain.value = 0.26; musGain.connect(masterGain);
  // ノイズ源（電撃・爆発・ハイハットに使う）
  const n = audio.sampleRate*1.0; noiseBuf = audio.createBuffer(1,n,audio.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = Math.random()*2-1;
  if (USE_FILES) loadSfxFiles();
  startMusic();
}
function loadSfxFiles(){
  for (const key in SFX_FILES){
    fetch(AUDIO_DIR + SFX_FILES[key])
      .then(r => r.ok ? r.arrayBuffer() : Promise.reject(new Error('404')))
      .then(b => audio.decodeAudioData(b))
      .then(buf => { buffers[key]=buf; })
      .catch(()=>{});       // 無ければ、そのキーだけ合成音のまま
  }
}
function setSound(on){
  soundOn = on;
  try { localStorage.setItem('cyborg_sound', on?'on':'off'); } catch(e){}
  if (masterGain) masterGain.gain.setTargetAtTime(on?1:0, audio.currentTime, 0.02);
  const b=document.getElementById('mute');
  b.setAttribute('aria-pressed', String(!on));
  document.getElementById('mOn').style.display  = on ? '' : 'none';
  document.getElementById('mOff').style.display = on ? 'none' : '';
}
// 1音。立ち上がりと減衰を付けないと「ピー」と鳴りっぱなしに聞こえる
function voice(freq, when, dur, type, gain, dest, slideTo){
  if(!audio) return;
  const o=audio.createOscillator(), g=audio.createGain();
  o.type=type||'sine';
  o.frequency.setValueAtTime(freq, when);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo), when+dur);
  g.gain.setValueAtTime(0.0001, when);
  g.gain.exponentialRampToValueAtTime(gain, when+0.010);
  g.gain.exponentialRampToValueAtTime(0.0001, when+dur);
  o.connect(g); g.connect(dest||sfxGain);
  o.start(when); o.stop(when+dur+0.02);
}
// ノイズ1発（ローパスを掛けないと全部「シャー」で同じに聞こえる）
function noise(when, dur, gain, freq, q, dest){
  if(!audio||!noiseBuf) return;
  const s=audio.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
  const f=audio.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq||1200; f.Q.value=q||1;
  const g=audio.createGain();
  g.gain.setValueAtTime(0.0001, when);
  g.gain.exponentialRampToValueAtTime(gain, when+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, when+dur);
  s.connect(f); f.connect(g); g.connect(dest||sfxGain);
  s.start(when); s.stop(when+dur+0.02);
}
function sfx(name, n){
  if(!audio || !soundOn) return;
  if(buffers[name]){ const s=audio.createBufferSource(); s.buffer=buffers[name]; s.connect(sfxGain); s.start(); return; }
  const t=audio.currentTime;
  const seq=(notes,step,dur,type,gain)=>notes.forEach((f,i)=>voice(f,t+i*step,dur,type,gain));
  switch(name){
    // 射撃は毎秒2〜5回鳴る。うるさくならないよう短く・小さく
    case 'shot':   voice(760,t,0.045,'square',0.035,null,300); noise(t,0.035,0.020,2600,1.4); break;
    case 'kill':   voice(420+(n||0)*18,t,0.09,'triangle',0.075,null,180); noise(t,0.07,0.045,900,0.9); break;
    case 'heavy':  voice(150,t,0.28,'sawtooth',0.10,null,60); noise(t,0.22,0.08,420,0.7); break;
    case 'good':   seq([523.25,659.25,880],0.055,0.26,'triangle',0.11); break;   // ゲート当たり
    case 'bad':    voice(300,t,0.20,'sawtooth',0.09,null,110); voice(150,t+0.05,0.22,'square',0.05,null,80); break;
    case 'zap':    noise(t,0.26,0.13,1800,0.6); voice(90,t,0.24,'sawtooth',0.07,null,40); break;
    case 'hurt':   voice(220,t,0.22,'sawtooth',0.10,null,90); noise(t,0.16,0.06,600,0.8); break;
    case 'boss':   noise(t,0.55,0.16,300,0.5); seq([196,147,98],0.09,0.5,'sawtooth',0.09); break;
    case 'up':     seq([659.25,987.77],0.06,0.22,'triangle',0.12); break;
    case 'wave':   seq([392,523.25,659.25],0.085,0.34,'square',0.055); break;
    case 'over':   voice(330,t,0.5,'sawtooth',0.11,null,80); voice(220,t+0.18,0.7,'sine',0.08,null,60);
                   noise(t,0.6,0.06,300,0.5); break;
  }
}

/* BGM。イ短調のペンタトニック（ラ・ド・レ・ミ・ソ）だけを使う。
   どの順に鳴らしても濁らないので、短いループでも耳障りになりにくい。
   ウェーブが進むと裏拍のハイハットが増えて、勝手に「押されている感じ」になる。 */
const MUSIC = {
  step:0, next:0, timer:null, bpm:126,
  bass:[0,0,12,0, -2,-2,10,-2, -5,-5,7,-5, -2,-2,-2,3],           // A2 基準の半音
  arp :[12,19,24,19, 10,17,22,17, 7,14,19,14, 10,17,22,26],       // 上物
};
function startMusic(){
  if(!audio || MUSIC.timer) return;
  MUSIC.next = audio.currentTime + 0.15;
  MUSIC.timer = setInterval(musicTick, 90);
}
// 先読みして予約する方式。setInterval で直接鳴らすとタイミングがぶれる
function musicTick(){
  if(!audio) return;
  const eighth = 60/MUSIC.bpm/2;
  if(MUSIC.next < audio.currentTime) MUSIC.next = audio.currentTime + 0.05;  // 復帰時の一気鳴り防止
  const busy = G.running ? 1 : 0.45;                       // タイトル中は静かに
  if(musGain) musGain.gain.setTargetAtTime(0.26*busy, audio.currentTime, 0.4);
  while(MUSIC.next < audio.currentTime + 0.3){
    const t=MUSIC.next, s=MUSIC.step;
    // ★2026-08-29: 調を A → **D** に（シリーズ6本で調を分ける決まり。neon-blocks/NEON_STYLE.md）。
    //   名前は A2 のままだが中身は D3。音型（bass/arp の並び）は変えていない＝曲は同じ、調だけ違う。
    const A2=146.83;
    voice(A2*Math.pow(2, MUSIC.bass[s % MUSIC.bass.length]/12), t, eighth*1.5, 'sawtooth', 0.055, musGain);
    if(G.running && s%2===0){
      voice(A2*Math.pow(2, MUSIC.arp[(s>>1) % MUSIC.arp.length]/12), t, eighth*1.1, 'square', 0.022, musGain);
    }
    if(G.running && s%4===0) voice(70, t, 0.11, 'sine', 0.10, musGain, 40);          // キック
    if(G.running && s%2===1 && G.wave>=3) noise(t, 0.035, 0.020, 7000, 0.8, musGain); // 裏のハイハット
    MUSIC.next += eighth; MUSIC.step++;
  }
}
// 裏に回ったら止める（電池とスピーカーの行儀）
document.addEventListener('visibilitychange', ()=>{
  if(!audio) return;
  if(document.hidden) audio.suspend(); else audio.resume();
});
document.getElementById('mute').onclick = ()=>{ initAudio(); setSound(!soundOn); };
setSound(soundOn);

// ---------- ヘルパ ----------
const rnd=(a,b)=>a+Math.random()*(b-a);
function playLineY(){ return H-70; }
function soldierPositions(){
  const n=player.soldiers, perRow=6, sp=18, rowH=20, lineY=playLineY();
  const pos=[], rows=Math.ceil(n/perRow);
  for(let r=0;r<rows;r++){
    const inRow=Math.min(perRow, n-r*perRow);
    for(let c=0;c<inRow;c++){
      const off=(c-(inRow-1)/2)*sp;
      pos.push({ x:player.x+off, y:lineY - r*rowH });
    }
  }
  return pos;
}
function burst(x,y,color,n,spd){
  for(let i=0;i<n;i++){ const a=rnd(0,Math.PI*2), s=rnd(.3,1)*spd;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(.3,.7),max:.7,color,r:rnd(1.5,3.5)}); }
}
function ring(x,y,color,r0,r1,life){ rings.push({x,y,color,r:r0,to:r1,life,max:life}); }
function floatText(x,y,txt,color,size){ texts.push({x,y,txt,color,life:.9,size:size||15}); }

// ---------- スポーン ----------
function spawnEnemy(x, forceType){
  const m=margin(), xx = x ?? rnd(m,W-m);
  let type=forceType;
  if(!type){
    const r=Math.random();
    if(G.wave>=2 && r<0.16) type='brute';
    else if(r<0.30) type='runner';
    else type='grunt';
  }
  let hp,spd,rad,eat;
  if(type==='brute'){ hp=6+G.wave*1.6; spd=rnd(15,21)+G.wave*0.4; rad=22; eat=3; }
  else if(type==='runner'){ hp=1+Math.floor(G.wave*0.3); spd=rnd(48,60)+G.wave*0.9; rad=11; eat=0; }
  else { hp=1+Math.floor(G.wave*0.5); spd=rnd(26,34)+G.wave*0.7; rad=15; eat=0; }
  enemies.push({ x:xx, y:-rad-6, r:rad, hp, maxHp:hp, spd, type, eat,
    wob:rnd(0,6.28), legt:rnd(0,6.28), hit:0 });
}
const MAX_SOLDIERS=18;
function clampSoldiers(){ player.soldiers = Math.max(player.base, Math.min(MAX_SOLDIERS, player.soldiers)); }
// ゲートを通ったら人数がどうなるか。プレビュー（選ぶ前に見せる）にも使う
function gateResult(sec, from){
  let v;
  if(sec.op==='mul') v = Math.round(from*sec.val);
  else if(sec.op==='div') v = Math.max(1, Math.round(from/sec.val));
  else if(sec.op==='add') v = from + sec.val;
  else v = from - sec.val;
  return Math.max(player.base, Math.min(MAX_SOLDIERS, v));
}
function applyGate(sec){ player.soldiers = gateResult(sec, player.soldiers); }
const GATE = {
  mul2:()=>({op:'mul',val:2,label:'×2',color:'#41e3ff'}),
  mul3:()=>({op:'mul',val:3,label:'×3',color:'#ffd166'}),
  div2:()=>({op:'div',val:2,label:'÷2',color:'#ff6b7a'}),
  bigadd:()=>{const v=4+Math.floor(G.wave/2);return{op:'add',val:v,label:'+'+v,color:'#7dff9b'};},
  add:()=>{const v=2+Math.floor(G.wave/3);return{op:'add',val:v,label:'+'+v,color:'#7dff9b'};},
  sub:()=>{const v=2+Math.floor(G.wave/4);return{op:'sub',val:v,label:'-'+v,color:'#ff6b7a'};},
};
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function spawnGate(){
  // 3分割ゲート。中身は毎回シャッフル。×2が常に最善＆安全にならないよう罠を混ぜる。
  const m=margin(), x0=m, w=W-2*m, sw=w/3;
  const templates = [
    ()=>[GATE.mul2(), GATE.sub(), GATE.div2()],   // ×2は最善だが両隣が罠
    ()=>[GATE.bigadd(), GATE.mul2(), GATE.sub()], // +大量 vs ×2 の択（人数で正解が変わる）
    ()=>[GATE.mul3(), GATE.div2(), GATE.sub()],   // ×3ハイリスク
    ()=>[GATE.add(), GATE.bigadd(), GATE.sub()],  // 乗算なしの加算択
    ()=>[GATE.mul2(), GATE.add(), GATE.div2()],
  ];
  const sections = shuffle(templates[Math.floor(Math.random()*templates.length)]());
  gates.push({ y:-40, x:W*0.5, x0, w, sw, sections, active:-1 });
}
function spawnHazard(){
  // 感電バリア：1レーンに降下。通過した部隊が感電して兵士が減る → 位置取りを強制。
  const m=margin(), w=W-2*m, sw=w/3, lane=Math.floor(Math.random()*3);
  hazards.push({ x:m+sw*(lane+0.5), w:sw*0.8, y:-30, spd:42+G.wave*1.1 });
}
function spawnShield(){
  const hp = 90 + G.wave*40;
  shields.push({ x:W*0.5, y:-90, w:Math.min(W*0.56,210), h:70, hp, maxHp:hp,
    spd:7+G.wave*0.4, spit:0, hit:0 });
  G.banner = { txt:'装甲隔壁', sub:'ARMORED BULKHEAD', life:1.8, max:1.8, color:'#ff5566' };
  sfx('boss');
}

// ---------- 更新 ----------
function update(dt){
  G.t += dt;
  if(G.shake>0) G.shake=Math.max(0,G.shake-dt*3);
  if(G.hurt>0) G.hurt=Math.max(0,G.hurt-dt*1.6);
  if(G.flash>0) G.flash=Math.max(0,G.flash-dt*3.5);
  if(keyDir) movePlayer(player.x + keyDir*W*0.9*dt);

  // 通常敵スポーン（時間で加速・序盤はゆっくり）
  const rate = 0.6 + G.t*0.009 + G.wave*0.045;
  G.spawnAcc += dt*rate;
  while(G.spawnAcc>=1){ G.spawnAcc-=1; spawnEnemy(); }

  // ウェーブ更新
  const w = 1 + Math.floor(G.t/16);
  if(w!==G.wave){
    G.wave=w;
    G.banner={ txt:'WAVE '+w, sub:'敵の増援', life:1.5, max:1.5, color:'#41e3ff' };
    sfx('wave');
  }

  // ゲート
  G.gateTimer -= dt;
  if(G.gateTimer<=0){ spawnGate(); G.gateTimer = rnd(13,18); }
  // 感電バリア（障害物）
  G.hazTimer -= dt;
  if(G.hazTimer<=0){ spawnHazard(); G.hazTimer = rnd(6,10); }
  // シールドボス
  G.bossTimer -= dt;
  if(G.bossTimer<=0 && shields.length===0){ spawnShield(); G.bossTimer = rnd(42,55); }

  // --- プレイヤー射撃（各兵士の銃口から発射） ---
  player.cd -= dt;
  player.flash = Math.max(0, (player.flash||0) - dt);
  const interval = 1/(2.2 + player.upR*0.9);
  if(player.cd<=0){
    player.cd = interval; player.flash = 0.06;
    for(const p of soldierPositions()){
      bullets.push({ x:p.x, y:p.y-18, vy:-560, r:4, dmg:player.damage });
      parts.push({ x:p.x, y:p.y-18, vx:0, vy:-2, life:.08, max:.08, color:'#d6fff0', r:3.5 });
    }
    sfx('shot');
  }

  // --- 弾 ---
  for(let b of bullets){ b.y += b.vy*dt; }
  // 弾 vs 敵 / ゲート / シールド
  for(let b of bullets){
    if(b.dead) continue;
    // シールド
    for(let s of shields){
      if(b.x>s.x-s.w/2 && b.x<s.x+s.w/2 && b.y>s.y && b.y<s.y+s.h){
        s.hp -= b.dmg; b.dead=true; G.shake=Math.max(G.shake,.25); s.hit=0.08;
        burst(b.x,b.y,'#bdeaff',3,90); break;
      }
    }
    if(b.dead) continue;
    // 敵
    for(let e of enemies){
      if(e.dead) continue;
      const dx=b.x-e.x, dy=b.y-e.y;
      if(dx*dx+dy*dy < (e.r+b.r)*(e.r+b.r)){
        e.hp-=b.dmg; b.dead=true; e.hit=0.09; burst(b.x,b.y,'#9be7ff',2,60);
        if(e.hp<=0){ killEnemy(e); }
        break;
      }
    }
  }
  bullets = bullets.filter(b=>!b.dead && b.y>-20);

  // --- 敵 ---
  const lineY = playLineY();
  for(let e of enemies){
    if(e.dead) continue;
    e.y += e.spd*dt; e.legt += dt*10;
    if(e.hit>0) e.hit-=dt;
    e.x += Math.sin(G.t*2+e.wob)*8*dt;
    if(e.y >= lineY-e.r){
      // 防衛ライン到達
      e.dead=true;
      if(e.type==='brute'){
        player.hp -= 10;
        player.soldiers = Math.max(player.base, player.soldiers - e.eat); clampSoldiers();
        floatText(e.x, lineY-26, '部隊-'+e.eat, '#ff6b7a');
      } else { player.hp -= 4; }
      G.shake=.5; G.hurt=Math.max(G.hurt,.7); sfx('hurt');
      burst(e.x,lineY,'#ff4d5e',10,120); ring(e.x,lineY,'#ff4d5e',6,44,.4);
      breakCombo();
      if(player.hp<=0) gameOver();
    }
  }

  // --- 感電バリア（障害物）：避けないと部隊が減る ---
  for(let h of hazards){
    h.y += h.spd*dt;
    if(h.y >= lineY-14 && !h.done){
      h.done=true;
      if(Math.abs(player.x - h.x) < h.w/2 + 8){
        const before = player.soldiers;
        player.soldiers = Math.max(player.base, player.soldiers - 4); clampSoldiers();
        const lost = before - player.soldiers;             // 実際に減った数を出す（前は常に -4 と表示していた）
        player.hp -= 8; G.shake=.55; G.hurt=Math.max(G.hurt,.9);
        burst(player.x,lineY,'#ff4d5e',18,160); ring(player.x,lineY,'#ff4d5e',8,70,.45);
        floatText(player.x, lineY-30, '感電 -'+lost, '#ff6b7a', 17);
        sfx('zap'); breakCombo();
        if(player.hp<=0) gameOver();
      }
    }
  }
  hazards = hazards.filter(h=>h.y<H+30 && !h.done);

  // --- 複製ゲート：横移動でセクションを選び、部隊を増減 ---
  for(let g of gates){
    g.y += 34*dt;
    // 部隊が今どのセクションの下にいるか
    g.active = -1;
    for(let i=0;i<g.sections.length;i++){
      if(player.x >= g.x0 + i*g.sw && player.x < g.x0 + (i+1)*g.sw){ g.active=i; break; }
    }
    if(g.y >= lineY-18 && !g.done){
      g.done=true;
      const sec = g.sections[g.active>=0?g.active:0];
      const before = player.soldiers;
      applyGate(sec);
      const gain = player.soldiers - before;
      floatText(player.x, lineY-30, sec.label+' → '+player.soldiers, sec.color, 18);
      burst(player.x, lineY-20, sec.color, 14, 130);
      ring(player.x, lineY-20, sec.color, 10, 76, .5);
      G.shake=.3; sfx(gain>=0?'good':'bad');
    }
  }
  gates = gates.filter(g=>g.y<H+40 && !g.done);

  // --- シールドボス ---
  for(let s of shields){
    s.y += s.spd*dt;
    s.spit -= dt;
    if(s.hit>0) s.hit-=dt;
    if(s.spit<=0){ s.spit = Math.max(.7, 2.0-G.wave*0.04);
      spawnEnemy(rnd(s.x-s.w/2, s.x+s.w/2)); }
    if(s.hp<=0){
      s.dead=true; G.score+=50; G.coins+=30; G.slowmo=.4; G.shake=.7; G.flash=.8;
      burst(s.x,s.y+s.h/2,'#bdeaff',40,220);
      ring(s.x,s.y+s.h/2,'#bdeaff',20,Math.max(W,H),.7);
      floatText(s.x,s.y+s.h/2,'隔壁を破壊  +30◈','#41e3ff',18);
      sfx('heavy'); sfx('good');
    } else if(s.y+s.h >= lineY){
      s.dead=true; player.hp-=28; G.shake=.7; G.hurt=1; sfx('hurt');
      burst(s.x,lineY,'#ff4d5e',30,180); ring(s.x,lineY,'#ff4d5e',10,W,.5);
      breakCombo();
      if(player.hp<=0) gameOver();
    }
  }
  shields = shields.filter(s=>!s.dead);
  enemies = enemies.filter(e=>!e.dead);

  // --- コンボ（連続撃破）。途切れるまでの猶予は 1.6 秒 ---
  if(G.combo>0){ G.comboT-=dt; if(G.comboT<=0) breakCombo(); }

  // --- パーティクル / テキスト / 衝撃波 ---
  for(let p of parts){ p.x+=p.vx*dt*60; p.y+=p.vy*dt*60; p.vy+=14*dt; p.life-=dt; }
  parts = parts.filter(p=>p.life>0);
  for(let t of texts){ t.y-=24*dt; t.life-=dt; }
  texts = texts.filter(t=>t.life>0);
  for(let r of rings){ r.life-=dt; r.r += (r.to-r.r)*Math.min(1,dt*7); }
  rings = rings.filter(r=>r.life>0);
  if(G.banner){ G.banner.life-=dt; if(G.banner.life<=0) G.banner=null; }

  if(G.slowmo>0) G.slowmo-=dt;
  syncHUD();
}

function breakCombo(){ G.combo=0; G.comboT=0; }
function killEnemy(e){
  e.dead=true; G.score+=1; G.coins+=1;
  G.combo++; G.comboT=1.6;
  // 5連続ごとにボーナス。狙って途切れさせない遊び方が生まれる
  if(G.combo%5===0){
    const bonus = Math.min(10, 2+Math.floor(G.combo/5));
    G.coins+=bonus; G.score+=bonus;
    floatText(e.x, e.y-14, G.combo+' 連続  +'+bonus+'◈', '#ffe14d', 16);
    sfx('up');
  }
  burst(e.x,e.y,e.type==='brute'?'#ff5fae':'#ff6b7a', e.type==='brute'?18:8, e.type==='brute'?170:110);
  ring(e.x,e.y,e.type==='brute'?'#ff5fae':'#ff6b7a',4,e.type==='brute'?52:26,.28);
  sfx(e.type==='brute'?'heavy':'kill', Math.min(8,G.combo));
}

/* ===================== 背景 =====================
   毎フレーム描くと重いので、動かない部分（空・遠景の街・両脇の防壁・床の遠近線）は
   1枚に焼いておく。動くのはスクロールする横線と光の粒だけ。 */
let bd=null, horizon=0;
function buildBackdrop(){
  if(!W||!H) return;
  // 地平線は高め。低いと敵の大半が「空の上」を歩いているように見える
  horizon = H*0.22;
  const c = document.createElement('canvas');
  c.width=Math.round(W*DPR); c.height=Math.round(H*DPR);
  const g = c.getContext('2d');
  g.setTransform(DPR,0,0,DPR,0,0);

  // 空（上ほど紫、地平線でシアンが滲む）
  const sky = g.createLinearGradient(0,0,0,horizon+40);
  sky.addColorStop(0,'#0a0620'); sky.addColorStop(0.55,'#140a2e'); sky.addColorStop(1,'#22124a');
  g.fillStyle=sky; g.fillRect(0,0,W,horizon+40);
  // 地面（手前ほど暗い）
  const gr = g.createLinearGradient(0,horizon,0,H);
  gr.addColorStop(0,'#160c34'); gr.addColorStop(0.5,'#0a0720'); gr.addColorStop(1,'#050311');
  g.fillStyle=gr; g.fillRect(0,horizon,W,H-horizon);

  // 星
  for(let i=0;i<70;i++){
    const x=Math.random()*W, y=Math.random()*horizon*0.9, a=Math.random()*0.5+0.1;
    g.fillStyle=`rgba(200,230,255,${a})`; g.fillRect(x,y,1.2,1.2);
  }
  // 大きな月（ホログラムの輪付き）
  const mx=W*0.74, my=horizon*0.34, mr=Math.max(22,W*0.075);
  const mg=g.createRadialGradient(mx,my,0,mx,my,mr*2.4);
  mg.addColorStop(0,'rgba(255,150,210,.28)'); mg.addColorStop(1,'rgba(255,150,210,0)');
  g.fillStyle=mg; g.beginPath(); g.arc(mx,my,mr*2.4,0,6.28); g.fill();
  g.fillStyle='#ffd0e8'; g.beginPath(); g.arc(mx,my,mr,0,6.28); g.fill();
  g.strokeStyle='rgba(65,227,255,.5)'; g.lineWidth=1;
  g.beginPath(); g.ellipse(mx,my,mr*1.6,mr*0.42,-0.35,0,6.28); g.stroke();

  // 遠景の街（2列。奥は暗く小さく、手前は明るく大きく＝奥行きが出る）
  drawCity(g, horizon-2, 0.55, 'rgba(28,16,58,.95)', 'rgba(120,90,255,.5)');
  drawCity(g, horizon+1, 1.0,  'rgba(12,8,28,.98)',  'rgba(65,227,255,.55)');

  // 地平線の光（街の上に薄い霞）
  const hz=g.createLinearGradient(0,horizon-26,0,horizon+16);
  hz.addColorStop(0,'rgba(65,227,255,0)'); hz.addColorStop(0.6,'rgba(65,227,255,.22)');
  hz.addColorStop(1,'rgba(65,227,255,0)');
  g.fillStyle=hz; g.fillRect(0,horizon-26,W,42);

  // 床の遠近線（消失点＝地平線の中央）。進撃してくる通路に見せる。
  // ★薄く引くこと。濃くすると「光のビーム」に見えて、床に見えない（最初これで失敗した）
  const m=margin();
  g.strokeStyle='rgba(65,227,255,.07)'; g.lineWidth=1;
  for(let i=0;i<=6;i++){
    const bx = m + (W-2*m)*i/6;
    g.beginPath(); g.moveTo(W/2, horizon); g.lineTo(bx, H); g.stroke();
  }
  g.strokeStyle='rgba(65,227,255,.13)'; g.lineWidth=1.2;
  g.beginPath(); g.moveTo(W/2,horizon); g.lineTo(m,H); g.moveTo(W/2,horizon); g.lineTo(W-m,H); g.stroke();

  drawWalls(g, m);
  drawBase(g);
  bd = c;
}
// 街のシルエット＋窓の灯り
function drawCity(g, baseY, scale, fill, glow){
  let x=-10;
  while(x<W+10){
    const w=rnd(14,34)*scale, h=rnd(18,74)*scale, y=baseY-h;
    g.fillStyle=fill; g.fillRect(x,y,w,h);
    g.fillStyle=glow; g.fillRect(x,y,w,1.2);                 // 屋上のネオン
    // 窓
    for(let wy=y+4; wy<baseY-3; wy+=5*scale){
      for(let wx=x+2; wx<x+w-2; wx+=4*scale){
        if(Math.random()<0.30){
          g.fillStyle = Math.random()<0.2 ? 'rgba(255,95,174,.55)' : 'rgba(150,230,255,.42)';
          g.fillRect(wx,wy,1.6*scale,2.2*scale);
        }
      }
    }
    // たまに赤い航空障害灯
    if(Math.random()<0.25){ g.fillStyle='rgba(255,80,80,.8)'; g.fillRect(x+w/2-1,y-4,2,2); }
    x += w + rnd(3,12)*scale;
  }
}
/* 防衛ラインより手前＝守っている自軍の拠点。
   ここが空白のままだと「画面の下が切れている」ように見える（にゃんこアイスで同じ失敗をした）。
   ただし主役は部隊なので、暗く・低彩度にとどめる。 */
function drawBase(g){
  const lineY = H-70;
  const bg=g.createLinearGradient(0,lineY,0,H);
  bg.addColorStop(0,'rgba(9,14,26,.75)'); bg.addColorStop(1,'rgba(4,6,14,.95)');
  g.fillStyle=bg; g.fillRect(0,lineY,W,H-lineY);
  // 床のパネル継ぎ目
  g.strokeStyle='rgba(120,180,220,.07)'; g.lineWidth=1;
  for(let x=0;x<W;x+=26){ g.beginPath(); g.moveTo(x,lineY+6); g.lineTo(x-10,H); g.stroke(); }
  for(let y=lineY+14;y<H;y+=16){ g.beginPath(); g.moveTo(0,y); g.lineTo(W,y); g.stroke(); }
  // 左右の掩体（バンカー）とアンテナ
  for(const side of [0,1]){
    const bw=Math.min(46,W*0.13), x = side ? W-bw-6 : 6, y=lineY+12;
    g.fillStyle='#101a2a'; g.strokeStyle='rgba(65,227,255,.22)'; g.lineWidth=1;
    g.beginPath(); g.roundRect(x,y,bw,H-y-8,4); g.fill(); g.stroke();
    g.fillStyle='rgba(65,227,255,.30)';
    for(let i=0;i<3;i++) g.fillRect(x+6+i*(bw-12)/3, y+8, 5, 3);   // 窓
    g.strokeStyle='rgba(125,255,155,.35)';
    g.beginPath(); g.moveTo(x+bw/2, y); g.lineTo(x+bw/2, y-9); g.stroke();
    g.fillStyle='rgba(125,255,155,.7)'; g.fillRect(x+bw/2-1.5, y-11, 3, 3);
  }
  // 中央の補給コンテナ
  const cw=Math.min(70,W*0.2), cx=W/2-cw/2, cy=H-26;
  g.fillStyle='#141d2c'; g.strokeStyle='rgba(255,225,77,.18)'; g.lineWidth=1;
  g.beginPath(); g.roundRect(cx,cy,cw,18,3); g.fill(); g.stroke();
  g.strokeStyle='rgba(255,225,77,.10)';
  for(let i=1;i<4;i++){ g.beginPath(); g.moveTo(cx+cw*i/4,cy); g.lineTo(cx+cw*i/4,cy+18); g.stroke(); }
}

// 両脇の防壁。**装飾ではなく、横移動が帯の中に制限されている理由を画面で示すためのもの**
function drawWalls(g, m){
  for(const side of [0,1]){
    const x0 = side ? W-m : 0, w = m;
    const lg = g.createLinearGradient(x0,0,x0+w,0);
    if(side){ lg.addColorStop(0,'rgba(10,7,26,.15)'); lg.addColorStop(1,'rgba(6,4,16,.95)'); }
    else    { lg.addColorStop(0,'rgba(6,4,16,.95)');  lg.addColorStop(1,'rgba(10,7,26,.15)'); }
    g.fillStyle=lg; g.fillRect(x0,0,w,H);
    // 縦の配管
    g.strokeStyle='rgba(120,160,220,.10)'; g.lineWidth=1;
    for(let i=1;i<4;i++){ const xx=x0+w*i/4; g.beginPath(); g.moveTo(xx,horizon*0.6); g.lineTo(xx,H); g.stroke(); }
    // 横のパネル継ぎ目
    for(let y=horizon; y<H; y+=26){
      g.strokeStyle='rgba(120,160,220,.07)';
      g.beginPath(); g.moveTo(x0,y); g.lineTo(x0+w,y); g.stroke();
    }
    // 内側の縁のネオン
    const ex = side ? x0 : x0+w;
    const eg = g.createLinearGradient(ex-6,0,ex+6,0);
    eg.addColorStop(0,'rgba(65,227,255,0)'); eg.addColorStop(.5,'rgba(65,227,255,.22)'); eg.addColorStop(1,'rgba(65,227,255,0)');
    g.fillStyle=eg; g.fillRect(ex-6,horizon*0.5,12,H);
    // 足元の警告ストライプ
    g.save();
    g.beginPath(); g.rect(x0,H-92,w,20); g.clip();
    for(let i=-20;i<w+20;i+=12){
      g.strokeStyle='rgba(255,225,77,.16)'; g.lineWidth=5;
      g.beginPath(); g.moveTo(x0+i,H-72); g.lineTo(x0+i+18,H-92); g.stroke();
    }
    g.restore();
  }
}

// ---------- 描画 ----------
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if(G.shake>0){ ctx.translate(rnd(-1,1)*G.shake*8, rnd(-1,1)*G.shake*8); }

  drawBg();

  const lineY = playLineY();
  drawDefenseLine(lineY);

  for(let g of gates) drawGate(g);
  for(let h of hazards) drawHazard(h);
  for(let s of shields) drawShield(s);
  for(let e of enemies) drawEnemy(e);

  // 弾（芯＋残光。単色の丸より速く見える）
  for(let b of bullets){
    ctx.strokeStyle='rgba(125,255,208,.35)'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(b.x,b.y+13); ctx.lineTo(b.x,b.y-6); ctx.stroke();
  }
  ctx.fillStyle='#d9fff2'; ctx.shadowColor='#7dffd0'; ctx.shadowBlur=9;
  for(let b of bullets){ ctx.beginPath(); ctx.ellipse(b.x,b.y,b.r*0.8,b.r*2.0,0,0,6.28); ctx.fill(); }
  ctx.shadowBlur=0;

  drawSquad(lineY);

  // 衝撃波
  for(let r of rings){
    ctx.globalAlpha = Math.max(0, r.life/r.max)*0.7;
    ctx.strokeStyle=r.color; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(r.x,r.y,r.r,0,6.28); ctx.stroke();
  }
  ctx.globalAlpha=1;
  // パーティクル
  for(let p of parts){ ctx.globalAlpha=Math.max(0,p.life/p.max); ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.28); ctx.fill(); }
  ctx.globalAlpha=1;
  // フロートテキスト
  ctx.textAlign='center';
  for(let t of texts){
    ctx.globalAlpha=Math.min(1,t.life*1.5);
    ctx.font=F_JP(900,t.size); ctx.lineWidth=3; ctx.strokeStyle='rgba(4,3,12,.85)';
    ctx.strokeText(t.txt,t.x,t.y); ctx.fillStyle=t.color; ctx.fillText(t.txt,t.x,t.y);
  }
  ctx.globalAlpha=1;

  drawCombo();
  drawBanner();
  ctx.restore();

  drawOverlayFx();     // 走査線・被弾の赤み・白フラッシュ（揺れの外＝画面の縁が欠けない）
}

function drawBg(){
  if(bd) ctx.drawImage(bd,0,0,W,H);
  // 床のスクロール（手前ほど速い＝遠近が効く）。
  // 幅は消失点の 12px から通路の幅まで。**通路の外へはみ出させない**
  const m=margin(), full=W/2-m;
  const N=14, sp=1/N, off=(G.t*0.16)%sp;
  for(let i=0;i<N;i++){
    const t=(i*sp+off);
    const y=horizon+(H-horizon)*t*t;             // 二乗で下ほど間隔が広がる
    const half=12+(full-12)*t*t;
    ctx.strokeStyle=`rgba(65,227,255,${0.04+0.12*t})`; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(W/2-half, y); ctx.lineTo(W/2+half, y); ctx.stroke();
  }
  // 壁を流れる光（進んでいる感じを出す）
  for(let k=0;k<4;k++){
    const t=((G.t*0.35+k*0.25)%1);
    const y=horizon+(H-horizon)*t*t, a=(1-t)*0.22;
    ctx.fillStyle=`rgba(65,227,255,${a})`;
    ctx.fillRect(m-2, y, 2, 18); ctx.fillRect(W-m, y, 2, 18);
  }
}

function drawDefenseLine(lineY){
  // 「ここを越えられたら負け」を強く見せる。HPが減ると赤に寄る
  const hpR = Math.max(0, player.hp/player.maxHp);
  const col = hpR>0.5 ? [65,227,255] : hpR>0.25 ? [255,181,77] : [255,77,94];
  const pulse = 0.55+0.45*Math.sin(G.t*4);
  const gd=ctx.createLinearGradient(0,lineY-16,0,lineY+6);
  gd.addColorStop(0,`rgba(${col[0]},${col[1]},${col[2]},0)`);
  gd.addColorStop(1,`rgba(${col[0]},${col[1]},${col[2]},${0.16+0.10*pulse})`);
  ctx.fillStyle=gd; ctx.fillRect(0,lineY-16,W,22);
  ctx.strokeStyle=`rgba(${col[0]},${col[1]},${col[2]},${0.55+0.35*pulse})`; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(0,lineY); ctx.lineTo(W,lineY); ctx.stroke();
  // 山形のマーク（防衛線の記号）
  ctx.strokeStyle=`rgba(${col[0]},${col[1]},${col[2]},.28)`; ctx.lineWidth=1.5;
  for(let x=6;x<W;x+=22){
    ctx.beginPath(); ctx.moveTo(x,lineY-6); ctx.lineTo(x+6,lineY-1); ctx.lineTo(x+12,lineY-6); ctx.stroke();
  }
  // 両端の支柱
  const m=margin();
  for(const x of [m,W-m]){
    ctx.fillStyle='#132a3c'; ctx.strokeStyle=`rgba(${col[0]},${col[1]},${col[2]},.8)`; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.roundRect(x-5,lineY-22,10,30,3); ctx.fill(); ctx.stroke();
    ctx.fillStyle=`rgba(${col[0]},${col[1]},${col[2]},${0.5+0.5*pulse})`;
    ctx.beginPath(); ctx.arc(x,lineY-16,2.6,0,6.28); ctx.fill();
  }
}

function drawSquad(lineY){
  const firing = (player.flash||0)>0;
  const pos = soldierPositions();
  // 威力を上げるほど装甲の芯が金色に寄る（強化が見た目に出る）
  const core = player.upD>=4 ? '#ffe14d' : player.upD>=2 ? '#7dffd0' : '#41e3ff';
  // 奥の列から描く（手前が重なって見えるように）
  for(let i=pos.length-1;i>=0;i--){
    const x=pos[i].x, y=pos[i].y + (firing?0.8:0);      // 発砲でわずかに沈む＝反動
    const bob = Math.sin(G.t*6 + i*0.7)*0.7;
    // 足元の光と影
    ctx.fillStyle='rgba(0,0,0,.4)'; ctx.beginPath(); ctx.ellipse(x,y+15,9,3,0,0,6.28); ctx.fill();
    ctx.fillStyle='rgba(65,227,255,.16)'; ctx.beginPath(); ctx.ellipse(x,y+15,11,4,0,0,6.28); ctx.fill();
    // 脚
    ctx.strokeStyle='#1f6f86'; ctx.lineWidth=3; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(x-3,y+6); ctx.lineTo(x-4,y+13);
    ctx.moveTo(x+3,y+6); ctx.lineTo(x+4,y+13); ctx.stroke();
    ctx.lineCap='butt';
    // 胴（強化外骨格）。上が明るいグラデにすると板ではなく立体に見える
    const bg=ctx.createLinearGradient(0,y-7+bob,0,y+9+bob);
    bg.addColorStop(0,'#3fc0e0'); bg.addColorStop(1,'#1b6d87');
    ctx.fillStyle=bg; ctx.strokeStyle='#9df6ff'; ctx.lineWidth=1.4;
    ctx.beginPath(); ctx.roundRect(x-8,y-7+bob,16,15,4); ctx.fill(); ctx.stroke();
    // 動力炉
    ctx.fillStyle=core; ctx.shadowColor=core; ctx.shadowBlur=7;
    ctx.beginPath(); ctx.arc(x,y+1+bob,2.2,0,6.28); ctx.fill(); ctx.shadowBlur=0;
    // 肩当て
    ctx.fillStyle='#2b8fae';
    ctx.beginPath(); ctx.roundRect(x-11,y-7+bob,5,6,2); ctx.roundRect(x+6,y-7+bob,5,6,2); ctx.fill();
    // 両手のガトリング（前方＝上向き）
    ctx.fillStyle='#26505f';
    ctx.beginPath(); ctx.roundRect(x-11.5,y-13+bob,5,12,1.5); ctx.roundRect(x+6.5,y-13+bob,5,12,1.5); ctx.fill();
    ctx.fillStyle='#16323c'; ctx.fillRect(x-10.5,y-13+bob,3,3); ctx.fillRect(x+7.5,y-13+bob,3,3);
    // 頭＋バイザー
    ctx.fillStyle='#dff7ff'; ctx.beginPath(); ctx.arc(x,y-12+bob,6,0,6.28); ctx.fill();
    ctx.fillStyle='#0a3d4a'; ctx.fillRect(x-5,y-14+bob,10,4);
    ctx.fillStyle=core; ctx.shadowColor=core; ctx.shadowBlur=6;
    ctx.fillRect(x-5,y-13.5+bob,10,2); ctx.shadowBlur=0;
    // マズルフラッシュ
    if(firing){
      ctx.fillStyle='rgba(220,255,245,.95)'; ctx.shadowColor='#7dffd0'; ctx.shadowBlur=12;
      ctx.beginPath(); ctx.arc(x-9,y-14+bob,3.4,0,6.28); ctx.arc(x+9,y-14+bob,3.4,0,6.28); ctx.fill();
      ctx.shadowBlur=0;
      ctx.fillStyle='rgba(125,255,208,.10)';
      ctx.beginPath(); ctx.moveTo(x-12,y-15+bob); ctx.lineTo(x+12,y-15+bob); ctx.lineTo(x+20,y-46+bob); ctx.lineTo(x-20,y-46+bob); ctx.closePath(); ctx.fill();
    }
  }
  // 部隊の人数札。ゲートの択を考えるとき、今の人数が要る
  const top = pos.length ? pos[pos.length-1].y : lineY;
  const label = '×'+player.soldiers;
  ctx.font=F_NUM(900,14); ctx.textAlign='center';
  const tw = ctx.measureText(label).width + 16;
  ctx.fillStyle='rgba(4,3,12,.72)'; ctx.strokeStyle='rgba(65,227,255,.6)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.roundRect(player.x-tw/2, top-46, tw, 19, 9); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#c9f6ff'; ctx.fillText(label, player.x, top-32);
}

function drawEnemy(e){
  const x=e.x,y=e.y;
  const body = e.type==='brute'?'#5a1530' : e.type==='runner'?'#7a3a1f' : '#7a1f2a';
  const edge = e.type==='brute'?'#ff5fae' : e.type==='runner'?'#ffb060' : '#ff5566';
  const step = Math.sin(e.legt)*2;

  // 影
  ctx.fillStyle='rgba(0,0,0,.35)';
  ctx.beginPath(); ctx.ellipse(x,y+e.r*0.95,e.r*0.8,e.r*0.25,0,0,6.28); ctx.fill();

  if(e.type==='runner'){
    // 走査型：尖った機体＋残光。速さが形で分かるように
    ctx.fillStyle='rgba(255,176,96,.18)';
    ctx.beginPath(); ctx.moveTo(x-e.r*0.5,y-e.r); ctx.lineTo(x+e.r*0.5,y-e.r); ctx.lineTo(x,y-e.r*2.6); ctx.closePath(); ctx.fill();
    ctx.fillStyle=body; ctx.strokeStyle=edge; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(x,y+e.r); ctx.lineTo(x+e.r*0.85,y-e.r*0.3);
    ctx.lineTo(x,y-e.r*0.9); ctx.lineTo(x-e.r*0.85,y-e.r*0.3); ctx.closePath();
    ctx.fill(); ctx.stroke();
  } else {
    // 機体
    const bg=ctx.createLinearGradient(0,y-e.r*0.7,0,y+e.r*0.7);
    bg.addColorStop(0, e.type==='brute'?'#7a1f42':'#992935'); bg.addColorStop(1, body);
    ctx.fillStyle=bg; ctx.strokeStyle=edge; ctx.lineWidth = e.type==='brute'?2.5:1.5;
    ctx.beginPath(); ctx.roundRect(x-e.r*0.8,y-e.r*0.7,e.r*1.6,e.r*1.4,4); ctx.fill(); ctx.stroke();
    if(e.type==='brute'){
      // 装甲プレートと肩のピストン
      ctx.strokeStyle='rgba(255,255,255,.22)';
      ctx.strokeRect(x-e.r*0.55,y-e.r*0.45,e.r*1.1,e.r*0.9);
      ctx.fillStyle='#3a0f22';
      ctx.beginPath(); ctx.roundRect(x-e.r*1.15,y-e.r*0.6,e.r*0.4,e.r*0.8,2);
      ctx.roundRect(x+e.r*0.75,y-e.r*0.6,e.r*0.4,e.r*0.8,2); ctx.fill();
      // ダメージのひび
      if(e.hp/e.maxHp<0.5){ ctx.strokeStyle='rgba(255,225,120,.5)'; ctx.lineWidth=1;
        ctx.beginPath(); ctx.moveTo(x-6,y-6); ctx.lineTo(x-1,y+1); ctx.lineTo(x-5,y+6); ctx.stroke(); }
    }
  }
  // 脚（歩幅を付ける）
  ctx.strokeStyle=edge; ctx.lineWidth=2; ctx.lineCap='round';
  for(let k=-1;k<=1;k+=2){
    ctx.beginPath(); ctx.moveTo(x+k*e.r*0.7,y+e.r*0.4);
    ctx.lineTo(x+k*e.r*1.1, y+e.r*0.9+step*k); ctx.stroke();
  }
  ctx.lineCap='butt';
  // センサーアイ（ブルートは2つ目）
  ctx.fillStyle='#ff2030'; ctx.shadowColor='#ff2030'; ctx.shadowBlur=9;
  if(e.type==='brute'){ ctx.beginPath(); ctx.arc(x-4,y-2,3,0,6.28); ctx.arc(x+4,y-2,3,0,6.28); ctx.fill(); }
  else { ctx.beginPath(); ctx.arc(x,y-2,3.5,0,6.28); ctx.fill(); }
  ctx.shadowBlur=0;
  // 被弾フラッシュ（当たったことが分からないと、撃っている手応えが出ない）
  if(e.hit>0){
    ctx.globalAlpha=Math.min(1,e.hit*9); ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(x,y,e.r*0.95,0,6.28); ctx.fill(); ctx.globalAlpha=1;
  }
  // HPバー
  if(e.hp<e.maxHp){ const w=e.r*1.6;
    ctx.fillStyle='rgba(0,0,0,.55)'; ctx.fillRect(x-w/2,y-e.r-7,w,3.5);
    ctx.fillStyle=edge; ctx.fillRect(x-w/2,y-e.r-7,w*Math.max(0,e.hp/e.maxHp),3.5); }
}

function drawHazard(h){
  const x=h.x-h.w/2;
  const pulse=0.6+0.4*Math.sin(G.t*14);
  ctx.fillStyle=`rgba(255,77,94,${0.10+0.10*pulse})`; ctx.fillRect(x,h.y-15,h.w,30);
  ctx.strokeStyle=`rgba(255,77,94,${0.7+0.3*pulse})`; ctx.lineWidth=2; ctx.strokeRect(x,h.y-15,h.w,30);
  // 端子
  ctx.fillStyle='#3a1018'; ctx.strokeStyle='#ff4d5e'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.roundRect(x-7,h.y-12,9,24,3); ctx.roundRect(x+h.w-2,h.y-12,9,24,3); ctx.fill(); ctx.stroke();
  // 電撃アーク（2本）
  for(let k=0;k<2;k++){
    ctx.strokeStyle=k?'rgba(255,255,255,.55)':'rgba(255,170,180,.9)';
    ctx.lineWidth=k?1:1.6; ctx.beginPath();
    for(let xx=x; xx<=x+h.w; xx+=7){ const yy=h.y+rnd(-10,10); if(xx===x) ctx.moveTo(xx,yy); else ctx.lineTo(xx,yy); }
    ctx.stroke();
  }
  // 落下先の予告（床に印を出すと避けやすくなる＝理不尽に見えない）
  const lineY=playLineY();
  ctx.fillStyle='rgba(255,77,94,.05)'; ctx.fillRect(x,h.y+15,h.w,lineY-h.y-15);
  ctx.strokeStyle='rgba(255,77,94,.18)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(x,lineY); ctx.lineTo(x,h.y+15); ctx.moveTo(x+h.w,lineY); ctx.lineTo(x+h.w,h.y+15); ctx.stroke();
  ctx.fillStyle='#ff9aa4'; ctx.font=F_JP(900,13); ctx.textAlign='center';
  ctx.fillText('感電', h.x, h.y+5);
}

function hex2rgb(h){ const n=parseInt(h.slice(1),16); return [n>>16&255,n>>8&255,n&255]; }
function drawGate(g){
  ctx.textAlign='center';
  for(let i=0;i<g.sections.length;i++){
    const s=g.sections[i], sx=g.x0+i*g.sw, sel=(i===g.active);
    const [r,gr,b]=hex2rgb(s.color);
    // 枠（選択中はグラデで満たす）
    const grad=ctx.createLinearGradient(0,g.y-24,0,g.y+24);
    grad.addColorStop(0,`rgba(${r},${gr},${b},${sel?0.34:0.12})`);
    grad.addColorStop(1,`rgba(${r},${gr},${b},${sel?0.14:0.05})`);
    ctx.fillStyle=grad; ctx.fillRect(sx+2, g.y-24, g.sw-4, 48);
    // 走査線（ホログラムらしさ）
    ctx.strokeStyle=`rgba(${r},${gr},${b},${sel?0.22:0.10})`; ctx.lineWidth=1;
    for(let yy=g.y-22; yy<g.y+24; yy+=4){
      ctx.beginPath(); ctx.moveTo(sx+3,yy); ctx.lineTo(sx+g.sw-3,yy); ctx.stroke();
    }
    ctx.strokeStyle=s.color; ctx.lineWidth=sel?3:1.5;
    ctx.strokeRect(sx+2, g.y-24, g.sw-4, 48);
    // 記号
    ctx.font=F_NUM(900,23);
    ctx.fillStyle=s.color; ctx.shadowColor=s.color; ctx.shadowBlur=sel?18:8;
    ctx.fillText(s.label, sx+g.sw/2, g.y+3); ctx.shadowBlur=0;
    // 通ったら何人になるか（これが無いと3択が運ゲーに見える）
    ctx.font=F_NUM(700,10.5);
    const res=gateResult(s, player.soldiers);
    ctx.fillStyle=sel?'rgba(255,255,255,.92)':`rgba(${r},${gr},${b},.7)`;
    ctx.fillText('→ '+res, sx+g.sw/2, g.y+18);
  }
  // 選択中セクションから部隊への光ガイド
  if(g.active>=0){
    const cx=g.x0+(g.active+0.5)*g.sw, s=g.sections[g.active], [r,gr,b]=hex2rgb(s.color);
    const lg=ctx.createLinearGradient(0,g.y+24,0,playLineY()-30);
    lg.addColorStop(0,`rgba(${r},${gr},${b},.13)`); lg.addColorStop(1,`rgba(${r},${gr},${b},0)`);
    ctx.fillStyle=lg;
    ctx.beginPath(); ctx.moveTo(cx-g.sw*0.22,g.y+24); ctx.lineTo(cx+g.sw*0.22,g.y+24);
    ctx.lineTo(player.x+12,playLineY()-26); ctx.lineTo(player.x-12,playLineY()-26); ctx.closePath(); ctx.fill();
  }
}

function drawShield(s){
  const ratio = Math.max(0, s.hp/s.maxHp);
  const x=s.x-s.w/2, y=s.y;
  // 装甲板
  const bg=ctx.createLinearGradient(0,y,0,y+s.h);
  bg.addColorStop(0,'#1d2f45'); bg.addColorStop(1,'#0e1a2a');
  ctx.fillStyle=bg; ctx.fillRect(x,y,s.w,s.h);
  // リベットとパネル線
  ctx.strokeStyle='rgba(189,234,255,.14)'; ctx.lineWidth=1;
  for(let i=1;i<5;i++){ ctx.beginPath(); ctx.moveTo(x+s.w*i/5,y); ctx.lineTo(x+s.w*i/5,y+s.h); ctx.stroke(); }
  ctx.beginPath(); ctx.moveTo(x,y+s.h*0.5); ctx.lineTo(x+s.w,y+s.h*0.5); ctx.stroke();
  // 前面のエネルギー膜（残量に応じて薄くなる）
  ctx.globalAlpha=0.20+0.35*ratio; ctx.fillStyle='rgba(189,234,255,.55)'; ctx.fillRect(x,y,s.w,s.h);
  ctx.globalAlpha=1;
  ctx.strokeStyle='#bdeaff'; ctx.lineWidth=2; ctx.strokeRect(x,y,s.w,s.h);
  // 中央のコア（赤目）
  const cx=s.x, cy=y+s.h/2;
  ctx.fillStyle='#3a0f18'; ctx.beginPath(); ctx.roundRect(cx-20,cy-12,40,24,6); ctx.fill();
  ctx.fillStyle='#ff5566'; ctx.shadowColor='#ff2030'; ctx.shadowBlur=14+8*Math.sin(G.t*6);
  ctx.beginPath(); ctx.arc(cx,cy,9,0,6.28); ctx.fill(); ctx.shadowBlur=0;
  ctx.fillStyle='rgba(255,255,255,.7)'; ctx.beginPath(); ctx.arc(cx-2,cy-3,2.5,0,6.28); ctx.fill();
  // 崩壊エッジ（残量が減るほどギザギザ）
  if(ratio<0.85){ ctx.strokeStyle='rgba(65,227,255,.8)'; ctx.lineWidth=1;
    const decay=(1-ratio); ctx.beginPath();
    for(let i=0;i<=s.w;i+=8){ const yy=y+s.h - rnd(0,decay*s.h);
      if(i===0) ctx.moveTo(x+i,yy); else ctx.lineTo(x+i,yy); } ctx.stroke(); }
  // 被弾フラッシュ
  if(s.hit>0){ ctx.globalAlpha=Math.min(1,s.hit*9); ctx.fillStyle='#fff'; ctx.fillRect(x,y,s.w,s.h); ctx.globalAlpha=1; }
  // HPバー
  ctx.fillStyle='rgba(0,0,0,.55)'; ctx.fillRect(x,y-10,s.w,6);
  ctx.fillStyle='#41e3ff'; ctx.fillRect(x,y-10,s.w*ratio,6);
  ctx.strokeStyle='rgba(255,255,255,.25)'; ctx.lineWidth=1; ctx.strokeRect(x,y-10,s.w,6);
}

// 連続撃破。数字が伸びていくのが見えると、途切れさせたくなくなる
function drawCombo(){
  if(G.combo<3) return;
  const a=Math.min(1,G.comboT*1.4);
  // 部隊は増えると上へ伸びるので、その頭（人数札）より上に出す。
  // 固定値にすると人数が多いとき札と重なる（スクリーンショットで発覚）
  const rows=Math.ceil(player.soldiers/6);
  const y=Math.min(playLineY()-70, playLineY()-(rows-1)*20-78);
  ctx.globalAlpha=a; ctx.textAlign='center';
  ctx.font=F_NUM(900, 15+Math.min(12,G.combo*0.5));
  ctx.fillStyle = G.combo>=15?'#ff5fae' : G.combo>=8?'#ffe14d' : '#7dffd0';
  ctx.shadowColor=ctx.fillStyle; ctx.shadowBlur=12;
  ctx.fillText(G.combo+' COMBO', W/2, y);
  ctx.shadowBlur=0; ctx.globalAlpha=1;
}

// ウェーブ開始・ボス出現の帯。何が起きたかを言葉で出す
function drawBanner(){
  const b=G.banner; if(!b) return;
  const p=1-b.life/b.max;                              // 0→1
  const a=Math.min(1, Math.min(p*4, (1-p)*4));
  const y=H*0.34;
  ctx.globalAlpha=a*0.85;
  const [r,g,bl]=hex2rgb(b.color);
  const gd=ctx.createLinearGradient(0,y-24,0,y+24);
  gd.addColorStop(0,`rgba(${r},${g},${bl},0)`); gd.addColorStop(.5,`rgba(${r},${g},${bl},.22)`);
  gd.addColorStop(1,`rgba(${r},${g},${bl},0)`);
  ctx.fillStyle=gd; ctx.fillRect(0,y-24,W,48);
  ctx.strokeStyle=b.color; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(0,y-24); ctx.lineTo(W,y-24); ctx.moveTo(0,y+24); ctx.lineTo(W,y+24); ctx.stroke();
  ctx.globalAlpha=a; ctx.textAlign='center';
  ctx.font=F_JP(900,22); ctx.fillStyle=b.color;
  ctx.shadowColor=b.color; ctx.shadowBlur=14;
  ctx.fillText(b.txt, W/2, y+2); ctx.shadowBlur=0;
  ctx.font=F_NUM(700,9.5); ctx.fillStyle='rgba(255,255,255,.6)';
  ctx.fillText(b.sub, W/2, y+18);
  ctx.globalAlpha=1;
}

// 画面全体に掛ける効果。揺れの外で描く（縁が欠けないように）
function drawOverlayFx(){
  // 走査線
  ctx.globalAlpha=0.05; ctx.fillStyle='#9fe8ff';
  for(let y=(G.t*24)%4; y<H; y+=4) ctx.fillRect(0,y,W,1);
  ctx.globalAlpha=1;
  // 被弾の赤み（内側だけ）
  if(G.hurt>0){
    const rg=ctx.createRadialGradient(W/2,H*0.7,Math.min(W,H)*0.25,W/2,H*0.7,Math.max(W,H)*0.75);
    rg.addColorStop(0,'rgba(255,40,60,0)'); rg.addColorStop(1,`rgba(255,40,60,${0.45*G.hurt})`);
    ctx.fillStyle=rg; ctx.fillRect(0,0,W,H);
  }
  // 隔壁破壊の白フラッシュ
  if(G.flash>0){ ctx.fillStyle=`rgba(220,250,255,${0.5*G.flash})`; ctx.fillRect(0,0,W,H); }
  // 四隅の暗がり
  const vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.42,W/2,H/2,Math.max(W,H)*0.78);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.55)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
}

// ---------- HUD / 強化 ----------
const el = id=>document.getElementById(id);
function syncHUD(){
  el('hScore').textContent=G.score; el('hWave').textContent=G.wave;
  el('hCoin').textContent=G.coins;
  const r=Math.max(0,player.hp)/player.maxHp;
  const bar=el('hHp'); bar.style.width=(r*100)+'%';
  bar.className='hpbar'+(r<=0.25?' crit':r<=0.5?' warn':'');
  // 強化ボタン
  const cs=costSoldier(), cr=costRate(), cd=costDmg();
  el('vSoldier').textContent=player.base+' / 6';
  el('vRate').textContent='LV'+(player.upR+1);
  el('vDmg').textContent='LV'+(player.upD+1);
  el('cSoldier').textContent = player.base>=6?'MAX':'◈'+cs;
  el('cRate').textContent='◈'+cr; el('cDmg').textContent='◈'+cd;
  toggleAfford('upSoldier', player.base<6 && G.coins>=cs);
  toggleAfford('upRate', G.coins>=cr);
  toggleAfford('upDmg', G.coins>=cd);
}
function toggleAfford(id,ok){ const b=el(id); b.classList.toggle('afford',ok); b.disabled=!ok && id==='upSoldier' && player.base>=6; }
const costSoldier=()=>25+player.upS*30;
const costRate=()=>15+player.upR*18;
const costDmg=()=>20+player.upD*22;

function bought(txt){
  sfx('up');
  floatText(player.x, playLineY()-56, txt, '#ffe14d', 15);
  ring(player.x, playLineY()-20, '#ffe14d', 10, 60, .4);
}
el('upSoldier').onclick=()=>{ initAudio(); if(player.base<6 && G.coins>=costSoldier()){ G.coins-=costSoldier(); player.upS++; player.base++; player.soldiers=Math.max(player.soldiers,player.base); bought('基本兵士 '+player.base); syncHUD(); } };
el('upRate').onclick=()=>{ initAudio(); const c=costRate(); if(G.coins>=c){ G.coins-=c; player.upR++; bought('連射 LV'+(player.upR+1)); syncHUD(); } };
el('upDmg').onclick=()=>{ initAudio(); const c=costDmg(); if(G.coins>=c){ G.coins-=c; player.upD++; player.damage=1+player.upD; bought('威力 LV'+(player.upD+1)); syncHUD(); } };

// ---------- ゲーム制御 ----------
function reset(){
  bullets=[];enemies=[];gates=[];shields=[];hazards=[];parts=[];texts=[];rings=[];
  Object.assign(G,{running:true,over:false,t:0,wave:1,score:0,coins:0,spawnAcc:0,gateTimer:14,
    bossTimer:45,hazTimer:13,shake:0,slowmo:0,combo:0,comboT:0,hurt:0,banner:null,flash:0});
  Object.assign(player,{x:W/2,soldiers:1,base:1,fireRate:1,damage:1,cd:0,hp:100,maxHp:100,upS:0,upR:0,upD:0,flash:0});
  G.banner={ txt:'WAVE 1', sub:'防衛開始', life:1.5, max:1.5, color:'#41e3ff' };
  syncHUD();
}
function start(){ initAudio(); el('overlay').classList.add('hidden'); reset(); }
function gameOver(){
  G.running=false; G.over=true;
  const best=Math.max(BEST,G.score); BEST=best;
  try { localStorage.setItem('cyborg_best',best); } catch(e){}
  el('ovTitle').textContent='防衛ライン突破';
  { const lat = document.querySelector('.panel .lat'); if (lat) lat.style.display='none'; }   // 結果画面ではラテンの題名を隠す
  el('ovSub').innerHTML='<div style="text-align:center;line-height:1.9">部隊は全滅した…<br>もう一度、迎撃しますか？</div>';
  el('ovScore').style.display='block';
  el('ovScore').innerHTML=`SCORE <b>${G.score}</b> &nbsp;/&nbsp; BEST <b>${best}</b>`;
  el('startBtn').textContent='再出撃';
  el('overlay').classList.remove('hidden');
  sfx('over');
}
el('startBtn').onclick=start;

// ---------- ループ ----------
let last=0;
function loop(ts){
  const raw=Math.min(0.05,(ts-last)/1000||0); last=ts;
  const dt = G.slowmo>0 ? raw*0.35 : raw;
  if(G.running) update(dt);
  else G.t += raw;                 // タイトル中も背景を動かす（止まった絵に見えない）
  draw();
  requestAnimationFrame(loop);
}

resize();
player.x=W/2;
if(BEST>0){
  el('ovScore').style.display='block';
  el('ovScore').innerHTML=`BEST <b>${BEST}</b>`;
}
syncHUD();
requestAnimationFrame(loop);
})();
</script>
