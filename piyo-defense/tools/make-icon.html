<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ひよこ防衛軍 アイコン生成</title>
<!--
  App Store 用のアイコンとスプラッシュを、**ゲーム本体と同じ描画関数で**作る。
  こうしておくと、ゲームの絵を直したときにアイコンだけ古いまま取り残されない。

  使い方: python3 tools/make-icon.py    （このページをheadless Chromeで開いてPNGを書き出す）

  Appleの決まり:
    - 1024×1024・**透過なし**・角丸にしない（OSが勝手に丸める）
    - 端まで塗る。余白を自分で足さない
-->
<style>html,body{margin:0;padding:0;background:#000;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="../js/render.js"></script>
<script>
'use strict';

// 空の色はゲームのステージ1と同じ（js/render.js の _SBG[0]）
var SKY_T = '#0A1740', SKY_M = '#16306B', SKY_B = '#4A72B0';
var MOON   = '#FFF4D6';

// 夜空＋月＋丘。size は正方形の一辺
function drawScene(ctx, size, chickScale, moonScale) {
  var S = size;
  setRenderCtx(ctx, S, S);

  // 空
  var g = ctx.createLinearGradient(0, 0, 0, S);
  g.addColorStop(0, SKY_T); g.addColorStop(0.52, SKY_M); g.addColorStop(1, SKY_B);
  ctx.fillStyle = g; ctx.fillRect(0, 0, S, S);

  // 地平線の光
  var hg = ctx.createRadialGradient(S*0.5, S*1.02, 0, S*0.5, S*1.02, S*0.95);
  hg.addColorStop(0, 'rgba(255,196,137,0.34)');
  hg.addColorStop(1, 'rgba(255,196,137,0)');
  ctx.fillStyle = hg; ctx.fillRect(0, 0, S, S);

  // 星（小さく。大きいと1024pxでは白い塊に見える）
  for (var i = 0; i < 60; i++) {
    var sx = (i*141+47) % S, sy = (i*233+31) % (S*0.60);
    ctx.globalAlpha = (1 - sy/(S*0.78)) * 0.8;
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath(); ctx.arc(sx, sy, S*0.0011 + (i%3)*S*0.0007, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // 月（右上）
  var mx = S*0.755, my = S*0.235, r = S*0.115*moonScale;
  var mh = ctx.createRadialGradient(mx, my, r*0.7, mx, my, r*3.0);
  mh.addColorStop(0, 'rgba(255,244,214,0.26)'); mh.addColorStop(1, 'rgba(255,244,214,0)');
  ctx.fillStyle = mh; ctx.beginPath(); ctx.arc(mx, my, r*3.0, 0, Math.PI*2); ctx.fill();
  var mg = ctx.createRadialGradient(mx-r*0.3, my-r*0.32, r*0.15, mx, my, r);
  mg.addColorStop(0, '#FFFFFF'); mg.addColorStop(1, MOON);
  ctx.fillStyle = mg; ctx.beginPath(); ctx.arc(mx, my, r, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.07)';
  [[-0.30,-0.10,0.24],[0.26,0.18,0.17],[0.02,0.42,0.12]].forEach(function(c){
    ctx.beginPath(); ctx.arc(mx+r*c[0], my+r*c[1], r*c[2], 0, Math.PI*2); ctx.fill();
  });

  // 遠い村（シルエット。ゲームの地面と同じ雰囲気）
  var base = S*0.845;
  ctx.fillStyle = 'rgba(10,23,64,0.85)';
  ctx.beginPath();
  ctx.moveTo(0, base-S*0.03);
  ctx.quadraticCurveTo(S*0.3, base-S*0.055, S*0.58, base-S*0.035);
  ctx.quadraticCurveTo(S*0.82, base-S*0.02, S, base-S*0.045);
  ctx.lineTo(S, S); ctx.lineTo(0, S); ctx.closePath(); ctx.fill();
  [[0.10,0.030],[0.20,0.022],[0.80,0.026],[0.90,0.020]].forEach(function(h,i){
    var hx = h[0]*S, hw = h[1]*S, hh = hw*0.95;
    ctx.fillStyle = '#3A2450';
    ctx.fillRect(hx-hw/2, base-hh, hw, hh);
    ctx.fillStyle = '#5A3A6E';
    ctx.beginPath();
    ctx.moveTo(hx-hw/2-hw*0.1, base-hh); ctx.lineTo(hx, base-hh-hw*0.42);
    ctx.lineTo(hx+hw/2+hw*0.1, base-hh); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,216,134,0.85)';
    ctx.fillRect(hx-hw*0.26, base-hh*0.62, hw*0.22, hh*0.28);
  });

  // 草地
  var grd = ctx.createLinearGradient(0, base-S*0.02, 0, S);
  grd.addColorStop(0, 'rgb(52,150,82)'); grd.addColorStop(1, 'rgb(24,86,48)');
  ctx.fillStyle = grd;
  ctx.beginPath();
  ctx.moveTo(0, base);
  ctx.quadraticCurveTo(S*0.25, base-S*0.022, S*0.5, base-S*0.006);
  ctx.quadraticCurveTo(S*0.75, base+S*0.01, S, base-S*0.014);
  ctx.lineTo(S, S); ctx.lineTo(0, S); ctx.closePath(); ctx.fill();

  // 攻めてくるカラス（小さく2羽）。「防衛軍」の相手が居ることを示す
  [[0.155, 0.335, 0.052], [0.315, 0.185, 0.038]].forEach(function(c) {
    drawCrow({ x:c[0]*S, y:c[1]*S, size:c[2]*S, hp:3, maxHp:3, wobble:0.6,
               type:'normal', hitFlash:0, rangedTimer:0, noHpBar:true });
  });

  // 主役のひよこ
  var cx = S*0.47, cy = S*0.585, sz = S*0.30*chickScale;
  ctx.save();
  ctx.translate(cx, cy);
  drawChick(0, 0, sz, false);
  // ヘルメット＝「防衛軍」であることを1枚で伝える。
  // **drawChick の acc:'helmet' は使えない**（縁が y=-sz*0.3 で、目 y=-sz*0.33 を隠す）。
  // ここでは縁を -sz*0.46 まで上げて、目が見える位置に描く。
  ctx.strokeStyle = '#2E9E96'; ctx.lineWidth = sz*0.045;
  var hg2 = ctx.createLinearGradient(-sz*0.42, -sz*0.9, sz*0.42, -sz*0.46);
  hg2.addColorStop(0, '#6FE3DB'); hg2.addColorStop(1, '#3AAFA6');
  ctx.fillStyle = hg2;
  ctx.beginPath(); ctx.arc(0, -sz*0.46, sz*0.42, Math.PI, 0); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#2E9E96';
  ctx.beginPath();
  ctx.moveTo(-sz*0.46, -sz*0.46); ctx.lineTo(sz*0.46, -sz*0.46);
  ctx.lineTo(sz*0.46, -sz*0.55); ctx.lineTo(-sz*0.46, -sz*0.55); ctx.closePath(); ctx.fill();
  // ヘルメットの星（防衛軍の記章）
  ctx.fillStyle = '#FFE45C';
  ctx.beginPath();
  for (var k = 0; k < 10; k++) {
    var ang = -Math.PI/2 + k*Math.PI/5, rr = (k%2 ? sz*0.055 : sz*0.125);
    ctx[k ? 'lineTo' : 'moveTo'](Math.cos(ang)*rr, -sz*0.64 + Math.sin(ang)*rr);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

// ?mode=icon（1024・アイコン）／?mode=splash（2732・起動画面）を1枚だけ描く。
// 画面いっぱいに1枚だけ置くので、headless Chrome の --screenshot でそのまま書き出せる。
var mode = (location.search.match(/mode=(\w+)/) || [])[1] || 'icon';
var cv = document.getElementById('c');

if (mode === 'splash') {
  // スプラッシュは正方形の中央がどの端末でも見える。ひよこを小さめにして寄りすぎを避ける
  cv.width = cv.height = 2732;
  cv.style.width = cv.style.height = '2732px';
  drawScene(cv.getContext('2d'), 2732, 0.62, 0.80);
} else {
  // アイコンは 60px 前後でも「ヘルメットのひよこ」と分かる必要がある。
  // 小さく作ると何も読めないので、ひよこを大きめに寄せる。
  cv.width = cv.height = 1024;
  cv.style.width = cv.style.height = '1024px';
  drawScene(cv.getContext('2d'), 1024, 1.26, 0.92);
}

window.__ready = true;
</script>
</body>
</html>
