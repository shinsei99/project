<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#FDBA74"/>
      <stop offset="0.45" stop-color="#F97316"/>
      <stop offset="1" stop-color="#DC2626"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.18" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#FFE7D0"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="512" height="512" rx="114" fill="url(#bg)"/>
  <rect width="512" height="512" rx="114" fill="url(#glow)"/>

  <!-- 皿 -->
  <circle cx="256" cy="272" r="156" fill="#000000" opacity="0.12"/>
  <circle cx="256" cy="266" r="156" fill="url(#plate)"/>
  <circle cx="256" cy="266" r="122" fill="none" stroke="#FDBA74" stroke-width="7" opacity="0.75"/>

  <!-- フォーク（頭は3本の歯、皿の色で溝を抜く） -->
  <g fill="#EA580C">
    <rect x="181" y="168" width="44" height="116" rx="14"/>
    <rect x="194" y="276" width="18" height="112" rx="9"/>
  </g>
  <g fill="#FFE7D0">
    <rect x="190" y="174" width="9" height="92" rx="4.5"/>
    <rect x="207" y="174" width="9" height="92" rx="4.5"/>
  </g>

  <!-- ナイフ（背は直線、刃側は先細り） -->
  <g fill="#EA580C">
    <path d="M321 168v122h-22v-64c0-26 8-46 22-58z"/>
    <rect x="301" y="282" width="18" height="106" rx="9"/>
  </g>

  <!-- 「パシャッ」の光（撮影を表す） -->
  <g fill="#ffffff">
    <path d="M392 96l13 36 36 13-36 13-13 36-13-36-36-13 36-13z"/>
    <path d="M112 128l8 22 22 8-22 8-8 22-8-22-22-8 22-8z" opacity="0.9"/>
  </g>
</svg>
