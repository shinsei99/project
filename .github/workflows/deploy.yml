name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy to gh-pages
        # ★コミットメッセージは **env 経由**で渡すこと。`${{ github.event.head_commit.message }}` を
        #   run: の中へ直接書くと、Actions が展開してからシェルが解釈するので、
        #   メッセージに 引用符や改行 が入っているとコマンドが壊れる（2026-08-28 に実際に落ちた:
        #   `error: pathspec 'not' did not match any file(s)`）。任意のコードが走る穴でもある。
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # 「公開先フォルダ:リポジトリ側の取り出し元」。`:` を書かなければ同名フォルダをそのまま出す。
          # ★公開中のWeb版は main を push したときに一緒に更新する（2026-08-28 オーナー判断）。
          #   手で置きに行くとズレる。実際 realestate-calc と nyanko-ice はここに無かったせいで
          #   数か月ぶん古いままだった。
          # ★ここへ足すフォルダには support.html / privacy.html を同梱しておくこと。
          #   下の rm -rf は公開先を作り直すので、リポジトリ側に無いファイルは消える。
          #   App Store に登録済みのサポート/プライバシーURLが消えると審査に出せなくなる。
          # ★color-gravity は 2026-08-28 に iOS アプリ化したので、本体が www/ へ移った（にゃんこアイスと同じ形）。
          #   `color-gravity` のままだと直下に index.html が無くてこのステップが落ちる。
          DEPLOY_FOLDERS="scrapmemo-petapeta mom-counter realestate-calc nyanko-ice:www cyborg-defense:www color-gravity:www neko-escape:www piyo-defense:www"

          # 各フォルダを一時保存
          for ENTRY in $DEPLOY_FOLDERS; do
            DEST="${ENTRY%%:*}"
            SUB="${ENTRY#*:}"
            # `:` を書いていないときは ${ENTRY#*:} が丸ごと返るので、その場合だけ同名扱い。
            # ここを `[ … ] && SRC=…` で書くと、`:` 無しの行でリスト全体が非0になり、
            # GitHub Actions の `bash -e` がステップごと落ちる。if で書くこと。
            if [ "$SUB" != "$ENTRY" ]; then
              SRC="$DEST/$SUB"
            else
              SRC="$DEST"
            fi
            if [ ! -f "$SRC/index.html" ]; then
              echo "ERROR: $SRC/index.html がありません"
              exit 1
            fi
            cp -r "$SRC" "/tmp/$DEST"
          done

          # gh-pagesブランチに切り替え
          git fetch origin gh-pages
          git checkout gh-pages

          # 各フォルダをコピー＆検証
          for ENTRY in $DEPLOY_FOLDERS; do
            FOLDER="${ENTRY%%:*}"
            SRC_SHA=$(sha256sum /tmp/$FOLDER/index.html | awk '{print $1}')
            rm -rf ./$FOLDER
            cp -r /tmp/$FOLDER ./$FOLDER
            DEST_SHA=$(sha256sum ./$FOLDER/index.html | awk '{print $1}')
            if [ "$SRC_SHA" != "$DEST_SHA" ]; then
              echo "ERROR: $FOLDER のコピーに失敗しました（チェックサム不一致）"
              exit 1
            fi
            echo "$FOLDER: チェックサム一致"
            git add $FOLDER/
          done

          # 変更があればコミット＆プッシュ
          if git diff --cached --quiet; then
            echo "変更なし、スキップ"
          else
            # 1行目だけ使う（複数行のメッセージをそのまま渡すと読みにくい）
            SUBJECT="${HEAD_COMMIT_MESSAGE%%$'\n'*}"
            git commit -m "Deploy: ${SUBJECT}"
            git push origin gh-pages
          fi
