<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>にゃんこアイス 🍦</title>
<style>
  /* 日本語フォント: Zen Maru Gothic（Google Fonts・SIL OFL 1.1／商用可・埋め込み可・再配布可）
     使う文字だけに絞って同梱している。文言を変えたら tools/fetch-font.py を流し直すこと。 */
  @font-face{
    font-family:'Zen Maru Gothic'; font-style:normal; font-weight:500; font-display:block;
    src:url('assets/fonts/ZenMaruGothic-500.woff2') format('woff2');
  }
  @font-face{
    font-family:'Zen Maru Gothic'; font-style:normal; font-weight:900; font-display:block;
    src:url('assets/fonts/ZenMaruGothic-900.woff2') format('woff2');
  }
  :root{
    --cream:#FFF6E6;
    --wood:#B07B4E;
    --berry:#FF6F91;
    --mint:#5FD3C0;
    --cocoa:#6B4A32;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; height:100%; }
  body{
    background:
      radial-gradient(circle at 18% 8%,  #FFE3B8 0%, transparent 52%),
      radial-gradient(circle at 88% 4%,  #FFC7D6 0%, transparent 48%),
      linear-gradient(165deg, #FFF1DC 0%, #FBD9C0 55%, #F3BEA8 100%);
    display:flex; align-items:center; justify-content:center;
    min-height:100%;
    font-family:'Zen Maru Gothic',"Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;
    font-weight:500;
    overflow:hidden;
  }
  #stage{ display:flex; flex-direction:column; align-items:center; gap:7px; }
  #wrap{
    position:relative;
    width:min(100vw, 50vh);
    max-width:470px;
    aspect-ratio:500/760;
    box-shadow:0 18px 44px rgba(150,90,60,.34), 0 0 0 5px #fff, 0 0 0 8px rgba(255,255,255,.45);
    border-radius:26px;
    overflow:hidden;
  }
  canvas{ display:block; width:100%; height:100%; border-radius:26px; cursor:pointer; }
  /* ヒントと音ボタンはキャンバスの外に出す。
     中に置くとコーンやカウンターに重なって読めないうえ、
     音ボタンは canvas の当たり判定を増やすことになり、ゲーム操作と競合する */
  #bar{
    width:min(100vw, 50vh); max-width:470px;
    display:flex; align-items:center; gap:8px;
  }
  #hint{
    flex:1; min-width:0; text-align:center; pointer-events:none;
    background:rgba(255,252,244,.9); color:#7A5334;
    font-size:11px; font-weight:500; letter-spacing:.02em;
    padding:6px 10px; border-radius:999px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    box-shadow:0 2px 6px rgba(120,80,50,.18);
  }
  #mute{
    flex:none; width:34px; height:34px; border:none; cursor:pointer;
    border-radius:50%; font-size:16px; line-height:1;
    background:rgba(255,252,244,.9); color:#7A5334;
    box-shadow:0 2px 6px rgba(120,80,50,.18);
  }
  #mute:active{ transform:translateY(1px); }
  /* 2026-08-28: 広告（バナー／全画面／リワード）は全部外した。オーナー判断で広告なしで配信する。
     戻すときは git 履歴の 942174fe 以前を見ること（AdMob の呼び出しごと消してある）。 */
</style>
</head>
<body>
<div id="stage">
  <div id="wrap">
    <canvas id="game" width="500" height="760"></canvas>

  </div>

  <div id="bar">
    <div id="hint">コーンをタップ → 移動先をタップ（どこでもOK）</div>
    <button id="mute" type="button" aria-label="音のオン・オフ" aria-pressed="false">🔊</button>
  </div>
</div>

<script>
"use strict";
(function(){

/* ===================== 定数・設定 ===================== */
const W = 500, H = 760;
const LANES = 5;          // コーンの本数
const MAXH  = 7;          // 1コーンの最大段数
const R     = 20;         // アイスの半径（直径40px）
const STEP  = 40;         // 段の高さ
const BASEY = 684;        // 一番下(1段目)のアイス中心Y
const LANE_W = W / LANES; // 100
const laneX = c => LANE_W * c + LANE_W / 2;       // 50,150,...,450
const ORDER_BOARD = { x: 78, y: 66 };             // 星が飛んでいく先

/* ===================== 内装（見た目の骨格） =====================
   画面を「アイス屋の店内」として3層に割っている。
     0〜112      木の看板（スコア・注文・つぎ が載る）
     112〜300    明るい店内の壁（丸窓・ペンダントライト・ネコ店長）
     300〜706    冷凍ショーケース（★ここだけ意図的に暗い）
     706〜760    手前のカウンター
   ショーケースの中を暗くしているのは装飾ではなく必要から。アイスはぜんぶ淡い色
   （バニラ #FFF6E0 など）なので、明るい背景に置くと輪郭が消える。
   逆に画面ぜんぶを暗くすると「アイス屋」に見えない。だから上を明るく、
   アイスが乗る場所だけを冷たい紺にしている。 */
const SIGN_H   = 112;
const CASE_TOP = 344;
const CASE_BOT = 706;

// 書体（Zen Maru Gothic・SIL OFL）。読み込めない環境でも豆腐にならないよう既定を並べる
const FF = '"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif';
const F  = (px, w) => (w || 900) + ' ' + px + 'px ' + FF;

// 縁取り文字（明るい背景の上でも読めるように）
function outlined(text, x, y, fill, edge, lw){
  ctx.lineJoin = 'round';
  ctx.lineWidth = lw || 5;
  ctx.strokeStyle = edge;
  ctx.strokeText(text, x, y);
  ctx.fillStyle = fill;
  ctx.fillText(text, x, y);
}

// フレーバー定義（後半ほどステージが上がると登場）
const FLAV = {
  vanilla:    { color:'#FFF6E0', shade:'#EBD9AE' },
  choco:      { color:'#A1715B', shade:'#5D4037' },
  strawberry: { color:'#FF9EBB', shade:'#EC5F86' },
  mint:       { color:'#A8E6D5', shade:'#3FAE97' },   // STAGE3〜
  soda:       { color:'#8FD8FB', shade:'#29B6F6' },   // STAGE5〜
  grape:      { color:'#BBA4E6', shade:'#7E57C2' },   // STAGE7〜
  rainbow:    { color:'#FFFFFF', shade:'#DDDDDD' },   // ワイルド（どの色にも化ける）
};
const FLAVS = ['vanilla','choco','strawberry','mint','soda','grape']; // rainbowは含めない（注文色にならない）
// そのステージで使える色数（3色→3,5,7ステージで1色ずつ追加）
const flavCount = s => Math.min(FLAVS.length, 3 + (s>=3?1:0) + (s>=5?1:0) + (s>=7?1:0));
const randFlav  = () => FLAVS[(Math.random()*flavCount(stage))|0];

// Nextの生成：たまにレインボーアイスが出る
const RAINBOW_CHANCE = 0.10;
const genNext = () => Math.random() < RAINBOW_CHANCE ? 'rainbow' : randFlav();
// 注文一致判定：レインボーはどの色とも一致するワイルド
const wild = (flavor, want) => flavor === want || flavor === 'rainbow';

// ネコ店長の猫種（ステージごとに変わる）
const CATS = [
  { name:'ロシアンブルー', fur:['#CAD4DA','#A6B4BC','#788C97'], ear:'#8C9BA5', eye:'#66BB6A', pupil:'#1B5E20', mark:'none' },
  { name:'ちゃトラ',       fur:['#FFE0B2','#FFB74D','#EF8C2E'], ear:'#FB8C00', eye:'#FFCA28', pupil:'#5D4037', mark:'tabby' },
  { name:'くろねこ',       fur:['#62757F','#41525B','#28353B'], ear:'#28353B', eye:'#FFD54F', pupil:'#2E2E1B', mark:'none' },
  { name:'しろねこ',       fur:['#FFFFFF','#ECEFF1','#CBD3D8'], ear:'#E0E4E6', eye:'#4FC3F7', pupil:'#0277BD', mark:'none' },
  { name:'みけねこ',       fur:['#FFFFFF','#F4F4F4','#DCCFC8'], ear:'#E5DAD4', eye:'#9CCC65', pupil:'#33691E', mark:'calico' },
  { name:'シャムねこ',     fur:['#F5EAD4','#E7D3B0','#CDAE82'], ear:'#7A584A', eye:'#4FC3F7', pupil:'#01579B', mark:'point' },
];
const catOf = s => CATS[(s-1) % CATS.length];

/* ===================== ゲーム状態 ===================== */
let cones, order, nextFlav, score, combo, prevOrder, selected, particles,
    gameOver, catSuccess, last,
    stage, ordersLeft, stageClear, dropTimer;

const quotaOf    = s => 4 + s;                       // ステージごとのノルマ(注文数)
const intervalOf = s => Math.max(3.5, 7.0 - (s-1)*0.3); // 落下間隔(秒)

/* ---- 進行状況のセーブ／ロード ---- */
const SAVE_KEY = 'nyanko_ice_save';
function saveProgress(){
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ stage, score, ordersLeft })); } catch(e){}
}
function loadProgress(){
  try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s && s.stage>=1) return s; } catch(e){}
  return null;
}
function clearProgress(){ try { localStorage.removeItem(SAVE_KEY); } catch(e){} }

// 起動時：セーブがあれば続きから、無ければ最初から
function boot(){
  const s = loadProgress();
  if (s){
    stage = s.stage; score = s.score;
    gameOver = false;
    startStage();
    ordersLeft = s.ordersLeft;           // ステージ途中の残数も復元
  } else {
    reset();
  }
}

// 最初から（ステージ1）
function reset(){
  stage = 1;
  score = 0;
  gameOver = false;
  startStage();
  saveProgress();
}

// コンテニュー：今のステージ・スコア・注文の残数を引き継いで再開
function continueStage(){
  gameOver = false;
  const keep = ordersLeft;
  startStage();
  ordersLeft = keep;
  saveProgress();
}

function startStage(fresh){
  cones = [[],[],[],[],[]];
  order = makeOrder();
  prevOrder = null;
  nextFlav = genNext();
  combo = 0;
  selected = -1;
  particles = [];
  catSuccess = 0;
  stageClear = false;
  ordersLeft = quotaOf(stage);
  dropTimer = intervalOf(stage);

  // 初期配置：各コーンに 2〜3 個ランダムに積む
  for (let c=0;c<LANES;c++){
    const n = 2 + ((Math.random()*2)|0);
    for (let i=0;i<n;i++) cones[c].push(mkIce(randFlav(), laneX(c), BASEY - i*STEP));
  }
  layout(true);
}

function advanceStage(){
  stage++;
  startStage();
  saveProgress();
}

// seed はスプリンクル（粒）の並びを1個ごとに固定するためのもの。
// 毎フレーム乱数を引くと粒がちらつくので、生成時に1回だけ決める。
function mkIce(flavor, x, y){ return { flavor, x, y, tx:x, ty:y, flight:null, seed:Math.random()*1000 }; }
function makeOrder(){ return [randFlav(), randFlav(), randFlav()]; }
const eqArr = (a,b) => a && b && a.length===b.length && a.every((v,i)=>v===b[i]);

/* ===================== レイアウト（目標位置の算出） ===================== */
function layout(snap){
  for (let c=0;c<LANES;c++){
    const col = cones[c];
    for (let i=0;i<col.length;i++){
      const ice = col[i];
      ice.tx = laneX(c);
      ice.ty = BASEY - i*STEP;
      // 選択中コーンの一番上は「肉球が掴んで」少し浮く
      if (c===selected && i===col.length-1) ice.ty -= 30;
      if (snap){ ice.x = ice.tx; ice.y = ice.ty; }
    }
  }
}

/* ===================== 入力 ===================== */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// 高解像度対応
const dpr = Math.min(window.devicePixelRatio||1, 2);
canvas.width = W*dpr; canvas.height = H*dpr;
canvas.style.width='100%'; canvas.style.height='100%';
ctx.scale(dpr,dpr);

let audio;
let nowT = 0;  // 経過秒（レインボーの色変化アニメ用）

/* 広告は 2026-08-28 に全部外した（オーナー判断で広告なしで配信）。
   AdMob の初期化・バナー・全画面・リワード、およびブラウザ用のモックまで削除している。
   ゲームオーバーからの「コンテニュー」は、動画視聴の代わりに無条件で行えるようにした。
   戻すときはコミット 942174fe 以前の同ファイルを見ること。 */

/* ===================== 音 =====================
   ★いま音のファイルは1つも同梱していない。ぜんぶ WebAudio の合成音。
     容量が増えず、素材のライセンスを持ち込まずに済むため。

   録音した素材に差し替えたいとき（耳で確かめられる人がやること）:
     1. www/assets/audio/ に tap.mp3 place.mp3 … を置く（名前は SFX_FILES のとおり）
     2. 下の USE_FILES を true にする  ← コードの変更はこれだけ
     3. 見つからないファイルは、そのキーだけ合成音のまま鳴る（落ちない）

   ★持ち込んでよい素材: **商用可 かつ 再配布可** のものだけ。
     このリポジトリは public で、GitHub Pages で配信し、App Store にも出す（＝商用）。
     効果音ラボ（商用可・クレジット表記不要）か CC0 が安全。
     クレジット表記が要る素材（魔王魂など）は、アプリ内に表記欄を作らない限り使わない。 */
const USE_FILES = false;
const AUDIO_DIR = 'assets/audio/';
const SFX_FILES = {
  tap:'tap.mp3', place:'place.mp3', ng:'ng.mp3', drop:'drop.mp3', sell:'sell.mp3',
  combo:'combo.mp3', cup:'cup.mp3', perfect:'perfect.mp3', clear:'clear.mp3', over:'over.mp3',
};

let masterGain=null, sfxGain=null, musGain=null;
const buffers = {};
let soundOn = true;
try { soundOn = localStorage.getItem('nyanko_ice_sound') !== 'off'; } catch(e){}

// iOS は「画面を触るまで」音を出せないので、最初の pointerdown で作る
function initAudio(){
  if (audio){ if (audio.state==='suspended') audio.resume(); return; }
  try { audio = new (window.AudioContext||window.webkitAudioContext)(); }
  catch(e){ return; }
  masterGain = audio.createGain(); masterGain.gain.value = soundOn ? 1 : 0;
  masterGain.connect(audio.destination);
  sfxGain = audio.createGain(); sfxGain.gain.value = 0.9;  sfxGain.connect(masterGain);
  musGain = audio.createGain(); musGain.gain.value = 0.30; musGain.connect(masterGain);
  if (USE_FILES) loadSfxFiles();
  startMusic();
}

function loadSfxFiles(){
  for (const key in SFX_FILES){
    fetch(AUDIO_DIR + SFX_FILES[key])
      .then(r => r.ok ? r.arrayBuffer() : Promise.reject(new Error('404')))
      .then(b => audio.decodeAudioData(b))
      .then(buf => { buffers[key] = buf; })
      .catch(()=>{});      // 無ければ、そのキーだけ合成音のまま
  }
}

function setSound(on){
  soundOn = on;
  try { localStorage.setItem('nyanko_ice_sound', on ? 'on' : 'off'); } catch(e){}
  if (masterGain) masterGain.gain.setTargetAtTime(on?1:0, audio.currentTime, 0.02);
  const b = document.getElementById('mute');
  if (b){ b.textContent = on ? '🔊' : '🔇'; b.setAttribute('aria-pressed', String(!on)); }
}

// 1音。立ち上がりと減衰を付けないと「ピー」と鳴りっぱなしに聞こえる
function voice(freq, when, dur, type, gain, dest, slideTo){
  if (!audio) return;
  const o=audio.createOscillator(), g=audio.createGain();
  o.type=type||'sine';
  o.frequency.setValueAtTime(freq, when);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, when+dur);
  g.gain.setValueAtTime(0.0001, when);
  g.gain.exponentialRampToValueAtTime(gain, when+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, when+dur);
  o.connect(g); g.connect(dest||sfxGain);
  o.start(when); o.stop(when+dur+0.02);
}

function sfx(name, n){
  if (!audio || !soundOn) return;
  if (buffers[name]){                     // 差し替えたファイルがあればそちらを鳴らす
    const s=audio.createBufferSource(); s.buffer=buffers[name];
    s.connect(sfxGain); s.start(); return;
  }
  const t = audio.currentTime;
  const seq = (notes, step, dur, type, gain) =>
    notes.forEach((f,i)=>voice(f, t+i*step, dur, type, gain));
  switch(name){
    case 'tap':     voice(660,t,0.09,'triangle',0.16,null,900); break;
    case 'place':   voice(520,t,0.14,'sine',0.20,null,780);
                    voice(1040,t+0.02,0.09,'triangle',0.06); break;
    case 'ng':      voice(200,t,0.16,'sawtooth',0.09,null,120); break;
    case 'drop':    voice(300+(n||0)*34,t,0.10,'sine',0.11,null,210+(n||0)*26); break;
    case 'sell':    seq([880,1174.7], 0.07, 0.28,'triangle',0.15); break;
    case 'combo':   seq([880,1108.7,1318.5,1760], 0.055, 0.30,'triangle',0.14); break;
    case 'cup':     seq([1046.5,1568], 0.06, 0.34,'sine',0.16); break;
    case 'perfect': seq([1046.5,1318.5,1568,2093], 0.07, 0.45,'triangle',0.15); break;
    case 'clear':   seq([784,1046.5,1318.5,1568], 0.12, 0.50,'triangle',0.17); break;
    case 'over':    voice(330,t,0.50,'sawtooth',0.12,null,110);
                    voice(220,t+0.16,0.60,'sine',0.09,null,90); break;
  }
}

/* BGM。ハ長調のペンタトニック（ド・レ・ミ・ソ・ラ）だけを使う。
   どの順に鳴らしても濁らないので、短いループでも耳障りになりにくい。 */
const MUSIC = {
  step:0, next:0, timer:null, bpm:104,
  mel : [0,4,7,4, 9,7,4,2, 0,4,7,12, 9,7,4,0,
         2,5,9,5, 7,4,2,0, 2,7,9,7, 4,2,0,-3],
  bass: [0,0,-5,-5, -3,-3,-5,-5],
};
function startMusic(){
  if (!audio || MUSIC.timer) return;
  MUSIC.next = audio.currentTime + 0.15;
  MUSIC.timer = setInterval(musicTick, 90);
}
// 先読みして予約する方式。setInterval で直接鳴らすとタイミングがぶれる
function musicTick(){
  if (!audio) return;
  if (musGain) musGain.gain.setTargetAtTime(0.30, audio.currentTime, 0.05);
  const eighth = 60/MUSIC.bpm/2;
  if (MUSIC.next < audio.currentTime) MUSIC.next = audio.currentTime + 0.05;  // 復帰時の一気鳴り防止
  while (MUSIC.next < audio.currentTime + 0.3){
    const t = MUSIC.next, s = MUSIC.step;
    voice(523.25*Math.pow(2, MUSIC.mel[s % MUSIC.mel.length]/12),
          t, eighth*1.6, 'triangle', 0.055, musGain);
    if (s % 2 === 0){
      voice(130.81*Math.pow(2, MUSIC.bass[(s>>1) % MUSIC.bass.length]/12),
            t, eighth*1.8, 'sine', 0.075, musGain);
    }
    MUSIC.next += eighth; MUSIC.step++;
  }
}

// 裏に回ったら止める（電池とスピーカーの行儀）
document.addEventListener('visibilitychange', ()=>{
  if (!audio) return;
  if (document.hidden) audio.suspend(); else audio.resume();
});

canvas.addEventListener('pointerdown', e=>{
  initAudio();
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX-rect.left) * (W/rect.width);
  const y = (e.clientY-rect.top)  * (H/rect.height);

  if (gameOver){
    // コンテニュー（広告を外したので、動画視聴なしでそのまま再開できる）
    if (x>W/2-110 && x<W/2+110 && y>444 && y<500){
      continueStage();
    } else if (x>W/2-110 && x<W/2+110 && y>512 && y<562){ clearProgress(); reset(); } // さいしょから
    return;
  }
  if (stageClear){
    if (x>W/2-90 && x<W/2+90 && y>470 && y<532) advanceStage();   // つぎのステージへ
    return;
  }
  const c = Math.max(0, Math.min(LANES-1, (x/LANE_W)|0));
  tap(c);
});

function tap(c){
  if (selected===-1){
    if (cones[c].length>0){ selected=c; sfx('tap'); layout(); }
    return;
  }
  if (c===selected){ selected=-1; layout(); return; } // 選択解除
  if (canMove(selected, c)){
    const ice = cones[selected].pop();
    cones[c].push(ice);
    selected = -1;
    sfx('place');
    layout();                                              // 目標スロット確定
    ice.flight = { x0: ice.x, y0: ice.y, t: 0, dur: 0.38 }; // すくって弧を描いて落とす
    resolveSales();
    checkAllFull();
  } else {
    selected = -1;               // 条件を満たさなければキャンセル
    sfx('ng');
    layout();
  }
}

const topOf = col => col[col.length-1];
function canMove(src,dst){
  if (cones[src].length===0) return false;   // 掴むアイスが無い
  if (cones[dst].length>=MAXH) return false; // 移動先が満杯
  return true;                               // 色に関係なく自由に移動OK
}

/* ===================== 注文の判定と売却 ===================== */
function resolveSales(){
  let guard = 0;
  while (guard++ < 40){
    let sold = false;
    for (let c=0;c<LANES && !sold;c++){
      const col = cones[c];
      for (let s=0; s+3<=col.length; s++){
        if (wild(col[s].flavor,order[0]) && wild(col[s+1].flavor,order[1]) && wild(col[s+2].flavor,order[2])){
          sellAt(c, s);
          sold = true;
          break;
        }
      }
    }
    if (!sold || stageClear) break;
  }
}

function sellAt(c, start){
  const isCombo = eqArr(order, prevOrder);
  if (isCombo) combo++; else combo = 0;
  const pts = 100 * (isCombo ? 2 : 1) * stage;
  score += pts;

  // 星パーティクル＆消滅
  const removed = cones[c].splice(start, 3);
  for (const ice of removed) burstStars(ice.tx, ice.ty, isCombo); // 正しいスロット位置で弾けさせる

  // カップ全消しボーナス
  if (cones[c].length===0){
    const bonus = 500 * stage; score += bonus;
    popText('カップすっきり! +¥'+bonus, laneX(c), BASEY-70, '#FFD700');
    burstStars(laneX(c), BASEY-90, true);
    sfx('cup');
    if (cones.every(col=>col.length===0)){     // 盤面まるごと全消し
      const big = 2000 * stage; score += big;
      popText('PERFECT!! +¥'+big, W/2, 300, '#FF80AB');
      for (let i=0;i<LANES;i++) burstStars(laneX(i), BASEY-120, true);
      sfx('perfect');
    }
  }

  ordersLeft--;                    // 注文の残数を減らす
  prevOrder = order.slice();
  order = makeOrder();             // 次の注文へ
  catSuccess = 1.3;                // ネコ店長 喜ぶ
  spawnHearts();

  sfx(isCombo ? 'combo' : 'sell');

  layout();
  saveProgress();
  if (ordersLeft<=0) doStageClear();  // ノルマ達成でステージクリア
}

/* ===================== 落下補充ロジック（一定時間で1個ずつ） ===================== */
function timedDrop(){
  const avail = [];
  for (let c=0;c<LANES;c++) if (cones[c].length < MAXH) avail.push(c);
  if (avail.length===0){ triggerGameOver(); return; }   // 落とす場所が無い＝満タン
  const c = avail[(Math.random()*avail.length)|0];
  cones[c].push(mkIce(nextFlav, laneX(c), -50));         // 画面外上部から
  nextFlav = genNext();
  layout();
  sfx('drop', cones[c].length);
  resolveSales();
  checkAllFull();
}

/* ===================== ネコ店長 ===================== */
function spawnHearts(){
  for (let i=0;i<4;i++){
    particles.push({
      type:'heart',
      x: 250 + (Math.random()*60-30),
      y: 200,
      vx:(Math.random()*40-20), vy:-(50+Math.random()*40),
      life:1.1, max:1.1,
      color: Math.random()<0.5 ? '#FF80AB' : '#FFD54F',
      size: 9+Math.random()*6, rot:0, vr:0
    });
  }
}

/* ===================== パーティクル（星） ===================== */
function burstStars(x,y,gold){
  const n = 22 + ((Math.random()*6)|0);
  for (let i=0;i<n;i++){
    const a = (Math.PI*2*i)/n + Math.random()*0.5;
    const sp = 120 + Math.random()*180;
    particles.push({
      type:'star',
      x, y,
      vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
      tx: ORDER_BOARD.x, ty: ORDER_BOARD.y,
      life: 1.0 + Math.random()*0.7, max: 1.7,
      color: gold ? '#FFD700' : pickStarColor(),
      size: 6 + Math.random()*7,
      rot: Math.random()*Math.PI, vr: (Math.random()*8-4)
    });
  }
}
function pickStarColor(){
  const c = ['#FFFFFF','#FF80AB','#FFD54F','#B3E5FC'];
  return c[(Math.random()*c.length)|0];
}
function popText(text,x,y,color){
  particles.push({ type:'text', text, x, y, vx:0, vy:-26, life:1.7, max:1.7, color, size:18, rot:0, vr:0 });
}

function updateParticles(dt){
  for (let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.life -= dt;
    if (p.type==='star'){
      const ax = (p.tx - p.x), ay = (p.ty - p.y);
      const pull = (1 - p.life/p.max) * 6;   // 時間が経つほど注文ボードへ吸い込まれる
      p.vx = p.vx*0.90 + ax*pull*dt;
      p.vy = p.vy*0.90 + ay*pull*dt;
    } else if (p.type==='heart'){
      p.vy += 30*dt; // ほんの少しだけ重力
    } // text はそのまま上昇
    p.x += p.vx*dt; p.y += p.vy*dt; p.rot += p.vr*dt;
    if (p.life<=0) particles.splice(i,1);
  }
}

/* ===================== クリア / ゲームオーバー ===================== */
function doStageClear(){
  stageClear = true;
  selected = -1;
  sfx('clear');
}
function checkAllFull(){
  if (gameOver || stageClear) return;
  for (const col of cones) if (col.length < MAXH) return; // 1つでも空きがあればOK
  triggerGameOver();
}
function triggerGameOver(){
  if (gameOver) return;
  gameOver = true;
  sfx('over');
}

/* ===================== 描画 ===================== */
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

  ctx.strokeStyle='#FFF8EC'; ctx.lineWidth=7;

function rainbowGrad(x, y, r){
  const hue = (nowT*70) % 360;
  const g = ctx.createLinearGradient(x-r, y-r, x+r, y+r);
  for (let i=0;i<=6;i++) g.addColorStop(i/6, 'hsl('+((hue+i*60)%360)+',85%,66%)');
  return g;
}
function starPath(x,y,r){
  ctx.beginPath();
  for (let i=0;i<5;i++){
    let a=-Math.PI/2 + i*2*Math.PI/5;
    ctx.lineTo(x+Math.cos(a)*r, y+Math.sin(a)*r);
    a += Math.PI/5;
    ctx.lineTo(x+Math.cos(a)*r*0.45, y+Math.sin(a)*r*0.45);
  }
  ctx.closePath();
}

function drawIce(ice){
  const rainbow = ice.flavor==='rainbow';
  // 本体（やわらかい影つき）
  ctx.save();
  ctx.shadowColor='rgba(20,24,70,.30)'; ctx.shadowBlur=9; ctx.shadowOffsetY=4;
  if (rainbow){
    ctx.fillStyle = rainbowGrad(ice.x, ice.y, R);
  } else {
    const f = FLAV[ice.flavor];
    const g = ctx.createRadialGradient(ice.x-7, ice.y-9, 3, ice.x, ice.y, R+2);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(0.28, f.color);
    g.addColorStop(1, f.shade);
    ctx.fillStyle=g;
  }
  ctx.beginPath(); ctx.arc(ice.x, ice.y, R, 0, Math.PI*2); ctx.fill();
  ctx.restore();
  // 下側の陰影（立体感）
  ctx.save();
  ctx.beginPath(); ctx.arc(ice.x, ice.y, R, 0, Math.PI*2); ctx.clip();
  ctx.fillStyle='rgba(0,0,0,.12)';
  ctx.beginPath(); ctx.ellipse(ice.x, ice.y+R*0.55, R, R*0.75, 0,0,Math.PI*2); ctx.fill();
  ctx.restore();
  // スクープの筋（ディッシャーですくった跡）
  ctx.save();
  ctx.beginPath(); ctx.arc(ice.x, ice.y, R, 0, Math.PI*2); ctx.clip();
  ctx.strokeStyle='rgba(255,255,255,.22)'; ctx.lineWidth=2.4;
  for (const d of [-8, 2, 12]){
    ctx.beginPath();
    ctx.arc(ice.x+d, ice.y+R*0.9, R*0.95, Math.PI*1.22, Math.PI*1.78);
    ctx.stroke();
  }
  ctx.restore();
  // リムライト
  ctx.lineWidth=2; ctx.strokeStyle='rgba(255,255,255,.55)';
  ctx.beginPath(); ctx.arc(ice.x, ice.y, R-1, Math.PI*1.05, Math.PI*1.8); ctx.stroke();
  // スプリンクル（粒）。並びは seed で固定してあるのでちらつかない
  if (!rainbow){
    const f = FLAV[ice.flavor];
    ctx.save();
    ctx.beginPath(); ctx.arc(ice.x, ice.y, R-3, 0, Math.PI*2); ctx.clip();
    for (let i=0;i<5;i++){
      const a = ice.seed*0.017 + i*1.257;
      const d = 5 + ((ice.seed*(i+3)) % 9);
      const px = ice.x + Math.cos(a)*d, py = ice.y + Math.sin(a)*d + 2;
      ctx.save(); ctx.translate(px,py); ctx.rotate(a*1.7);
      ctx.fillStyle = (i%2) ? 'rgba(255,255,255,.75)' : f.shade;
      roundRect(-2.6,-1,5.2,2,1); ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }
  // 光沢
  ctx.fillStyle='rgba(255,255,255,.92)';
  ctx.beginPath(); ctx.ellipse(ice.x-6, ice.y-8, 5.5, 3.6, -0.5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.55)';
  ctx.beginPath(); ctx.arc(ice.x+6, ice.y-2, 1.8, 0,Math.PI*2); ctx.fill();
  // レインボーは中央に★で識別
  if (ice.flavor==='rainbow'){
    ctx.save();
    ctx.shadowColor='rgba(0,0,0,.3)'; ctx.shadowBlur=3;
    ctx.fillStyle='rgba(255,255,255,.95)';
    starPath(ice.x, ice.y+1, 7); ctx.fill();
    ctx.restore();
  }
}

// 「カウンターの向こうに立っている」ように見える
function drawCatBody(){
  const cx=CAT.x, cy=CAT.y;
  const { cat } = catMood();
  // 腕（肩からケースの縁へ）
  ctx.strokeStyle=cat.fur[1]; ctx.lineWidth=19; ctx.lineCap='round';
  for (const s of [-1,1]){
    ctx.beginPath();
    ctx.moveTo(cx+s*46, cy+50);
    ctx.quadraticCurveTo(cx+s*92, cy+60, cx+s*96, CASE_TOP-8);
    ctx.stroke();

  // 胴
  const bg=ctx.createLinearGradient(cx-78,0,cx+78,0);
  bg.addColorStop(0,cat.fur[2]); bg.addColorStop(.5,cat.fur[1]); bg.addColorStop(1,cat.fur[2]);
  ctx.fillStyle=bg;
  ctx.beginPath();
  ctx.moveTo(cx-46, cy+30);
  ctx.quadraticCurveTo(cx-82, cy+74, cx-80, CASE_TOP+20);
  ctx.lineTo(cx+80, CASE_TOP+20);

function drawStar(p){
  ctx.save();
  ctx.globalAlpha = Math.max(0, Math.min(1, p.life/0.6));
  ctx.translate(p.x,p.y); ctx.rotate(p.rot);
  ctx.fillStyle=p.color;
  ctx.beginPath();
  for (let i=0;i<5;i++){
    const o=p.size, inr=p.size*0.45;
    let a=-Math.PI/2 + i*2*Math.PI/5;
    ctx.lineTo(Math.cos(a)*o, Math.sin(a)*o);
    a += Math.PI/5;
    ctx.lineTo(Math.cos(a)*inr, Math.sin(a)*inr);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}
function drawHeart(p){
  ctx.save();
  ctx.globalAlpha=Math.max(0,Math.min(1,p.life/1.1));
  ctx.translate(p.x,p.y); ctx.fillStyle=p.color;
  const s=p.size;
  ctx.beginPath();
  ctx.moveTo(0,s*0.3);
  ctx.bezierCurveTo(0,-s*0.2, -s, -s*0.2, -s, s*0.25);
  ctx.bezierCurveTo(-s, s*0.7, 0, s*0.9, 0, s*1.2);
  ctx.bezierCurveTo(0, s*0.9, s, s*0.7, s, s*0.25);
  ctx.bezierCurveTo(s, -s*0.2, 0, -s*0.2, 0, s*0.3);
  ctx.fill();
  ctx.restore();
}

function drawText(p){
  ctx.save();
  ctx.globalAlpha = Math.max(0, Math.min(1, p.life/0.8));
  ctx.font=F(p.size,900); ctx.textAlign='center';
  ctx.lineJoin='round'; ctx.lineWidth=5; ctx.strokeStyle='rgba(255,255,255,.92)';
  ctx.strokeText(p.text, p.x, p.y);
  ctx.fillStyle=p.color; ctx.fillText(p.text, p.x, p.y);
  ctx.restore();
}
function drawParticles(){
  for (const p of particles){
    if (p.type==='star') drawStar(p);
    else if (p.type==='text') drawText(p);
    else drawHeart(p);
  }
}

/* ===================== メインループ ===================== */
function update(dt){
  // アイスを目標位置へ。移動中(flight)は弧を描いて「すくって落とす」
  for (const col of cones) for (const ice of col){
    if (ice.flight){
      const f = ice.flight; f.t += dt / f.dur;
      const t = Math.min(1, f.t);
      const te = t<0.5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2; // easeInOut
      const x1 = ice.tx, y1 = ice.ty;
      const mx = (f.x0 + x1) / 2;
      const peak = Math.min(f.y0, y1) - 100;                // 弧の頂点
      ice.x = (1-te)*(1-te)*f.x0 + 2*(1-te)*te*mx   + te*te*x1;
      ice.y = (1-te)*(1-te)*f.y0 + 2*(1-te)*te*peak + te*te*y1;
      if (t>=1) ice.flight = null;
    } else {
      ice.x += (ice.tx - ice.x) * Math.min(1, dt*14);
      ice.y += (ice.ty - ice.y) * Math.min(1, dt*14);
    }
  }
  if (catSuccess>0) catSuccess -= dt;
  updateParticles(dt);

  // 一定時間ごとにランダムなコーンへ1個落下
  if (!gameOver && !stageClear){
    dropTimer -= dt;
    if (dropTimer<=0){ timedDrop(); dropTimer = intervalOf(stage); }
  }
}

/* 描く順番＝奥から手前へ。
   店内 → ライト → ネコ店長 → ショーケース → 縁にのせた前足 → カウンター →
   コーン → アイス → ガラスの映り込み → 看板 → HUD → 星（看板の上を飛んで注文札へ吸い込まれる） */

  ctx.clearRect(0,0,W,H);
  drawShop();
  drawLamp(150,'#FF8FA8'); drawLamp(350,'#5FD3C0');
  drawCat();
  drawCase();
  drawCatPaws();
  drawCounter();
  drawCones();
  for (const col of cones) for (const ice of col) drawIce(ice);
  // 選択中の肉球
  if (selected>=0 && cones[selected].length>0) drawPaw(topOf(cones[selected]));
  drawGlass();
  drawSign();
  drawUI();
  drawParticles();
  if (stageClear) drawStageClear();
  if (gameOver) drawGameOver();
}

function frame(t){
  if (!last) last=t;
  let dt=(t-last)/1000; last=t;
  if (dt>0.05) dt=0.05;
  nowT += dt;
  update(dt); render();
  requestAnimationFrame(frame);
}

// 書体を先に取りに行く。canvas は CSS の font-display を見ないので、
// 明示的に load しないと最初の数フレームだけ既定書体で描かれてガタつく。
if (document.fonts && document.fonts.load){
  Promise.all([
    document.fonts.load('900 31px "Zen Maru Gothic"'),
    document.fonts.load('500 13px "Zen Maru Gothic"'),
  ]).catch(()=>{});
}

// 音のオン・オフ。押した時点で AudioContext を起こす（iOSは操作なしでは鳴らせない）
const muteBtn = document.getElementById('mute');
if (muteBtn){
  muteBtn.textContent = soundOn ? '🔊' : '🔇';
  muteBtn.setAttribute('aria-pressed', String(!soundOn));
  muteBtn.addEventListener('click', ()=>{ initAudio(); setSound(!soundOn); });
}

boot();
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
