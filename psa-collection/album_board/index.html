<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; font-family: -apple-system, "Hiragino Sans", sans-serif; background: transparent; }
  #hint {
    display: none; margin: 0 6px 8px; padding: 8px 12px; border-radius: 8px;
    background: #eff6ff; color: #1e40af; font-size: 12px; font-weight: 600;
    border: 1px solid #bfdbfe;
  }
  #hint.on { display: block; }
  #grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 6px; }
  .pocket {
    position: relative; border: 1px solid #e2e8f0; border-radius: 8px; background: #fff;
    padding: 6px; cursor: pointer; user-select: none; box-shadow: 0 1px 3px rgba(0,0,0,.06);
    transition: outline .1s, box-shadow .1s, transform .1s;
  }
  .pocket:hover { box-shadow: 0 3px 10px rgba(0,0,0,.14); }
  .pocket.selected {
    outline: 3px solid #2563eb; outline-offset: 2px;
    box-shadow: 0 10px 26px rgba(37,99,235,.35); transform: translateY(-2px);
  }
  body.picking .pocket:not(.selected):hover::after {
    content: "ここへ移動"; position: absolute; inset: 0; border-radius: 8px;
    background: rgba(37,99,235,.14); color: #1e40af; font-size: 12px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .pocket img { width: 100%; border-radius: 5px; display: block; pointer-events: none; -webkit-user-drag: none; }
  .cap { font-size: 11px; line-height: 1.25; margin-top: 4px; color: #334155; pointer-events: none; }
  .badge {
    position: absolute; top: 8px; left: 8px; font-size: 10px; font-weight: 700;
    color: #fff; padding: 2px 6px; border-radius: 6px; pointer-events: none;
  }
  .badge.home { background: #16a34a; }
  .badge.vault { background: #2563eb; }
  .empty { color: #94a3b8; font-size: 12px; text-align: center; padding: 30px 0; }
</style>
</head>
<body>
<div id="hint"></div>
<div id="grid"></div>
<script>
function send(type, extra) {
  window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, extra || {}), "*");
}
function setHeight() {
  send("streamlit:setFrameHeight", { height: document.documentElement.scrollHeight + 8 });
}
const grid = document.getElementById("grid");
const hint = document.getElementById("hint");
function currentOrder() {
  return Array.from(grid.querySelectorAll(".pocket")).map(function (el) { return el.dataset.cert; });
}

let selected = null;

function setHint(on) {
  document.body.classList.toggle("picking", on);
  hint.classList.toggle("on", on);
  hint.textContent = on ? "移動するカードを選びました。➡ 移動先のカードをタップしてください（もう一度同じカードで取消）" : "";
}

function clearSelection() {
  if (selected) selected.classList.remove("selected");
  selected = null; setHint(false);
}

function onClick(e) {
  const pocket = e.target && e.target.closest ? e.target.closest(".pocket") : null;
  if (!pocket || pocket.parentNode !== grid) return;
  if (!selected) {
    selected = pocket; pocket.classList.add("selected"); setHint(true);
    return;
  }
  if (pocket === selected) { clearSelection(); return; }
  // 移動：前方への移動なら対象の後ろへ、後方なら対象の前へ挿入
  const kids = Array.from(grid.children);
  const forward = kids.indexOf(selected) < kids.indexOf(pocket);
  grid.insertBefore(selected, forward ? pocket.nextSibling : pocket);
  clearSelection();
  send("streamlit:setComponentValue", { value: currentOrder(), dataType: "json" });
}
grid.addEventListener("click", onClick);
document.addEventListener("dragstart", function (e) { e.preventDefault(); });

function build(cards) {
  clearSelection();
  grid.innerHTML = "";
  if (!cards || !cards.length) {
    grid.innerHTML = "<div class='empty'>まだカードがありません。「➕ カードを追加」から入れてください。</div>";
    setHeight(); return;
  }
  cards.forEach(function (c) {
    const d = document.createElement("div");
    d.className = "pocket";
    d.dataset.cert = c.cert;
    const bClass = c.loc === "Vault" ? "vault" : "home";
    const bText = c.loc === "Vault" ? "VAULT" : "HOME";
    d.innerHTML =
      "<span class='badge " + bClass + "'>" + bText + "</span>" +
      (c.img ? "<img src='" + c.img + "'>" : "<div class='empty'>画像なし</div>") +
      "<div class='cap'>PSA " + (c.grade || "") + "<br>" + (c.name || "") + "</div>";
    grid.appendChild(d);
  });
  setHeight();
}

window.addEventListener("message", function (e) {
  if (!e.data || e.data.type !== "streamlit:render") return;
  build((e.data.args && e.data.args.cards) || []);
});
send("streamlit:componentReady", { apiVersion: 1 });
setHeight();
window.addEventListener("resize", setHeight);
</script>
</body>
</html>
